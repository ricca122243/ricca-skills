<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Истикама</title>
<meta name="description" content="Дисциплина каждый день: дела, еда, вода, деньги, книга, отчёт и награды">
<meta name="theme-color" content="#f6f6f3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Истикама">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{
  --bg:#ffffff; --soft:#f4f4f6; --soft2:#ececf0; --line:#e4e4e9; --text:#111114; --muted:#6b6b76; --dim:#a3a3ad;
  --green:#16a34a; --green-bg:#e9f7ee; --red:#dc2626; --red-bg:#fdecec; --amber:#b45309; --amber-bg:#fdf3e2; --blue:#2563eb;
  --s0:#ececf0; --s1:#ef4444; --s2:#f97316; --s3:#facc15; --s4:#84cc16; --s5:#22c55e;
  --iman:#059669; --body:#ea580c; --mind:#7c3aed; --work:#2563eb;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.4;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{background:var(--soft);border:1px solid transparent;border-radius:12px;padding:12px 14px;width:100%;outline:none;font-size:16px}
input:focus,textarea:focus,select:focus{border-color:var(--text);background:#fff}
textarea{resize:vertical;min-height:84px}
#app{max-width:600px;margin:0 auto;padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 90px)}
h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:4px 0 2px}
h2{font-size:20px;font-weight:750;margin:0 0 14px;letter-spacing:-.01em}
h3{font-size:13px;font-weight:650;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:26px 4px 8px;display:flex;justify-content:space-between;align-items:center}
.sub{color:var(--muted);font-size:14px}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:14px} .tiny{font-size:12.5px} .b{font-weight:700}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px} .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.box{background:var(--soft);border-radius:16px;padding:16px;margin-bottom:10px;display:block}
.list{background:var(--soft);border-radius:16px;overflow:hidden;margin-bottom:10px}
.item{display:flex;align-items:center;gap:12px;padding:13px 14px;width:100%;text-align:left;position:relative}
.item + .item{border-top:1px solid var(--line)}
.item .ic{font-size:20px;width:28px;text-align:center;flex:none}
.item .t{font-weight:600}
.item .s{font-size:13px;color:var(--muted)}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid #c9c9d1;flex:none;display:grid;place-items:center;color:transparent;font-size:15px;font-weight:800;transition:.15s;background:#fff}
.chk.on{background:var(--green);border-color:var(--green);color:#fff}
.chk.half{border-color:var(--green);background:conic-gradient(var(--green) var(--p),#fff 0)}
.cnt{display:flex;align-items:center;gap:4px;flex:none}
.cnt button{width:34px;height:34px;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:19px;font-weight:600}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{padding:7px 11px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--muted)}
.pill.on{background:var(--green);border-color:var(--green);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:13px 18px;font-weight:650;background:var(--soft);font-size:16px}
.btn:active{opacity:.75}
.btn.dark{background:var(--text);color:#fff}
.btn.green{background:var(--green);color:#fff}
.btn.line{background:#fff;border:1px solid var(--line)}
.btn.red{color:var(--red)}
.btn.block{width:100%}
.btn.sm{padding:8px 13px;font-size:14px;border-radius:10px}
.bar{height:8px;border-radius:9px;background:var(--soft2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px;background:var(--text);transition:width .4s}
.tag{display:inline-block;font-size:12px;font-weight:650;padding:2px 8px;border-radius:999px;background:var(--soft2);color:var(--muted);white-space:nowrap}
.tag.good{background:var(--green-bg);color:var(--green)} .tag.bad{background:var(--red-bg);color:var(--red)} .tag.warn{background:var(--amber-bg);color:var(--amber)}
.big{font-size:34px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.up{color:var(--green);font-weight:700} .down{color:var(--red);font-weight:700}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.stats-line{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;color:var(--muted);margin:6px 0 16px}
.stats-line b{color:var(--text)}
.sync{width:7px;height:7px;border-radius:50%;background:var(--dim);display:inline-block;margin-left:5px;vertical-align:1px}
.sync.ok{background:var(--green)} .sync.busy{background:#f59e0b} .sync.err{background:var(--red)}
.daynav{display:flex;gap:6px}
.daynav button{width:38px;height:38px;border-radius:50%;background:var(--soft);font-size:18px;font-weight:600}
.daynav button:disabled{opacity:.3}
.q{display:flex;align-items:center;gap:12px;padding:14px;border-radius:16px;border:1.5px solid var(--text);margin-bottom:8px;background:#fff;width:100%;text-align:left}
.q .qi{font-size:24px}
.q .qt{font-weight:700}
.q .arrow{margin-left:auto;font-size:20px;color:var(--muted)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:rgba(255,255,255,.94);backdrop-filter:saturate(1.8) blur(14px);-webkit-backdrop-filter:saturate(1.8) blur(14px);border-top:1px solid var(--line);padding:6px 6px calc(var(--safe-b) + 6px)}
nav.tabs .in{max-width:600px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{display:grid;justify-items:center;gap:2px;padding:5px 0;color:var(--dim);font-size:11px;font-weight:600}
nav.tabs button svg{width:25px;height:25px}
nav.tabs button.on{color:var(--text)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--soft);border-radius:12px;padding:3px;gap:3px;margin-bottom:14px}
.seg button{padding:9px 6px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--text);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{padding:10px 14px;border-radius:12px;background:var(--soft);font-weight:600;font-size:15px;border:1.5px solid transparent}
.opts button.on{border-color:var(--text);background:#fff}
.opts.col{display:grid;grid-template-columns:1fr 1fr}
.opts.col button{text-align:left;padding:12px}
.opts.col button small{display:block;font-weight:500;color:var(--muted);font-size:12.5px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{font-size:11px;color:var(--dim);text-align:center;font-weight:600}
.cal .c{aspect-ratio:1;border-radius:9px;display:grid;place-items:center;font-size:13px;font-weight:650;background:var(--s0);color:var(--muted);position:relative}
.cal .c.today{box-shadow:0 0 0 2px var(--text)}
.cal .c.fut{background:transparent;color:var(--dim)}
.cal .c .r{position:absolute;bottom:3px;width:4px;height:4px;border-radius:50%;background:currentColor;opacity:.7}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--muted)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block;vertical-align:-1px;margin-right:4px}
.hrow{display:grid;grid-template-columns:24px 1fr auto;gap:10px;align-items:center;padding:9px 0}
.hrow + .hrow{border-top:1px solid var(--line)}
.hrow .nm{display:flex;justify-content:space-between;font-size:14.5px;font-weight:600;margin-bottom:5px}
.meal-items{margin:8px 0 0;padding:0;list-style:none}
.meal-items li{display:flex;justify-content:space-between;gap:8px;font-size:14px;padding:3px 0}
.glasses{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.glass{width:30px;height:38px;border-radius:4px 4px 8px 8px;border:2px solid #93c5fd;position:relative;overflow:hidden;background:#fff;display:inline-block}
.glass.on:after{content:"";position:absolute;left:0;right:0;bottom:0;height:80%;background:#60a5fa}
.kbar{display:flex;height:10px;border-radius:9px;overflow:hidden;background:var(--soft2)}
.kbar i{display:block;height:100%}
.insight{display:flex;gap:12px;padding:13px 14px}
.insight + .insight{border-top:1px solid var(--line)}
.insight .e{font-size:20px;flex:none;width:26px;text-align:center}
#sheet-root .bg{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:50;opacity:0;transition:opacity .2s}
#sheet-root .sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:92vh;overflow:auto;background:#fff;border-radius:20px 20px 0 0;padding:8px 18px calc(var(--safe-b) + 20px);transform:translateY(100%);transition:transform .25s ease;max-width:600px;margin:0 auto;-webkit-overflow-scrolling:touch}
#sheet-root .grab{width:38px;height:5px;border-radius:9px;background:var(--soft2);margin:0 auto 14px}
#sheet-root.show .bg{opacity:1} #sheet-root.show .sheet{transform:none}
.field{margin-bottom:14px} .field > label{display:block;font-size:15px;font-weight:700;margin:0 0 8px}
.field > label small{font-weight:500;color:var(--muted)}
.moods{display:flex;gap:6px}
.moods button{flex:1;font-size:26px;padding:8px 0;border-radius:12px;background:var(--soft);border:1.5px solid transparent}
.moods button.on{border-color:var(--text);background:#fff}
.rate{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rate button{padding:10px 0;border-radius:9px;background:var(--soft);font-weight:700;font-size:14px}
.rate button.on{background:var(--text);color:#fff}
.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 12px);transform:translate(-50%,-160%);background:var(--text);color:#fff;padding:11px 16px;border-radius:12px;font-weight:600;font-size:15px;z-index:80;transition:transform .25s;max-width:92vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
.empty{text-align:center;padding:18px 10px;color:var(--muted);font-size:14px}
.spin{width:22px;height:22px;border:3px solid var(--soft2);border-top-color:var(--text);border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.code{font-family:ui-monospace,Menlo,monospace;font-size:15px;background:#fff;padding:12px;border-radius:12px;word-break:break-all;text-align:center}
.switch{width:50px;height:30px;border-radius:99px;background:#d4d4da;position:relative;flex:none;transition:.2s}
.switch:after{content:"";position:absolute;top:2px;left:2px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.switch.on{background:var(--green)} .switch.on:after{left:22px}
.note{background:#eff6ff;color:#1e3a8a;border-radius:14px;padding:13px 14px;font-size:14px;margin-bottom:12px}
/* ---- v3: карточки, неделя, кольца ---- */
:root{--bg:#f6f6f3;--card:#ffffff;--shadow:0 1px 2px rgba(17,17,20,.04),0 4px 14px rgba(17,17,20,.05)}
html,body{background:var(--bg)}
.box,.list{background:var(--card);box-shadow:var(--shadow);border:1px solid #efeee9}
.box .box,.sheet .box,.sheet .list{box-shadow:none;background:var(--soft);border:0}
input,textarea,select{background:#f1f1f3}
.head{display:flex;align-items:center;gap:12px;margin:2px 0 14px}
.ava{width:48px;height:48px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff;flex:none;background:linear-gradient(160deg,#4ade80,#16a34a)}
.head .lv{font-weight:800;font-size:18px}
.xp{height:7px;border-radius:9px;background:#e6e6ea;overflow:hidden;margin:5px 0 3px;max-width:180px}
.xp i{display:block;height:100%;background:#2f6fde;border-radius:9px}
.chips{display:grid;gap:6px;margin-left:auto}
.chip{display:flex;align-items:center;gap:6px;background:var(--card);box-shadow:var(--shadow);border-radius:12px;padding:5px 10px;font-weight:700;font-size:14px;white-space:nowrap}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin:2px 0 18px}
.wd{display:grid;justify-items:center;gap:4px;padding:6px 0 8px;border-radius:16px;border:1.5px solid transparent}
.wd.sel{border-color:#2f6fde;background:#eef3fd}
.wd .wn{font-size:12px;color:var(--muted);font-weight:600}
.wd.sel .wn{color:#2f6fde}
.wd .rg{position:relative;width:40px;height:40px}
.wd .rg b{position:absolute;inset:0;display:grid;place-items:center;font-size:14px;font-weight:700}
.wd:disabled{opacity:.35}
.sec{display:flex;justify-content:space-between;align-items:center;margin:18px 2px 10px}
.sec h2{margin:0;font-size:21px}
.hcard{position:relative;display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px 12px 12px 12px;margin-bottom:9px;box-shadow:var(--shadow);border:1px solid #efeee9;overflow:hidden;flex-wrap:wrap}
.hcard .hfill{position:absolute;left:0;top:0;bottom:0;background:var(--t);transition:width .35s;pointer-events:none}
.hcard > *{position:relative}
.hmain{display:flex;align-items:center;gap:12px;flex:1;min-width:0;text-align:left}
.tile{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-size:22px;flex:none;background:var(--t2)}
.hmain .t{font-weight:700;font-size:16px}
.hmain .s{font-size:13px;color:var(--muted);margin-top:1px}
.hbtn{width:40px;height:40px;display:grid;place-items:center;flex:none;position:relative}
.hbtn svg{position:absolute;inset:0}
.hbtn .mk{position:relative;font-size:17px;font-weight:800;color:var(--c)}
.hbtn.done .disc{position:absolute;inset:3px;border-radius:50%;background:var(--c)}
.hbtn.done .mk{color:#fff}
.hcard.fin{opacity:.62}
.hcard .pills{flex-basis:100%;margin:2px 0 0 56px}
.hcard .pill.on{background:var(--c);border-color:var(--c)}
.donehead{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;font-weight:600;margin:18px 2px 10px}
.donehead:after{content:"";flex:1;height:1px;background:var(--line)}
nav.tabs{background:transparent;border:0;backdrop-filter:none;-webkit-backdrop-filter:none;padding:0 14px calc(var(--safe-b) + 10px)}
nav.tabs .in{background:rgba(255,255,255,.96);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:24px;box-shadow:0 6px 24px rgba(17,17,20,.12);padding:6px;border:1px solid #ecebe6}
nav.tabs button{border-radius:18px;padding:7px 0}
nav.tabs button.on{background:#eef3fd;color:#2f6fde}
.prof{display:flex;gap:14px;align-items:center}
.prof .ava{width:64px;height:64px;font-size:26px;border-radius:20px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1.05}
.kpi small{font-size:14px;font-weight:600;color:var(--muted);margin-left:3px}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,1fr);gap:3px}
.heat i{display:block;aspect-ratio:1;border-radius:3px;background:#ececef}
.heatwrap{display:grid;grid-template-columns:20px 1fr;gap:6px;align-items:start}
.heatwrap .dl{display:grid;grid-template-rows:repeat(7,1fr);gap:3px;font-size:9.5px;color:var(--dim);height:100%}
.heatm{display:grid;font-size:10.5px;color:var(--dim);margin:0 0 4px 26px}
.rcal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px 4px}
.rcal .wd2{font-size:11.5px;color:var(--dim);text-align:center;font-weight:600}
.rcal .dc{position:relative;width:100%;aspect-ratio:1;display:grid;place-items:center;font-size:13px;font-weight:700}
.rcal .dc svg{position:absolute;inset:6%;width:88%;height:88%}
.rcal .dc.fut{color:var(--dim)}
.rcal .dc.today b{background:#111114;color:#fff;border-radius:50%;width:62%;height:62%;display:grid;place-items:center}
.wtable{display:grid;gap:6px 4px;align-items:center;font-size:13px}
.wtable .sq{aspect-ratio:1;border-radius:6px;background:#ececef;width:100%;max-width:30px;justify-self:center}
.big4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center;margin-top:14px}
.big4 b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em}
.big4 span{font-size:11.5px;color:var(--muted)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
.bdg{background:var(--card);box-shadow:var(--shadow);border:1px solid #efeee9;border-radius:18px;padding:12px 8px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}
.bdg .em{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:26px;background:#fdf3e2;border:2px solid #f2c96b}
.bdg.lock .em{background:#f1f1f3;border-color:#e2e2e6;filter:grayscale(1);opacity:.6}
.bdg b{font-size:12.5px;line-height:1.2}
.bdg .rw{font-size:12px;color:var(--amber);font-weight:700}
.bdg .btn{padding:6px 10px;font-size:13px;border-radius:9px;width:100%;margin-top:2px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{width:32px;height:32px;border-radius:10px;border:3px solid #fff;box-shadow:0 0 0 1px var(--line)}
.swatches button.on{box-shadow:0 0 0 2px var(--text)}

/* ---- v4: окна снизу над клавиатурой ---- */
button,a,input,label{touch-action:manipulation}
html.lock,html.lock body{overflow:hidden;overscroll-behavior:none}
#sheet-root .sheet{bottom:var(--kb,0px);max-height:calc(var(--vvh,100vh) - 10px);padding:0 18px 0;overscroll-behavior:contain;transition:transform .25s ease,bottom .15s ease}
#sheet-root .shead{position:sticky;top:0;z-index:3;background:#fff;margin:0 -18px 6px;padding:8px 18px 4px;display:flex;justify-content:center;align-items:center;min-height:40px;touch-action:none}
#sheet-root .shead .grab{margin:0}
#sheet-root .sx{position:absolute;right:12px;top:6px;width:32px;height:32px;border-radius:50%;background:var(--soft);font-size:15px;font-weight:700;color:var(--muted);display:grid;place-items:center}
#sheet-root .sfoot{position:sticky;bottom:0;z-index:3;background:#fff;margin:10px -18px 0;padding:10px 18px calc(var(--safe-b) + 12px);display:grid;gap:8px;box-shadow:0 -10px 14px -12px rgba(0,0,0,.18)}
#sheet-root .sfoot > *{margin:0 !important}
#sheet-root .sheet > :last-child:not(.sfoot){margin-bottom:calc(var(--safe-b) + 18px)}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div id="sheet-root"></div>
<div class="toast" id="toast"></div>

<script>
'use strict';
/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = () => Date.now();
const uid = () => Math.random().toString(36).slice(2, 10) + now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => fmt(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return fmt(d); };
const ymOf = s => s.slice(0, 7);

function localEstimate(text, portion, place) {
  const k = { s: .7, m: 1, l: 1.4 }[portion] || 1, pk = place === 'home' ? 1 : 1.15;
  const parts = text.toLowerCase().split(/,|\+|;|\n| и /).map(s => s.trim()).filter(Boolean);
  const items = parts.map(p => {
    const f = FOOD_DB.find(f => f[0].some(key => p.includes(key)));
    if (!f) return { name: p[0].toUpperCase() + p.slice(1), grams: 0, kcal: Math.round(250 * k), protein: 10, fat: 10, carbs: 30, verdict: 'ok', why: 'примерно' };
    const m = k * (f[6] < 0 ? pk : 1);
    return { name: f[1], grams: 0, kcal: Math.round(f[2] * m), protein: Math.round(f[3] * m), fat: Math.round(f[4] * m), carbs: Math.round(f[5] * m), verdict: f[6] > 0 ? 'good' : f[6] < 0 ? 'bad' : 'ok', why: f[6] > 0 ? 'полезно' : f[6] < 0 ? 'жирное или сладкое' : '' };
  });
  const bad = items.filter(i => i.verdict === 'bad').length, good = items.filter(i => i.verdict === 'good').length;
  const score = items.length ? clamp(Math.round(6 + (good - bad * 1.5) / items.length * 4), 1, 10) : 0;
  return { items, score, comment: bad ? 'Есть вредное — в следующий раз замени на домашнее или овощи.' : 'Нормальный приём пищи.', local: true };
}

const LS = 'istiqama-v2', LS_KEY = 'istiqama-key', LS_DEV = 'istiqama-device', LS_PUSH = 'istiqama-push';
let S = null;
let ui = { tab: 'today', day: today(), month: ymOf(today()), moneyMonth: ymOf(today()), statsSeg: 'month', period: 7 };
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
function load() { try { const s = JSON.parse(lsGet(LS)); return s && s.v === 1 ? normalize(s) : null; } catch { return null; } }
function normalize(s) { for (const k of ['habits','money','rewards','purchases','reminders','books','meals','claims']) s[k] = s[k] || []; s.days = s.days || {}; s.body = s.body || { u: 0, sex: 'm', goal: 'keep', activity: 1.375 }; return s; }
function persist() { lsSet(LS, JSON.stringify(S)); }
function save() { S.updatedAt = now(); persist(); queueSync(); }
function randKey(n = 24) { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789'; const r = crypto.getRandomValues(new Uint8Array(n)); return [...r].map(x => a[x % a.length]).join(''); }
function syncKey() { let k = lsGet(LS_KEY); if (!k) { k = randKey(); lsSet(LS_KEY, k); } return k; }
function deviceId() { let k = lsGet(LS_DEV); if (!k) { k = 'd-' + randKey(16); lsSet(LS_DEV, k); } return k; }
function newState(p) {
  const t = now(), start = today();
  return normalize({
    v: 1, updatedAt: t,
    profile: { u: t, name: p.name || 'Друг', start },
    goals: { u: t, monthScore: 80, fundTarget: +p.fund || 300000, tripName: p.trip || 'Отдых', namazPct: 90 },

    purchases: [], money: [], meals: [],

/* ============ merge (как на сервере) ============ */
function mergeState(a, b) {
  if (!a) return b; if (!b) return a;
  const out = { v: 1 };
  for (const k of ['profile','goals','settings','body','insight']) { const v = ((a[k]?.u || 0) >= (b[k]?.u || 0)) ? a[k] : b[k]; if (v !== undefined) out[k] = v; }
  for (const k of ['habits','money','rewards','purchases','reminders','books','meals','claims']) {
    const m = new Map();
    for (const it of [...(a[k] || []), ...(b[k] || [])]) { const c = m.get(it.id); if (!c || (it.u || 0) > (c.u || 0)) m.set(it.id, it); }
    out[k] = [...m.values()];
  }
  out.days = {};
  for (const d of new Set([...Object.keys(a.days || {}), ...Object.keys(b.days || {})])) {
    const x = a.days?.[d], y = b.days?.[d];
    out.days[d] = !x ? y : !y ? x : ((x.u || 0) >= (y.u || 0) ? x : y);
  }
  out.updatedAt = Math.max(a.updatedAt || 0, b.updatedAt || 0);
  return normalize(out);
}

/* ============ sync ============ */
let syncTimer = null, syncState = 'idle';
function setSync(s) { syncState = s; document.querySelectorAll('.sync').forEach(d => d.className = 'sync ' + ({ ok: 'ok', busy: 'busy', err: 'err' }[s] || '')); }
function queueSync() { clearTimeout(syncTimer); syncTimer = setTimeout(syncPush, 1200); }
const sheetOpen = () => !!$('#sheet-root .sheet');
async function syncPush() {
  if (!S) return;
  setSync('busy');
  try {
    const r = await fetch('/api/sync', { method: 'PUT', headers: { 'content-type': 'application/json', 'x-sync-key': syncKey() }, body: JSON.stringify(S) });
    if (!r.ok) throw 0;
    applyRemote((await r.json()).data); setSync('ok');
  } catch { setSync('err'); }
}
async function syncPull() {
  if (!S) return;
  setSync('busy');
  try {
    const r = await fetch('/api/sync', { headers: { 'x-sync-key': syncKey() } });
    if (!r.ok) throw 0;
    const { data } = await r.json();
    if (data) { applyRemote(data); if (JSON.stringify(data) !== JSON.stringify(S)) queueSync(); } else queueSync();
    setSync('ok');
  } catch { setSync('err'); }
}
function applyRemote(data) {
  if (!data) return;
  const m = mergeState(S, data);
  if (JSON.stringify(m) !== JSON.stringify(S)) { S = m; persist(); if (!sheetOpen()) render(); }
}

function kcalNorm() {
  const b = S.body; if (!b?.weight || !b?.height || !b?.age) return 2200;
  const bmr = 10 * b.weight + 6.25 * b.height - 5 * b.age + (b.sex === 'f' ? -161 : 5);
  return Math.round(bmr * (+b.activity || 1.375) * ({ lose: .85, keep: 1, gain: 1.1 }[b.goal] || 1) / 10) * 10;
}
const waterGoalMl = () => S.body?.weight ? Math.round(S.body.weight * 30 / 250) * 250 : 2000;

/* ============ logic ============ */
const habits = () => S.habits.filter(h => !h.del).sort((a, b) => (a.o ?? 0) - (b.o ?? 0));
const habitsOn = d => S.habits.filter(h => (!h.from || h.from <= d) && (!h.del || (h.delAt && h.delAt > d))).sort((a, b) => (a.o ?? 0) - (b.o ?? 0));
const dayObj = d => S.days[d] || { h: {} };
const mealsOn = d => S.meals.filter(m => !m.del && m.date === d).sort((a, b) => (a.time || '') < (b.time || '') ? -1 : 1);
const moneyOn = d => S.money.filter(m => !m.del && m.date === d);
const mealHealth = m => clamp((m.score - 3) / 5, 0, 1);
function foodFrac(d) {
  const ms = mealsOn(d); if (!ms.length) return 0;
  let s = 0;
  for (const t of ['breakfast', 'lunch', 'dinner']) { const x = ms.filter(m => m.meal === t); if (x.length) s += sum(x, mealHealth) / x.length; }
  s -= ms.filter(m => m.meal === 'snack' && m.score < 5).length * .3;
  if (sum(ms, m => m.kcal) > kcalNorm() * 1.2) s -= .5;
  return clamp(s / 3, 0, 1);
}
function frac(h, d) {
  const v = dayObj(d).h?.[h.id];
  if (h.type === 'check') return v ? 1 : 0;
  if (h.type === 'count') return clamp((+v || 0) / (h.target || 1), 0, 1);
  if (h.type === 'multi') return Array.isArray(v) ? v.filter(Boolean).length / h.labels.length : 0;
  if (h.type === 'auto') return moneyOn(d).length || dayObj(d).noSpend ? 1 : 0;
  if (h.type === 'food') return foodFrac(d);
  return 0;
}
const startDate = () => S.profile.start || today();
function dayScore(d, cat) {
  if (d > today() || d < startDate()) return null;
  const hs = habitsOn(d).filter(h => !cat || h.cat === cat);
  const tot = sum(hs, h => h.xp);
  return tot ? Math.round(sum(hs, h => (+h.xp || 0) * frac(h, d)) / tot * 100) : null;
}
function dayXP(d) {

/* ============ АНАЛИЗ — приложение изучает тебя ============ */
function collectStats(days) {
  const to = today(); let from = addDays(to, -(days - 1)); if (from < startDate()) from = startDate();
  const dates = []; for (let d = from; d <= to; d = addDays(d, 1)) dates.push(d);
  const n = dates.length, meals = S.meals.filter(m => !m.del && m.date >= from && m.date <= to), norm = kcalNorm();
  const fedDays = dates.filter(d => mealsOn(d).length), kcalByDay = fedDays.map(d => sum(mealsOn(d), m => m.kcal));
  const items = meals.flatMap(m => m.items || []), badCount = {};
  items.filter(i => i.verdict === 'bad').forEach(i => badCount[i.name] = (badCount[i.name] || 0) + 1);
  const kAll = sum(items, i => i.kcal), kBad = sum(items.filter(i => i.verdict === 'bad'), i => i.kcal);
  const outMeals = meals.filter(m => m.place !== 'home');
  const water = dates.map(d => +dayObj(d).h?.water || 0);
  const spendList = S.money.filter(m => !m.del && m.type === 'out' && m.date >= from && m.date <= to), byCat = {};
  spendList.forEach(m => byCat[m.cat] = (byCat[m.cat] || 0) + +m.amount);
  const scores = dates.map(d => dayScore(d) ?? 0);
  const by = id => { const h = S.habits.find(x => x.id === id && !x.del); if (!h) return null; const w = [], wo = []; dates.forEach((d, i) => (frac(h, d) >= 1 ? w : wo).push(scores[i])); return w.length && wo.length ? [Math.round(sum(w) / w.length), Math.round(sum(wo) / wo.length), w.length] : null; };
  const wd = {}; dates.forEach((d, i) => (wd[parse(d).getDay()] = wd[parse(d).getDay()] || []).push(scores[i]));
  return {
    from, to, n, norm, avgK: kcalByDay.length ? Math.round(sum(kcalByDay) / kcalByDay.length) : null, overDays: kcalByDay.filter(k => k > norm * 1.1).length, fedDays: fedDays.length,
    topBad: Object.entries(badCount).sort((a, b) => b[1] - a[1]).slice(0, 4), badShare: kAll ? Math.round(kBad / kAll * 100) : null,
    outMeals: outMeals.length, outCost: sum(outMeals, m => m.cost), noBreakfast: fedDays.filter(d => !mealsOn(d).some(m => m.meal === 'breakfast')).length,
    lateMeals: meals.filter(m => m.time && m.time >= '21:30').length, avgW: sum(water) / n * .25, waterGoal: waterGoalMl() / 1000,
    spend: sum(spendList, m => m.amount), byCat, avgScore: Math.round(sum(scores) / n), sport: by('sport'), sleep: by('sleep'), namaz: by('namaz'),
    wdAvg: Object.entries(wd).map(([k, a]) => [+k, Math.round(sum(a) / a.length)]).sort((a, b) => b[1] - a[1]),
    habitsPct: habits().map(h => [h.name, habitPct(h, from, to)]).filter(x => x[1] != null),
    reports: dates.map(d => dayObj(d).r).filter(r => r?.closed), meals: meals.length,
  };
}
function viewAnalysis() {
  const s = collectStats(ui.period), L = [];
  const add = (e, t) => L.push(`<div class="insight"><span class="e">${e}</span><div class="small">${t}</div></div>`);

async function runReview() {
  const s = collectStats(ui.period);
  const payload = { период_дней: s.n, средний_балл: s.avgScore, норма_ккал: s.norm, средние_ккал: s.avgK, дней_с_перебором: s.overDays, дней_с_записью_еды: s.fedDays, доля_вредной_еды_процент: s.badShare, частая_вредная_еда: s.topBad, раз_ел_вне_дома: s.outMeals, потрачено_на_еду_вне_дома: s.outCost, пропуски_завтрака: s.noBreakfast, поздние_приёмы_пищи: s.lateMeals, вода_литров_в_день: +s.avgW.toFixed(2), цель_воды_литров: s.waterGoal, траты_всего: s.spend, траты_по_категориям: s.byCat, балл_со_спортом_и_без: s.sport, балл_со_сном_до_23_и_без: s.sleep, балл_с_намазами_и_без: s.namaz, дни_недели_средний_балл: s.wdAvg.map(([k, v]) => [WD[k], v]), выполнение_дел_процент: s.habitsPct, отчёты: s.reports.slice(-10).map(r => ({ оценка: r.rate, получилось: (r.wins || '').slice(0, 120), улучшить: (r.fix || '').slice(0, 120) })), валюта: S.settings.currency };
  openSheet(`<div style="text-align:center;padding:30px 0"><span class="spin"></span><div class="sub" style="margin-top:12px">Изучаю твои данные…</div></div>`);
  try {
    const r = await fetch('/api/review', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(payload) });
    if (!r.ok) throw new Error(r.status === 503 ? 'ИИ на сервере пока не подключён' : 'Сервер ответил ' + r.status);
    S.insight = { u: now(), at: now(), days: ui.period, data: await r.json() };
    save(); closeSheet(); render();
  } catch (e) { closeSheet(); toast(e.message || 'Нет связи с сервером'); }
}

    <div class="field"><label>Заголовок</label><input id="n-ti" value="${esc(r.title)}" placeholder="Например: Аср 🕌"></div>
    <div class="field"><label>Текст</label><input id="n-b" value="${esc(r.body)}" placeholder="Время намаза"></div>
    <div class="row" style="padding:6px 0"><span class="grow small">Только если отчёт дня ещё не сдан</span><button class="switch ${r.onlyIfNoReport ? 'on' : ''}" id="n-o"></button></div>
    <button class="btn dark block" id="n-s" style="margin-top:12px">Сохранить</button>${id ? '<button class="btn red block" id="n-d" style="margin-top:8px">Удалить</button>' : ''}`, root => {
    let only = !!r.onlyIfNoReport;
    root.querySelector('#n-o').onclick = e => { only = !only; e.currentTarget.classList.toggle('on', only); };
    root.querySelector('#n-s').onclick = () => {
      const o = { time: root.querySelector('#n-t').value || '20:00', title: root.querySelector('#n-ti').value.trim() || 'Истикама', body: root.querySelector('#n-b').value.trim(), onlyIfNoReport: only, u: now() };
      if (id) Object.assign(r, o); else S.reminders.push({ id: uid(), on: true, ...o });
      save(); pushResave(); closeSheet(); render();
    };
    if (id) root.querySelector('#n-d').onclick = () => { r.del = true; r.u = now(); save(); pushResave(); closeSheet(); render(); };
  });
}
function openBookEdit(id) {
  const b = id ? S.books.find(x => x.id === id) : { title: '', pages: 250, offset: 0 };
  openSheet(`<h2>${id ? 'Книга' : 'Книга месяца'}</h2>
    <div class="field"><label>Название</label><input id="b-t" value="${esc(b.title)}" placeholder="Например: Атомные привычки"></div>
    <div class="grid2"><div class="field"><label>Страниц всего</label><input id="b-p" type="number" inputmode="numeric" value="${b.pages}"></div><div class="field"><label>Уже прочитано</label><input id="b-o" type="number" inputmode="numeric" value="${b.offset || 0}"></div></div>
    <button class="btn dark block" id="b-s">Сохранить</button>${id ? '<button class="btn red block" id="b-d" style="margin-top:8px">Удалить</button>' : ''}`, root => {
    root.querySelector('#b-s').onclick = () => {
      const title = root.querySelector('#b-t').value.trim(), pages = Math.round(+root.querySelector('#b-p').value);
      if (!title || !(pages > 0)) return toast('Название и страницы?');
      const o = { title, pages, offset: Math.max(0, Math.round(+root.querySelector('#b-o').value || 0)), u: now() };
      if (id) { Object.assign(b, o); if (b.finished && bookProgress({ ...b, finished: null }) < b.pages) b.finished = null; } else S.books.push({ id: uid(), start: today(), ...o });
      checkBooks(); save(); closeSheet(); render();
    };
    if (id) root.querySelector('#b-d').onclick = () => { b.del = true; b.u = now(); save(); closeSheet(); render(); };
  });
}

/* ============ push ============ */
function urlB64(b) { const p = '='.repeat((4 - b.length % 4) % 4); const r = atob((b + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...r].map(c => c.charCodeAt(0))); }
async function pushEnable() {
  if (isIOS() && !isStandalone()) { openSheet(`<h2>Сначала установи приложение</h2>${installNote()}<div class="sub small">iPhone присылает уведомления только приложениям на экране «Домой» (iOS 16.4 и новее).</div>`); return; }
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) return toast('Этот браузер не поддерживает уведомления');
  if (await Notification.requestPermission() !== 'granted') return toast('Разреши уведомления в настройках');
  try {
    const reg = await navigator.serviceWorker.ready;
    const { key } = await (await fetch('/api/push')).json();
    if (!key) throw new Error('сервер уведомлений не настроен');
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64(key) });
    await pushSave(sub); lsSet(LS_PUSH, '1'); render(); toast('Уведомления включены');
  } catch (e) { toast('Не получилось: ' + (e.message || e)); }
}
async function pushSave(sub) {
  const reminders = S.reminders.filter(r => r.on && !r.del).map(({ id, time, title, body, onlyIfNoReport, open }) => ({ id, time, title, body, onlyIfNoReport, open }));
  const r = await fetch('/api/push', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action: 'save', device: deviceId(), sub: sub.toJSON(), tz: Intl.DateTimeFormat().resolvedOptions().timeZone, reminders, key: syncKey() }) });
  if (!r.ok) throw new Error('сервер ответил ' + r.status);
}
async function pushResave() {
  if (lsGet(LS_PUSH) !== '1' || !('serviceWorker' in navigator)) return;
  try { const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription(); if (sub) await pushSave(sub); else lsSet(LS_PUSH, '0'); } catch {}
}
async function pushDisable() {
  try { await fetch('/api/push', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action: 'off', device: deviceId() }) }); const reg = await navigator.serviceWorker.ready; (await reg.pushManager.getSubscription())?.unsubscribe(); } catch {}
  lsSet(LS_PUSH, '0'); render(); toast('Уведомления выключены');
}

/* ============ действия ============ */
$('#app').addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act, id = el.dataset.id, d = ui.day;
  const cur = id ? dayObj(d).h?.[id] : null, hb = id ? S.habits.find(x => x.id === id) : null;
  switch (a) {
    case 'tog': if (!cur) vibrate(); setVal(id, !cur); break;
    case 'inc': vibrate(); setVal(id, (+cur || 0) + (hb.target >= 20 ? 5 : 1)); break;
    case 'dec': setVal(id, Math.max(0, (+cur || 0) - (hb.target >= 20 ? 5 : 1))); break;
    case 'multi': { const arr = Array.isArray(cur) ? [...cur] : []; arr[+el.dataset.i] = !arr[+el.dataset.i]; if (arr[+el.dataset.i]) vibrate(); setVal(id, arr); break; }
    case 'pick-day': ui.day = el.dataset.d; render(); break;
    case 'habit-open': openHabit(id); break;
    case 'multi-next': { const arr = Array.isArray(cur) ? [...cur] : []; const i = hb.labels.findIndex((_, k) => !arr[k]); if (i < 0) return openHabit(id); arr[i] = true; vibrate(); toast(`${hb.labels[i]} ✓`); setVal(id, arr); break; }
    case 'claim': { const a = achievements().find(x => x.id === id); if (!a?.on || S.claims.some(x => x.id === id && !x.del)) return; S.claims.push({ id, u: now(), coins: a.reward }); save(); render(); toast(`${a.e} +${a.reward} монет!`); break; }
    case 'day-prev': ui.day = addDays(d, -1); render(); break;
    case 'day-next': ui.day = addDays(d, 1); render(); break;
    case 'report': openReport(d); break;
    case 'go-food': ui.tab = 'food'; render(); scrollTo(0, 0); break;
    case 'food-add': openFoodAdd(el.dataset.arg || null, d); break;
    case 'meal-open': openMeal(id); break;
    case 'water-ask': openWaterAsk(d); break;
    case 'pages-ask': openPagesAsk(d); break;
    case 'spend-ask': openSpendAsk(d); break;
    case 'body': openBody(); break;
    case 'seg': ui.statsSeg = el.dataset.v; render(); break;
    case 'period': ui.period = +el.dataset.v; render(); break;
    case 'ai-review': runReview(); break;
    case 'm-prev': ui.month = addMonth(ui.month, -1); render(); break;
    case 'm-next': ui.month = addMonth(ui.month, 1); render(); break;
    case 'open-day': ui.day = el.dataset.d; ui.tab = 'today'; render(); scrollTo(0, 0); break;
    case 'open-report': openReport(el.dataset.d); break;
    case 'mm-prev': ui.moneyMonth = addMonth(ui.moneyMonth, -1); render(); break;
    case 'mm-next': ui.moneyMonth = addMonth(ui.moneyMonth, 1); render(); break;
    case 'add-in': openMoneyAdd('in'); break;
    case 'add-out': openMoneyAdd('out'); break;
    case 'add-save': openMoneyAdd('save'); break;
    case 'del-money': delMoney(id); render(); break;
    case 'buy': {
      const r = S.rewards.find(x => x.id === id); if (!r || coins() < r.cost || !confirm(`Взять «${r.name}» за ${num(r.cost)} монет?`)) return;
      S.purchases.push({ id: uid(), u: now(), rid: r.id, name: r.name, icon: r.icon, cost: r.cost, date: today() }); save(); render(); toast('Награда твоя — ты её заслужил'); break;
    }
    case 'unbuy': { const p = S.purchases.find(x => x.id === id); if (p && confirm('Вернуть монеты?')) { p.del = true; p.u = now(); save(); render(); } break; }
    case 'rw-add': openRewardEdit(); break;
    case 'rw-edit': openRewardEdit(id); break;
    case 'hab-add': openHabitEdit(); break;
    case 'hab-edit': openHabitEdit(id); break;
    case 'rem-add': openReminderEdit(); break;
    case 'rem-edit': openReminderEdit(id); break;
    case 'rem-toggle': { const r = S.reminders.find(x => x.id === id); r.on = !r.on; r.u = now(); save(); pushResave(); render(); break; }
    case 'push-toggle': lsGet(LS_PUSH) === '1' ? pushDisable() : pushEnable(); break;
    case 'push-test': { const r = await fetch('/api/push', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action: 'test', device: deviceId() }) }); toast(r.ok ? 'Отправлено — смотри уведомление' : 'Ошибка — включи уведомления заново'); break; }
    case 'book-add': openBookEdit(); break;
    case 'book-edit': openBookEdit(id); break;
    case 'install': deferredInstall?.prompt(); break;
    case 'save-goals': {
      const v = s => $(s).value;
      S.profile = { ...S.profile, name: v('#s-name').trim() || S.profile.name, u: now() };
      S.goals = { ...S.goals, tripName: v('#s-trip').trim() || S.goals.tripName, fundTarget: Math.max(0, +v('#s-fund') || 0), monthScore: clamp(+v('#s-score') || 80, 10, 100), namazPct: clamp(+v('#s-namaz') || 90, 10, 100), u: now() };
      S.settings = { ...S.settings, currency: v('#s-cur').trim() || '₸', u: now() };
      save(); render(); toast('Сохранено'); break;
    }
    case 'copy-code': try { await navigator.clipboard.writeText(syncKey()); toast('Код скопирован'); } catch { toast('Выдели код и скопируй вручную'); } break;
    case 'link-device': openLink(); break;
    case 'export': { const blob = new Blob([JSON.stringify(S)], { type: 'application/json' }); const l = document.createElement('a'); l.href = URL.createObjectURL(blob); l.download = `istiqama-${today()}.json`; l.click(); break; }
    case 'import': {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
      inp.onchange = async () => { try { const x = JSON.parse(await inp.files[0].text()); if (x.v !== 1) throw 0; S = mergeState(S, normalize(x)); save(); render(); toast('Копия загружена'); } catch { toast('Не тот файл'); } };
      inp.click(); break;
    }
  }
});
function openLink() {
  openSheet(`<h2>Подключить устройство</h2><div class="sub small" style="margin-bottom:12px">Введи код с другого устройства (Ещё → Ноутбук и iPhone). Данные на этом устройстве заменятся данными из облака.</div>
    <div class="field"><input id="l-k" placeholder="Код" autocapitalize="off" autocorrect="off" spellcheck="false" style="font-family:ui-monospace,monospace"></div>
    <button class="btn dark block" id="l-s">Подключить</button>`, root => {
    root.querySelector('#l-s').onclick = async () => {
      const k = root.querySelector('#l-k').value.trim();
      if (!/^[A-Za-z0-9-]{16,64}$/.test(k)) return toast('Код неверный');
      try {
        const { data } = await (await fetch('/api/sync', { headers: { 'x-sync-key': k } })).json();
        if (!data) return toast('По этому коду данных нет');
        lsSet(LS_KEY, k); S = normalize(data); persist(); closeSheet(); ui.tab = 'today'; render(); pushResave(); toast('Устройства связаны');
      } catch { toast('Нет связи с сервером'); }
    };
  });
}

/* ============ окно снизу, уведомление ============ */
let sheetGen = 0;
function sheetFrame(html) { return `<div class="shead"><span class="grab"></span><button class="sx" aria-label="Закрыть">✕</button></div>${html}`; }
function stickFoot(sh) {
  // последние кнопки окна — в закреплённый низ, чтобы их всегда было видно
  const tail = []; let el = sh.lastElementChild;
  const isBtns = e => e && (e.matches('button.btn') || (e.matches('.grid2,.grid3') && [...e.children].every(c => c.matches('button.btn'))));
  while (el && isBtns(el) && tail.length < 3) { tail.unshift(el); el = el.previousElementSibling; }
  if (!tail.length) return;
  const f = document.createElement('div'); f.className = 'sfoot'; tail.forEach(t => f.appendChild(t)); sh.appendChild(f);
}
function wireSheet(sh) {
  sh.querySelector('.sx').onclick = closeSheet;
  stickFoot(sh);
  const head = sh.querySelector('.shead'); let y0 = null, dy = 0;
  head.addEventListener('touchstart', e => { y0 = e.touches[0].clientY; dy = 0; sh.style.transition = 'none'; }, { passive: true });
  head.addEventListener('touchmove', e => { if (y0 == null) return; dy = Math.max(0, e.touches[0].clientY - y0); sh.style.transform = `translateY(${dy}px)`; }, { passive: true });
  head.addEventListener('touchend', () => { sh.style.transition = ''; sh.style.transform = ''; if (dy > 80) closeSheet(); y0 = null; });
  sh.addEventListener('focusin', e => { if (e.target.matches('input,textarea,select')) setTimeout(() => e.target.scrollIntoView({ block: 'center', behavior: 'smooth' }), 320); });
}
function openSheet(html, mount) {
  const root = $('#sheet-root'), gen = ++sheetGen; root.classList.remove('show');
  root.innerHTML = `<div class="bg"></div><div class="sheet" role="dialog">${sheetFrame(html)}</div>`;
  root.querySelector('.bg').onclick = closeSheet;
  document.documentElement.classList.add('lock');
  requestAnimationFrame(() => requestAnimationFrame(() => { if (gen === sheetGen) root.classList.add('show'); }));
  const sh = root.querySelector('.sheet');
  mount && mount(sh);
  wireSheet(sh);
}
function refreshSheet(html, mount) {
  const sh = $('#sheet-root .sheet'); if (!sh) return openSheet(html, mount);
  const top = sh.scrollTop; sh.innerHTML = sheetFrame(html); mount && mount(sh); wireSheet(sh); sh.scrollTop = top;
}
function closeSheet() {
  const root = $('#sheet-root'), gen = ++sheetGen; root.classList.remove('show');
  document.activeElement?.blur?.();
  document.documentElement.classList.remove('lock');
  setTimeout(() => { if (gen === sheetGen) root.innerHTML = ''; }, 260);
}
// клавиатура iPhone: держим окно над ней
function syncViewport() {
  const v = window.visualViewport; if (!v) return;
  const kb = Math.max(0, Math.round(window.innerHeight - v.height - v.offsetTop));
  document.documentElement.style.setProperty('--kb', kb + 'px');
  document.documentElement.style.setProperty('--vvh', Math.round(v.height) + 'px');
}
if (window.visualViewport) { visualViewport.addEventListener('resize', syncViewport); visualViewport.addEventListener('scroll', syncViewport); syncViewport(); }
let toastT;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2600); }

/* ============ первый запуск ============ */
function renderOnboarding() {
  $('#tabs').innerHTML = '';
  $('#app').innerHTML = `<div style="padding:24px 0 8px"><img src="/icon-192.png" alt="" width="64" height="64" style="border-radius:16px"><h1 style="margin-top:16px">Истикама</h1>
    <div class="sub">Дисциплина каждый день: намаз, еда, вода, спорт, работа, деньги, книга. Вечером — отчёт, за результат — награды.</div></div>
    <div style="margin-top:18px">
      <div class="field"><label>Как тебя зовут?</label><input id="o-name" autocomplete="given-name"></div>
      <div class="field"><label>Какую книгу читаешь в этом месяце?</label><input id="o-book" placeholder="Название"></div>
      <div class="grid2"><div class="field"><label>Страниц в ней</label><input id="o-pages" type="number" inputmode="numeric" value="250"></div><div class="field"><label>Валюта</label><input id="o-cur" value="₸" maxlength="4"></div></div>
      <div class="field"><label>Куда хочешь поехать отдыхать?</label><input id="o-trip" placeholder="Например: Иссык-Куль, Стамбул"></div>
      <div class="field"><label>Сколько нужно накопить на отдых?</label><input id="o-fund" type="number" inputmode="numeric" value="300000"></div>
      <button class="btn dark block" id="o-go">Начать</button>
      <button class="btn block" id="o-link" style="margin-top:8px;background:none;color:var(--muted)">У меня есть код с другого устройства</button>
    </div>`;
  $('#o-go').onclick = () => {
    const name = $('#o-name').value.trim(); if (!name) return toast('Напиши имя');
    S = newState({ name, book: $('#o-book').value.trim(), pages: $('#o-pages').value, currency: $('#o-cur').value.trim(), trip: $('#o-trip').value.trim(), fund: $('#o-fund').value });
    save(); render(); toast(`Бисмиллях, ${name}! Начинаем`);
    setTimeout(openBody, 900);
  };
  $('#o-link').onclick = () => openLink();
}

/* ============ запуск ============ */
let deferredInstall = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; });
S = load();
render();
if (S) { syncKey(); syncPull(); pushResave(); }
function handleOpen(what) {
  if (!S) return;
  if (what === 'report') setTimeout(() => openReport(today()), 300);
  if (what === 'food') { ui.tab = 'food'; ui.day = today(); render(); setTimeout(() => openFoodAdd(null, today()), 300); }
}
{ const o = new URLSearchParams(location.search).get('open'); if (o) { history.replaceState(null, '', '/'); handleOpen(o); } }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S) { if (!sheetOpen()) render(); syncPull(); } });
addEventListener('online', () => S && syncPush());
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
  navigator.serviceWorker.addEventListener('message', e => handleOpen(e.data?.open));
}
</script>
