<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Истикама</title>
<meta name="description" content="Игра дисциплины: привычки, иман, деньги, книга месяца, награды">
<meta name="theme-color" content="#0a0e18">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Истикама">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0e18; --bg2:#0f1524; --card:#141b2d; --card2:#1a2338; --line:#232d45; --line2:#2d3956;
  --text:#eef1f8; --muted:#8a93a9; --dim:#5c6680;
  --gold:#f5b942; --gold2:#ffd77a;
  --iman:#34d399; --body:#fb923c; --mind:#a78bfa; --work:#60a5fa;
  --s0:#1c2438; --s1:#ef4444; --s2:#f97316; --s3:#eab308; --s4:#84cc16; --s5:#22c55e;
  --good:#22c55e; --bad:#ef4444;
  --r:20px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Manrope,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.4}
body{min-height:100vh;overscroll-behavior-y:none;
  background:radial-gradient(900px 500px at 85% -10%,rgba(245,185,66,.10),transparent 60%),radial-gradient(700px 500px at -10% 10%,rgba(52,211,153,.08),transparent 60%),var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
input,textarea,select{background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%;outline:none}
input:focus,textarea:focus,select:focus{border-color:var(--gold)}
textarea{resize:vertical;min-height:70px}
.h-font{font-family:Unbounded,Manrope,sans-serif;letter-spacing:-.01em}
#app{max-width:560px;margin:0 auto;padding:calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 96px)}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.avatar{width:46px;height:46px;border-radius:15px;display:grid;place-items:center;font-weight:800;font-size:18px;
  background:linear-gradient(135deg,#1f6f55,#0f3b2e);border:1px solid rgba(52,211,153,.35);color:#c9ffe9;flex:none;position:relative}
.avatar .lv{position:absolute;bottom:-7px;right:-7px;background:var(--gold);color:#241800;font-size:11px;font-weight:800;border-radius:9px;padding:1px 6px;border:2px solid var(--bg)}
.top .who{flex:1;min-width:0}
.top .hi{font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .rank{color:var(--muted);font-size:12px;line-height:1.3}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.chip.gold{color:var(--gold2);border-color:rgba(245,185,66,.35);background:rgba(245,185,66,.08)}
.chip.fire{color:#ffb38a;border-color:rgba(251,146,60,.35);background:rgba(251,146,60,.08)}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--dim);display:inline-block}
.sync-dot.ok{background:var(--good)} .sync-dot.busy{background:var(--gold)} .sync-dot.err{background:var(--bad)}

.card{background:linear-gradient(180deg,var(--card),#121829);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.card.flat{background:var(--card)}
.sec-title{display:flex;align-items:center;justify-content:space-between;margin:22px 4px 10px;font-weight:800;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.sec-title .dot{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:8px}
.sec-title .pct{font-size:12px;letter-spacing:0;text-transform:none;font-weight:700}
.muted{color:var(--muted)} .dim{color:var(--dim)} .small{font-size:13px} .tiny{font-size:11.5px}
.row{display:flex;align-items:center;gap:10px} .between{justify-content:space-between} .wrap{flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

/* hero */
.hero{display:flex;gap:16px;align-items:center;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;inset:auto -60px -80px auto;width:200px;height:200px;border-radius:50%;background:radial-gradient(closest-side,rgba(245,185,66,.14),transparent)}
.ring{position:relative;width:118px;height:118px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .val{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .val b{font-family:Unbounded,sans-serif;font-size:26px;display:block;line-height:1}
.ring .val span{font-size:11px;color:var(--muted)}
.hero .stats{flex:1;display:grid;gap:8px}
.stat{display:flex;justify-content:space-between;align-items:center;font-size:14px}
.stat b{font-weight:800}
.xpbar{height:8px;border-radius:9px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ffe29a);border-radius:9px;transition:width .5s}

.quote{font-size:14px;line-height:1.5;border-left:3px solid var(--iman);padding:2px 0 2px 12px;color:#d6dbe7}
.quote .src{display:block;color:var(--muted);font-size:12px;margin-top:4px}

.daynav{display:flex;align-items:center;justify-content:space-between;margin:6px 0 2px}
.daynav button{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:18px}
.daynav button:disabled{opacity:.3}
.daynav .d{font-weight:800;text-align:center}
.daynav .d small{display:block;font-weight:600;color:var(--muted);font-size:12px}

/* habits */
.habit{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:8px;position:relative;overflow:hidden;transition:border-color .2s,background .2s}
.habit .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;flex:none;background:var(--bg2)}
.habit .nm{flex:1;min-width:0}
.habit .nm b{display:block;font-weight:700;font-size:14.5px}
.habit .nm span{font-size:12px;color:var(--muted)}
.habit.done{border-color:color-mix(in srgb,var(--c) 55%,transparent);background:linear-gradient(90deg,color-mix(in srgb,var(--c) 13%,var(--card)),var(--card))}
.habit.multi{flex-wrap:wrap}
.habit .fill{position:absolute;left:0;bottom:0;height:3px;background:var(--c);transition:width .3s}
.tick{width:34px;height:34px;border-radius:11px;border:2px solid var(--line2);display:grid;place-items:center;flex:none;transition:.15s;font-size:16px;color:transparent}
.habit.done .tick{background:var(--c);border-color:var(--c);color:#0b1220}
.cnt{display:flex;align-items:center;gap:6px}
.cnt button{width:34px;height:34px;border-radius:11px;background:var(--bg2);border:1px solid var(--line2);font-size:18px;font-weight:700}
.cnt .v{min-width:48px;text-align:center;font-weight:800;font-size:14px}
.cnt .v small{display:block;font-size:10.5px;color:var(--muted);font-weight:600}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pill{padding:7px 10px;border-radius:10px;background:var(--bg2);border:1px solid var(--line2);font-size:12.5px;font-weight:700;color:var(--muted)}
.pill.on{background:var(--c);border-color:var(--c);color:#0b1220}
.xp{font-size:11px;font-weight:800;color:var(--gold);background:rgba(245,185,66,.1);border-radius:7px;padding:2px 6px;margin-left:6px;vertical-align:1px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:15px;padding:13px 18px;font-weight:800;background:var(--card2);border:1px solid var(--line2);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.primary{background:linear-gradient(135deg,#f7c75a,#e99d1f);color:#271a00;border:0;box-shadow:0 8px 24px -8px rgba(245,185,66,.6)}
.btn.green{background:linear-gradient(135deg,#34d399,#0ea371);color:#032015;border:0}
.btn.ghost{background:transparent}
.btn.danger{color:#ffb4b4;border-color:rgba(239,68,68,.4)}
.btn.block{width:100%}
.btn.sm{padding:8px 12px;border-radius:11px;font-size:13px}

.report-cta{margin-top:18px;padding:18px;border-radius:var(--r);border:1px dashed rgba(245,185,66,.5);background:rgba(245,185,66,.06);text-align:center}
.report-done{border:1px solid rgba(34,197,94,.45);background:rgba(34,197,94,.07);border-style:solid}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 10px calc(var(--safe-b) + 8px);background:rgba(10,14,24,.86);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--line)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{display:grid;justify-items:center;gap:3px;padding:6px 0;color:var(--dim);font-size:11px;font-weight:700}
nav.tabs button .i{font-size:21px;filter:grayscale(1) opacity(.65);transition:.2s}
nav.tabs button.on{color:var(--text)}
nav.tabs button.on .i{filter:none;transform:translateY(-2px)}

/* month */
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mnav button{width:40px;height:40px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:18px}
.mnav .t{font-family:Unbounded,sans-serif;font-size:17px;text-transform:capitalize}
.big-num{font-family:Unbounded,sans-serif;font-size:30px;line-height:1.1}
.delta{display:inline-flex;align-items:center;gap:4px;font-weight:800;border-radius:9px;padding:3px 8px;font-size:13px}
.delta.up{color:#86efac;background:rgba(34,197,94,.12)} .delta.down{color:#fca5a5;background:rgba(239,68,68,.12)} .delta.eq{color:var(--muted);background:var(--bg2)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .wd{font-size:11px;color:var(--dim);text-align:center;font-weight:700;padding-bottom:2px}
.cal .c{aspect-ratio:1;border-radius:10px;display:grid;place-items:center;font-size:12.5px;font-weight:800;background:var(--s0);color:#c7cede;position:relative}
.cal .c.fut{opacity:.35}
.cal .c.today{outline:2px solid var(--text);outline-offset:1px}
.cal .c .rep{position:absolute;top:3px;right:4px;width:5px;height:5px;border-radius:50%;background:#fff;opacity:.9}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:11.5px;color:var(--muted)}
.legend i{width:11px;height:11px;border-radius:4px;display:inline-block;vertical-align:-1px;margin-right:4px}
.bar{height:10px;border-radius:9px;background:var(--bg2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:9px}
.hrow{display:grid;grid-template-columns:28px 1fr 54px;gap:10px;align-items:center;margin:11px 0}
.hrow .nm{font-size:13.5px;font-weight:700;margin-bottom:5px;display:flex;justify-content:space-between}

/* money */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{padding:10px 6px;border-radius:10px;font-weight:800;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--card2);color:var(--text);box-shadow:0 1px 0 var(--line2) inset}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.cats button{padding:8px 11px;border-radius:11px;background:var(--bg2);border:1px solid var(--line);font-size:13px;font-weight:700}
.cats button.on{border-color:var(--gold);background:rgba(245,185,66,.12);color:var(--gold2)}
.tx{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.tx:last-child{border-bottom:0}
.tx .e{width:38px;height:38px;border-radius:12px;background:var(--bg2);display:grid;place-items:center;font-size:18px;flex:none}
.tx .a{font-weight:800;white-space:nowrap}
.in-c{color:#86efac} .out-c{color:#fca5a5} .save-c{color:var(--gold2)}

/* rewards */
.shop{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rw{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px}
.rw .em{font-size:30px}
.rw b{font-size:14px}
.rw .cost{color:var(--gold2);font-weight:800;font-size:13px}
.rw.locked{opacity:.75}
.ach{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.ach .a{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center}
.ach .a .em{font-size:28px;filter:grayscale(1) opacity(.35)}
.ach .a.on{border-color:rgba(245,185,66,.5);background:linear-gradient(180deg,rgba(245,185,66,.12),var(--card))}
.ach .a.on .em{filter:none}
.ach .a b{display:block;font-size:12px;margin-top:4px}
.ach .a span{font-size:10.5px;color:var(--muted)}
.cond{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.cond:last-child{border-bottom:0}
.cond .ok{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:13px;flex:none;background:var(--bg2);border:1px solid var(--line2)}
.cond.met .ok{background:var(--good);border-color:var(--good);color:#032015}
.trip{background:linear-gradient(135deg,#0d3b4f,#123a2e 55%,#3a2c0a);border:1px solid rgba(245,185,66,.35);position:relative;overflow:hidden}
.trip .em-bg{position:absolute;right:-6px;top:-14px;font-size:96px;opacity:.18}

/* settings */
.list-item{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
.list-item .grow{flex:1;min-width:0}
.switch{width:46px;height:28px;border-radius:99px;background:var(--line2);position:relative;flex:none;transition:.2s}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.switch.on{background:var(--good)} .switch.on:after{left:21px}
.field{margin-bottom:12px} .field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:0 0 6px 2px}
.code{font-family:ui-monospace,Menlo,monospace;font-size:15px;letter-spacing:.04em;background:var(--bg2);border:1px dashed var(--line2);padding:12px;border-radius:12px;word-break:break-all;text-align:center}
.banner{border-radius:16px;padding:14px;background:linear-gradient(135deg,rgba(96,165,250,.16),rgba(167,139,250,.12));border:1px solid rgba(96,165,250,.35);font-size:14px;margin-bottom:14px}

/* sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(3,6,12,.66);z-index:50;opacity:0;transition:opacity .2s;backdrop-filter:blur(3px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-height:92vh;overflow:auto;background:var(--bg2);border-top-left-radius:26px;border-top-right-radius:26px;border:1px solid var(--line);padding:10px 18px calc(var(--safe-b) + 22px);transform:translateY(100%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-width:560px;margin:0 auto}
.sheet .grab{width:42px;height:5px;border-radius:9px;background:var(--line2);margin:0 auto 14px}
.sheet h2{font-family:Unbounded,sans-serif;font-size:19px;margin:0 0 14px}
.show .sheet-bg{opacity:1} .show .sheet{transform:none}
.moods{display:flex;justify-content:space-between;gap:6px}
.moods button{flex:1;font-size:26px;padding:10px 0;border-radius:14px;background:var(--card);border:1px solid var(--line);transition:.15s}
.moods button.on{border-color:var(--gold);background:rgba(245,185,66,.14);transform:scale(1.06)}
.rate{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.rate button{padding:10px 0;border-radius:10px;background:var(--card);border:1px solid var(--line);font-weight:800;font-size:13px}
.rate button.on{color:#0b1220;border-color:transparent}

.toast{position:fixed;left:50%;top:calc(var(--safe-t) + 14px);transform:translate(-50%,-140%);background:#1f2a44;border:1px solid var(--line2);padding:11px 16px;border-radius:14px;font-weight:800;z-index:80;transition:transform .3s;box-shadow:0 12px 30px -10px #000;max-width:92vw;text-align:center}
.toast.show{transform:translate(-50%,0)}
canvas#fx{position:fixed;inset:0;pointer-events:none;z-index:90}
.empty{text-align:center;padding:22px 10px;color:var(--muted);font-size:14px}
svg text{font-family:Manrope,sans-serif}
@media (min-width:900px){ #app{max-width:640px} .sheet{max-width:640px} }
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div id="sheet-root"></div>
<div class="toast" id="toast"></div>
<canvas id="fx"></canvas>

<script>
'use strict';
/* ============ helpers ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const now = () => Date.now();
const uid = () => Math.random().toString(36).slice(2, 10) + now().toString(36).slice(-4);
const pad = n => String(n).padStart(2, '0');
const fmt = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const today = () => fmt(new Date());
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return fmt(d); };
const ymOf = s => s.slice(0, 7);
const addMonth = (ym, n) => { const [y, m] = ym.split('-').map(Number); const d = new Date(y, m - 1 + n, 1); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}`; };
const daysIn = ym => { const [y, m] = ym.split('-').map(Number); return new Date(y, m, 0).getDate(); };
const MONTHS = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
const MONTHS_G = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const WD = ['воскресенье','понедельник','вторник','среда','четверг','пятница','суббота'];
const monthName = ym => `${MONTHS[+ym.slice(5) - 1]} ${ym.slice(0, 4)}`;
const dayTitle = s => { const d = parse(s); return `${d.getDate()} ${MONTHS_G[d.getMonth()]}`; };
const money = n => (Math.round(n) || 0).toLocaleString('ru-RU').replace(/,/g, ' ') + ' ' + (S?.settings?.currency || '₸');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ============ constants ============ */
const CATS = {
  iman: { name: 'Иман', color: 'var(--iman)', hex: '#34d399', icon: '🕌' },
  body: { name: 'Тело и питание', color: 'var(--body)', hex: '#fb923c', icon: '💪' },
  mind: { name: 'Разум', color: 'var(--mind)', hex: '#a78bfa', icon: '🧠' },
  work: { name: 'Работа и деньги', color: 'var(--work)', hex: '#60a5fa', icon: '💼' },
};
const DEF_HABITS = [
  { id: 'namaz', cat: 'iman', icon: '🕌', name: '5 намазов', type: 'multi', labels: ['Фаджр','Зухр','Аср','Магриб','Иша'], xp: 50 },
  { id: 'quran', cat: 'iman', icon: '📖', name: 'Коран', type: 'count', target: 2, unit: 'стр', xp: 15 },
  { id: 'azkar', cat: 'iman', icon: '📿', name: 'Азкары', type: 'multi', labels: ['Утро','Вечер'], xp: 10 },
  { id: 'sadaqa', cat: 'iman', icon: '🤲', name: 'Садака / доброе дело', type: 'check', xp: 10 },
  { id: 'food', cat: 'body', icon: '🥗', name: 'Питался правильно', type: 'multi', labels: ['Завтрак','Обед','Ужин'], xp: 20, hint: 'без фастфуда и сладкого' },
  { id: 'water', cat: 'body', icon: '💧', name: 'Вода', type: 'count', target: 8, unit: 'стак.', xp: 10 },

/* ============ state ============ */
const LS = 'istiqama-v1', LS_KEY = 'istiqama-key', LS_DEV = 'istiqama-device', LS_PUSH = 'istiqama-push';
let S = null;
let ui = { tab: 'today', day: today(), month: ymOf(today()), moneyMonth: ymOf(today()), moneyType: 'out', moneyCat: null };
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
function load() { try { const s = JSON.parse(lsGet(LS)); return s && s.v === 1 ? s : null; } catch { return null; } }
function persist() { lsSet(LS, JSON.stringify(S)); }
function save() { S.updatedAt = now(); persist(); queueSync(); }
function randKey(n = 24) { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789'; const r = crypto.getRandomValues(new Uint8Array(n)); return [...r].map(x => a[x % a.length]).join(''); }
function syncKey() { let k = lsGet(LS_KEY); if (!k) { k = randKey(); lsSet(LS_KEY, k); } return k; }
function deviceId() { let k = lsGet(LS_DEV); if (!k) { k = 'd-' + randKey(16); lsSet(LS_DEV, k); } return k; }

function newState(p) {
  const t = now(), start = today();
  return {
    v: 1, updatedAt: t,
    profile: { u: t, name: p.name || 'Друг', start },
    goals: { u: t, monthScore: 80, fundTarget: +p.fund || 300000, tripName: p.trip || 'Отдых на море', namazPct: 90 },

    purchases: [], money: [],

    days: {},
  };
}

/* ============ merge (same logic as server) ============ */
function mergeState(a, b) {
  if (!a) return b; if (!b) return a;
  const out = { v: 1 };
  for (const k of ['profile','goals','settings']) out[k] = ((a[k]?.u || 0) >= (b[k]?.u || 0)) ? a[k] : b[k];
  for (const k of ['habits','money','rewards','purchases','reminders','books']) {
    const m = new Map();
    for (const it of [...(a[k] || []), ...(b[k] || [])]) { const c = m.get(it.id); if (!c || (it.u || 0) > (c.u || 0)) m.set(it.id, it); }
    out[k] = [...m.values()];
  }
  out.days = {};
  for (const d of new Set([...Object.keys(a.days || {}), ...Object.keys(b.days || {})])) {
    const x = a.days?.[d], y = b.days?.[d];
    out.days[d] = !x ? y : !y ? x : ((x.u || 0) >= (y.u || 0) ? x : y);
  }
  out.updatedAt = Math.max(a.updatedAt || 0, b.updatedAt || 0);
  return out;
}

/* ============ sync ============ */
let syncTimer = null, syncState = 'idle';
function setSync(s) { syncState = s; const d = $('#syncdot'); if (d) d.className = 'sync-dot ' + ({ ok: 'ok', busy: 'busy', err: 'err' }[s] || ''); }
function queueSync() { clearTimeout(syncTimer); syncTimer = setTimeout(syncPush, 1200); }
async function syncPush() {
  if (!S) return;
  setSync('busy');
  try {
    const r = await fetch('/api/sync', { method: 'PUT', headers: { 'content-type': 'application/json', 'x-sync-key': syncKey() }, body: JSON.stringify(S) });
    if (!r.ok) throw 0;
    const { data } = await r.json();
    applyRemote(data);
    setSync('ok');
  } catch { setSync('err'); }
}
async function syncPull() {
  if (!S) return;
  setSync('busy');
  try {
    const r = await fetch('/api/sync', { headers: { 'x-sync-key': syncKey() } });
    if (!r.ok) throw 0;
    const { data } = await r.json();
    if (data) { const before = JSON.stringify(S); const m = mergeState(S, data); if (JSON.stringify(m) !== before) { S = m; persist(); render(); } if (JSON.stringify(data) !== JSON.stringify(S)) queueSync(); }
    else queueSync();
    setSync('ok');
  } catch { setSync('err'); }
}
function applyRemote(data) {
  if (!data) return;
  const m = mergeState(S, data);
  if (JSON.stringify(m) !== JSON.stringify(S)) { S = m; persist(); if (!document.querySelector('.sheet')) render(); }
}

/* ============ logic ============ */
const habits = () => S.habits.filter(h => !h.del).sort((a, b) => (a.o ?? 0) - (b.o ?? 0));
const habitsOn = d => S.habits.filter(h => (!h.from || h.from <= d) && (!h.del || (h.delAt && h.delAt > d))).sort((a, b) => (a.o ?? 0) - (b.o ?? 0));
const dayObj = d => S.days[d] || { h: {} };
function hasMoneyOn(d) { return S.money.some(m => !m.del && m.date === d); }
function frac(h, d) {
  const v = dayObj(d).h?.[h.id];
  if (h.type === 'check') return v ? 1 : 0;
  if (h.type === 'count') return clamp((+v || 0) / (h.target || 1), 0, 1);
  if (h.type === 'multi') return Array.isArray(v) ? v.filter(Boolean).length / h.labels.length : 0;
  if (h.type === 'auto') return hasMoneyOn(d) ? 1 : 0;
  return 0;
}
const startDate = () => S.profile.start || today();
function dayScore(d, cat) {
  if (d > today() || d < startDate()) return null;
  const hs = habitsOn(d).filter(h => !cat || h.cat === cat);
  const tot = hs.reduce((s, h) => s + (+h.xp || 0), 0);
  if (!tot) return null;
  return Math.round(hs.reduce((s, h) => s + (+h.xp || 0) * frac(h, d), 0) / tot * 100);
}
function dayXP(d) {
  if (d > today() || d < startDate()) return 0;
  let xp = habitsOn(d).reduce((s, h) => s + (+h.xp || 0) * frac(h, d), 0);
  if (dayObj(d).r?.closed) xp += 30;
  if (dayScore(d) >= 100) xp += 50;
  return Math.round(xp);
}
let _xpCache = null;
function totalXP() {
  if (_xpCache != null) return _xpCache;
  let xp = 0;
  for (let d = startDate(); d <= today(); d = addDays(d, 1)) xp += dayXP(d);
  xp += booksDone().length * 300;
  return (_xpCache = xp);
}
const spent = () => S.purchases.filter(p => !p.del).reduce((s, p) => s + (+p.cost || 0), 0);
const coins = () => totalXP() - spent();
const lvlNeed = L => 125 * (L - 1) * L; // XP для достижения уровня L
function level(xp = totalXP()) { let L = 1; while (xp >= lvlNeed(L + 1)) L++; return { L, cur: xp - lvlNeed(L), need: lvlNeed(L + 1) - lvlNeed(L) }; }
const rank = L => RANKS.filter(r => L >= r[0]).pop()[1];
function streak() {
  let d = today(), n = 0;
  if ((dayScore(d) ?? 0) < GOOD_DAY) d = addDays(d, -1);
  while (d >= startDate() && (dayScore(d) ?? 0) >= GOOD_DAY) { n++; d = addDays(d, -1); }
  return n;
}
function bestStreak(from, to) {
  let best = 0, cur = 0;
  for (let d = from; d <= to; d = addDays(d, 1)) { if ((dayScore(d) ?? 0) >= GOOD_DAY) { cur++; best = Math.max(best, cur); } else cur = 0; }
  return best;
}
function monthRange(ym) {
  const first = ym + '-01', last = `${ym}-${pad(daysIn(ym))}`;
  const from = first < startDate() ? startDate() : first;
  const to = last > today() ? today() : last;
  return { first, last, from, to, ok: from <= to };
}
function monthStats(ym, cat) {
  const r = monthRange(ym);
  if (!r.ok) return null;
  let sum = 0, n = 0, closed = 0, perfect = 0, good = 0;
  for (let d = r.from; d <= r.to; d = addDays(d, 1)) {
    const s = dayScore(d, cat); if (s == null) continue;
    sum += s; n++; if (dayObj(d).r?.closed) closed++; if (s >= 100) perfect++; if (s >= GOOD_DAY) good++;
  }
  return n ? { avg: Math.round(sum / n), n, closed, perfect, good, best: bestStreak(r.from, r.to) } : null;
}
function habitMonthPct(h, ym) {
  const r = monthRange(ym); if (!r.ok) return null;
  let sum = 0, n = 0;
  for (let d = r.from; d <= r.to; d = addDays(d, 1)) { if (!habitsOn(d).includes(h)) continue; sum += frac(h, d); n++; }
  return n ? Math.round(sum / n * 100) : null;
}
function moneyStats(ym) {
  const list = S.money.filter(m => !m.del && m.date.startsWith(ym));
  const sum = t => list.filter(m => m.type === t).reduce((s, m) => s + (+m.amount || 0), 0);
  return { list, inc: sum('in'), out: sum('out'), save: sum('save') };
}
const fundTotal = () => S.money.filter(m => !m.del && m.type === 'save').reduce((s, m) => s + (+m.amount || 0), 0);

/* books */
const readHabit = () => S.habits.find(h => h.book && !h.del);
function bookProgress(b) {
  const rh = readHabit();
  let pages = +b.offset || 0;
  if (rh) for (let d = b.start; d <= (b.finished || today()); d = addDays(d, 1)) pages += +(S.days[d]?.h?.[rh.id] || 0);
  return Math.min(pages, b.pages);
}
const booksAll = () => S.books.filter(b => !b.del).sort((a, b) => a.start < b.start ? 1 : -1);
const booksDone = () => booksAll().filter(b => b.finished);
const currentBook = () => booksAll().find(b => !b.finished);
function checkBooks() {
  let changed = false;
  for (const b of booksAll()) if (!b.finished && bookProgress(b) >= b.pages) { b.finished = today(); b.u = now(); changed = true; celebrate(`📗 Книга «${b.title}» прочитана! +300 XP`); }
  return changed;
}

/* namaz month % */
function namazPct(ym) {
  const h = S.habits.find(x => x.id === 'namaz' && !x.del); if (!h) return null;
  return habitMonthPct(h, ym);
}
function grandGoal(ym) {
  const g = S.goals, ms = monthStats(ym), np = namazPct(ym);
  const booksThisMonth = booksDone().filter(b => b.finished.startsWith(ym)).length;

    { t: `5 намазов ≥ ${g.namazPct}% дней`, v: np != null ? np + '%' : '—', met: np != null && np >= g.namazPct, p: np != null ? clamp(np / g.namazPct, 0, 1) : 0 },
    { t: 'Прочитать книгу месяца', v: booksThisMonth ? '✓' : cb ? `${bookProgress(cb)}/${cb.pages}` : 'нет книги', met: booksThisMonth > 0, p: booksThisMonth ? 1 : cb ? bookProgress(cb) / cb.pages : 0 },

  ];
  return { conds, done: conds.every(c => c.met), p: conds.reduce((s, c) => s + c.p, 0) / conds.length };
}

/* achievements */
function achievements() {
  const xp = totalXP(), L = level(xp).L, st = bestStreak(startDate(), today());

}

function habitRow(x, d, c) {

function setVal(id, val) {

function onTodayAction(act, el) {
  const id = el.dataset.id, h = S.habits.find(x => x.id === id), cur = dayObj(ui.day).h?.[id];
  if (act === 'tog') { if (!cur) vibrate(); setVal(id, !cur); }

  else if (act === 'dec') setVal(id, Math.max(0, (+cur || 0) - (h.type === 'count' && h.target >= 20 ? 5 : 1)));

}

function deltaTag(a, b, raw = false, invert = false) {
  if (a == null || b == null) return `<span class="delta eq tiny" style="justify-self:end">—</span>`;

  if (!txt) return '';

}
function lineChart(ym, prev) {
  const W = 320, H = 130, P = 8, n = daysIn(ym), x = i => P + (i - 1) * (W - 2 * P) / (n - 1), y = v => H - 18 - v / 100 * (H - 30);
  const pts = (m, len) => { const a = []; for (let i = 1; i <= len; i++) { const s = dayScore(`${m}-${pad(i)}`); if (s != null) a.push([i, s]); } return a; };
  const cur = pts(ym, n), pv = pts(prev, Math.min(n, daysIn(prev)));
  const path = a => a.map((p, i) => `${i ? 'L' : 'M'}${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`).join('');
  let g = '';
  for (const v of [0, 50, 100]) g += `<line x1="${P}" x2="${W - P}" y1="${y(v)}" y2="${y(v)}" stroke="#232d45" stroke-dasharray="${v === 70 ? '' : '2 4'}"/><text x="${W - P}" y="${y(v) - 3}" fill="#5c6680" font-size="9" text-anchor="end">${v}%</text>`;
  g += `<line x1="${P}" x2="${W - P}" y1="${y(GOOD_DAY)}" y2="${y(GOOD_DAY)}" stroke="#84cc16" stroke-opacity=".35"/>`;
  if (pv.length > 1) g += `<path d="${path(pv)}" fill="none" stroke="#5c6680" stroke-width="1.5" stroke-dasharray="4 4"/>`;
  if (cur.length > 1) {
    g += `<defs><linearGradient id="lg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#f5b942" stop-opacity=".35"/><stop offset="1" stop-color="#f5b942" stop-opacity="0"/></linearGradient></defs>`;
    g += `<path d="${path(cur)}L${x(cur.at(-1)[0])},${y(0)}L${x(cur[0][0])},${y(0)}Z" fill="url(#lg)"/><path d="${path(cur)}" fill="none" stroke="#f5b942" stroke-width="2.2" stroke-linejoin="round"/>`;
  }
  g += cur.map(p => `<circle cx="${x(p[0])}" cy="${y(p[1])}" r="3.2" fill="${scoreHex(p[1])}" stroke="#0a0e18" stroke-width="1.2"/>`).join('');
  for (const i of [1, 10, 20, n]) g += `<text x="${x(i)}" y="${H - 3}" fill="#5c6680" font-size="9" text-anchor="middle">${i}</text>`;
  return cur.length ? `<svg viewBox="0 0 ${W} ${H}" width="100%">${g}</svg>` : '<div class="empty">Данные появятся после первого дня</div>';
}

    <div class="muted tiny" style="margin-bottom:12px">Дальше страницы из привычки «Чтение книги» добавляются сами.</div>
    <button class="btn primary block" id="b-s">Сохранить</button>${id ? '<button class="btn danger block" id="b-d" style="margin-top:8px">Удалить</button>' : ''}`, root => {
    root.querySelector('#b-s').onclick = () => {
      const title = root.querySelector('#b-t').value.trim(), pages = Math.round(+root.querySelector('#b-p').value);
      if (!title || !(pages > 0)) return toast('Название и страницы?');
      const o = { title, pages, offset: Math.max(0, Math.round(+root.querySelector('#b-o').value || 0)), u: now() };
      if (id) { Object.assign(b, o); if (b.finished && bookProgress({ ...b, finished: null }) < b.pages) b.finished = null; }
      else S.books.push({ id: uid(), start: today(), ...o });
      checkBooks(); save(); closeSheet(); render();
    };
    if (id) root.querySelector('#b-d').onclick = () => { b.del = true; b.u = now(); save(); closeSheet(); render(); };
  });
}

/* ============ push ============ */
function urlB64(b) { const p = '='.repeat((4 - b.length % 4) % 4); const r = atob((b + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...r].map(c => c.charCodeAt(0))); }
async function pushEnable() {
  if (isIOS() && !isStandalone()) { openSheet(`<h2>Сначала установи приложение</h2>${installBanner()}<div class="small muted">iPhone присылает уведомления только приложениям, добавленным на экран «Домой» (iOS 16.4+).</div>`); return; }
  if (!('serviceWorker' in navigator) || !('PushManager' in window) || !('Notification' in window)) { toast('Этот браузер не поддерживает уведомления'); return; }
  const perm = await Notification.requestPermission();
  if (perm !== 'granted') { toast('Разреши уведомления в настройках'); return; }
  try {
    const reg = await navigator.serviceWorker.ready;
    const { key } = await (await fetch('/api/push')).json();
    if (!key) throw new Error('Сервер уведомлений не настроен');
    let sub = await reg.pushManager.getSubscription();
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: urlB64(key) });
    await pushSave(sub);
    lsSet(LS_PUSH, '1'); render();
    celebrate('🔔 Уведомления включены!');
  } catch (e) { toast('Не получилось: ' + (e.message || e)); }
}
async function pushSave(sub) {
  const reminders = S.reminders.filter(r => r.on && !r.del).map(({ id, time, title, body, onlyIfNoReport }) => ({ id, time, title, body, onlyIfNoReport }));
  const r = await fetch('/api/push', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action: 'save', device: deviceId(), sub: sub.toJSON(), tz: Intl.DateTimeFormat().resolvedOptions().timeZone, reminders, key: syncKey() }) });
  if (!r.ok) throw new Error('сервер ответил ' + r.status);
}
async function pushResave() {
  if (lsGet(LS_PUSH) !== '1' || !('serviceWorker' in navigator)) return;
  try { const reg = await navigator.serviceWorker.ready; const sub = await reg.pushManager.getSubscription(); if (sub) await pushSave(sub); else { lsSet(LS_PUSH, '0'); } } catch {}
}
async function pushDisable() {
  try { await fetch('/api/push', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action: 'off', device: deviceId() }) }); const reg = await navigator.serviceWorker.ready; (await reg.pushManager.getSubscription())?.unsubscribe(); } catch {}
  lsSet(LS_PUSH, '0'); render(); toast('Уведомления выключены');
}

/* ============ global actions ============ */
$('#app').addEventListener('click', async e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (['tog','inc','dec','multi','day-prev','day-next','report','go-money'].includes(a)) return onTodayAction(a, el);
  switch (a) {
    case 'm-prev': ui.month = addMonth(ui.month, -1); render(); break;
    case 'm-next': ui.month = addMonth(ui.month, 1); render(); break;
    case 'open-day': ui.day = el.dataset.d; ui.tab = 'today'; render(); scrollTo(0, 0); break;
    case 'open-report': openReport(el.dataset.d); break;
    case 'mm-prev': ui.moneyMonth = addMonth(ui.moneyMonth, -1); render(); break;
    case 'mm-next': ui.moneyMonth = addMonth(ui.moneyMonth, 1); render(); break;
    case 'add-in': openMoneyAdd('in'); break;
    case 'add-out': openMoneyAdd('out'); break;
    case 'add-save': openMoneyAdd('save'); break;
    case 'del-money': { const m = S.money.find(x => x.id === id); if (m && confirm('Удалить запись?')) { m.del = true; m.u = now(); save(); render(); } break; }
    case 'buy': {
      const r = S.rewards.find(x => x.id === id); if (!r || coins() < r.cost) return;
      if (!confirm(`Забрать награду «${r.name}» за ${r.cost} монет?`)) return;
      S.purchases.push({ id: uid(), u: now(), rid: r.id, name: r.name, icon: r.icon, cost: r.cost, date: today() });
      save(); render(); celebrate(`${r.icon} Награда твоя! Ты её заслужил.`); break;
    }
    case 'unbuy': { const p = S.purchases.find(x => x.id === id); if (p && confirm('Вернуть монеты за эту награду?')) { p.del = true; p.u = now(); save(); render(); } break; }
    case 'rw-add': openRewardEdit(); break;
    case 'rw-edit': openRewardEdit(id); break;
    case 'hab-add': openHabitEdit(); break;
    case 'hab-edit': openHabitEdit(id); break;
    case 'rem-add': openReminderEdit(); break;
    case 'rem-edit': openReminderEdit(id); break;
    case 'rem-toggle': { const r = S.reminders.find(x => x.id === id); r.on = !r.on; r.u = now(); save(); pushResave(); render(); break; }
    case 'push-toggle': lsGet(LS_PUSH) === '1' ? pushDisable() : pushEnable(); break;
    case 'push-test': { const r = await fetch('/api/push', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ action: 'test', device: deviceId() }) }); toast(r.ok ? 'Отправлено — смотри уведомление' : 'Ошибка отправки, включи уведомления заново'); break; }
    case 'book-add': openBookEdit(); break;
    case 'book-edit': openBookEdit(id); break;
    case 'install': deferredInstall?.prompt(); break;
    case 'save-goals': {
      const v = s => $(s).value;
      S.profile = { ...S.profile, name: v('#s-name').trim() || S.profile.name, u: now() };
      S.goals = { ...S.goals, tripName: v('#s-trip').trim() || S.goals.tripName, fundTarget: Math.max(0, +v('#s-fund') || 0), monthScore: clamp(+v('#s-score') || 80, 10, 100), namazPct: clamp(+v('#s-namaz') || 90, 10, 100), u: now() };
      S.settings = { ...S.settings, currency: v('#s-cur').trim() || '₸', u: now() };
      save(); render(); toast('Сохранено ✓'); break;
    }
    case 'copy-code': try { await navigator.clipboard.writeText(syncKey()); toast('Код скопирован'); } catch { toast('Выдели код и скопируй вручную'); } break;
    case 'link-device': openLink(); break;
    case 'export': {
      const blob = new Blob([JSON.stringify(S, null, 1)], { type: 'application/json' });
      const a2 = document.createElement('a'); a2.href = URL.createObjectURL(blob); a2.download = `istiqama-${today()}.json`; a2.click(); break;
    }
    case 'import': {
      const inp = document.createElement('input'); inp.type = 'file'; inp.accept = '.json,application/json';
      inp.onchange = async () => { try { const d = JSON.parse(await inp.files[0].text()); if (d.v !== 1) throw 0; S = mergeState(S, d); save(); render(); toast('Копия загружена ✓'); } catch { toast('Не тот файл'); } };
      inp.click(); break;
    }
  }
});
function openLink(prefill = '') {
  openSheet(`<h2>Подключить устройство</h2><div class="small" style="margin-bottom:12px">Введи код с другого устройства (Ещё → Ноутбук + iPhone). Данные этого устройства заменятся данными из облака.</div>
    <div class="field"><input id="l-k" placeholder="Код синхронизации" value="${esc(prefill)}" autocapitalize="off" autocorrect="off" spellcheck="false" style="font-family:ui-monospace,monospace"></div>
    <button class="btn primary block" id="l-s">Подключить</button>`, root => {
    root.querySelector('#l-s').onclick = async () => {
      const k = root.querySelector('#l-k').value.trim();
      if (!/^[A-Za-z0-9-]{16,64}$/.test(k)) return toast('Код неверный');
      try {
        const r = await fetch('/api/sync', { headers: { 'x-sync-key': k } }); const { data } = await r.json();
        if (!data) return toast('По этому коду данных нет');
        lsSet(LS_KEY, k); S = data; persist(); closeSheet(); ui.tab = 'today'; render(); pushResave();
        celebrate('☁️ Устройства связаны!');
      } catch { toast('Нет связи с сервером'); }
    };
  });
}

/* ============ sheet, toast, confetti ============ */
let sheetCleanup = null;
function openSheet(html, mount) {
  const root = $('#sheet-root');
  root.innerHTML = `<div class="sheet-bg"></div><div class="sheet" role="dialog"><div class="grab"></div>${html}</div>`;
  root.querySelector('.sheet-bg').onclick = closeSheet;
  requestAnimationFrame(() => requestAnimationFrame(() => root.classList.add('show')));
  mount && mount(root.querySelector('.sheet'));
}
function closeSheet() { const root = $('#sheet-root'); root.classList.remove('show'); setTimeout(() => { if (!root.classList.contains('show')) root.innerHTML = ''; }, 280); }
let toastT;
function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => el.classList.remove('show'), 2600); }
function celebrate(t) { toast(t); confetti(); try { navigator.vibrate?.([20, 40, 20]); } catch {} }
function confetti() {
  const c = $('#fx'), x = c.getContext('2d'), dpr = devicePixelRatio || 1;
  c.width = innerWidth * dpr; c.height = innerHeight * dpr; x.scale(dpr, dpr);
  const cols = ['#f5b942','#34d399','#a78bfa','#60a5fa','#fb923c','#ffffff'];
  const ps = Array.from({ length: 110 }, () => ({ x: innerWidth / 2, y: innerHeight * .35, vx: (Math.random() - .5) * 13, vy: Math.random() * -13 - 3, s: Math.random() * 7 + 4, r: Math.random() * 6, vr: (Math.random() - .5) * .4, c: cols[Math.random() * cols.length | 0] }));
  let f = 0;
  (function tick() {
    x.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of ps) { p.vy += .38; p.x += p.vx; p.y += p.vy; p.vx *= .99; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); }
    if (++f < 130) requestAnimationFrame(tick); else x.clearRect(0, 0, innerWidth, innerHeight);
  })();
}

/* ============ onboarding ============ */
function renderOnboarding() {
  $('#tabs').innerHTML = '';
  $('#app').innerHTML = `<div style="text-align:center;padding:30px 4px 10px">
    <img src="/icon-192.png" alt="" width="88" height="88" style="border-radius:24px;box-shadow:0 18px 40px -14px rgba(245,185,66,.5)">
    <h1 class="h-font" style="font-size:30px;margin:18px 0 6px">Истикама</h1>
    <div class="muted">Игра дисциплины. Иман, тело, разум, деньги —<br>каждый день, с отчётом и наградами.</div></div>
    <div class="card" style="margin-top:18px">
      <div class="field"><label>Как тебя зовут?</label><input id="o-name" placeholder="Имя" autocomplete="given-name"></div>
      <div class="field"><label>📗 Книга этого месяца</label><input id="o-book" placeholder="Название книги"></div>
      <div class="grid2"><div class="field"><label>Страниц в книге</label><input id="o-pages" type="number" inputmode="numeric" value="250"></div><div class="field"><label>Валюта</label><input id="o-cur" value="₸" maxlength="4"></div></div>
      <div class="field"><label>🏝 Главная награда — куда хочешь поехать?</label><input id="o-trip" placeholder="Например: Иссык-Куль, Стамбул, Дубай"></div>
      <div class="field"><label>Сколько нужно накопить на отдых</label><input id="o-fund" type="number" inputmode="numeric" value="300000"></div>
      <button class="btn primary block" id="o-go" style="margin-top:6px">Начать путь 🔥</button>
      <button class="btn ghost block small muted" id="o-link" style="margin-top:6px">У меня уже есть код с другого устройства</button>
    </div>`;
  $('#o-go').onclick = () => {
    const name = $('#o-name').value.trim(); if (!name) return toast('Напиши имя');
    S = newState({ name, book: $('#o-book').value.trim(), pages: $('#o-pages').value, currency: $('#o-cur').value.trim(), trip: $('#o-trip').value.trim(), fund: $('#o-fund').value });
    save(); render(); celebrate(`Бисмиллях, ${name}! Путь начат 🔥`);
  };
  $('#o-link').onclick = () => openLink();
}

/* ============ boot ============ */
let deferredInstall = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; });
S = load();
if (S) syncKey();
render();
if (S) { syncPull(); pushResave(); }
if (new URLSearchParams(location.search).get('open') === 'report' && S) { history.replaceState(null, '', '/'); setTimeout(() => openReport(today()), 300); }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && S) { render(); syncPull(); } });
addEventListener('online', () => S && syncPush());
if ('serviceWorker' in navigator) navigator.serviceWorker.register('/sw.js').catch(() => {});
navigator.serviceWorker?.addEventListener('message', e => { if (e.data?.open === 'report' && S) openReport(today()); });
</script>
</body>
