<title>Беркут English</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Nunito:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: bright single-theme mobile app. White cards on a cool grey ground, chunky display type, colourful teacher characters that move and talk. */
:root{
  color-scheme:light;
  --bg:#F4F5FA; --surface:#FFFFFF; --surface-2:#F1F2F8; --ink:#16162B; --muted:#6C6F84; --line:#E3E5EF;
  --coral:#EB5A46; --coral-d:#D2442F; --coral-soft:#FDE9E5;
  --blue:#2F5FE8; --blue-soft:#E4EBFE; --yellow:#F4B63F; --yellow-soft:#FEF3DC;
  --green:#22A861; --green-soft:#DFF5E8; --purple:#9257E0; --purple-soft:#EFE5FC;
  --sky:var(--blue); --sky-soft:var(--blue-soft); --accent:var(--coral); --accent-soft:var(--coral-soft); --accent-ink:#B5321F;
  --ok:var(--green); --ok-soft:var(--green-soft); --bad:#E5484D; --bad-soft:#FDE7E8;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif; --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --r:22px; --shadow:0 2px 0 rgba(22,22,43,.04),0 8px 24px rgba(22,22,43,.06);
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);overflow-x:clip;overscroll-behavior-x:none}
body{font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em;font-weight:700}
h1{font-size:clamp(24px,6vw,32px);line-height:1.15}
h2{font-size:clamp(19px,4.6vw,23px);line-height:1.2}
h3{font-size:17px;line-height:1.25}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid color-mix(in srgb,var(--blue) 45%,transparent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-body);font-weight:800;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.wrap{max-width:780px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--f-display);font-weight:800;font-size:19px;letter-spacing:-.02em}
.brand .logo{width:40px;height:40px;flex:none}
.brand small{display:block;font-family:var(--f-body);font-weight:700;font-size:11px;letter-spacing:0;color:var(--muted);margin-top:-2px}
.stats{margin-left:auto;display:flex;gap:6px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:999px;background:var(--surface-2);font-weight:800;font-size:13px;white-space:nowrap;font-variant-numeric:tabular-nums}
.pill svg{width:15px;height:15px}
.tabs{display:flex;gap:4px}
.tab{border:0;background:none;padding:8px 12px;border-radius:999px;color:var(--muted);font-weight:800;display:flex;align-items:center;gap:6px;font-size:14px}
.tab svg{width:19px;height:19px}
.tab[aria-current="page"]{background:var(--coral-soft);color:var(--coral)}
.tabbar{display:none}
@media (max-width:760px){
  .tabs-top{display:none}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  .tabbar .tab{flex:1;flex-direction:column;gap:2px;font-size:11px;padding:6px 2px;border-radius:14px}
  main{padding-bottom:90px}
  .stats .pill.hide-sm{display:none}
}
body.ob-on .top,body.ob-on .tabbar{display:none}
body.ob-on main{padding-bottom:30px}
main{padding-block:18px 40px}
.view{display:grid;gap:16px}

/* cards, buttons */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.btn{border:2px solid var(--line);background:var(--surface);padding:11px 18px;border-radius:999px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:8px;font-size:15px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn:hover{border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
.btn.primary,.btn.accent{background:var(--coral);border-color:var(--coral);color:#fff}
.btn.primary:hover,.btn.accent:hover{background:var(--coral-d);border-color:var(--coral-d)}
.btn.blue{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.white{background:#fff;border-color:#fff;color:var(--c,var(--coral))}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding-inline:8px}
.btn.ghost-white{background:rgba(255,255,255,.16);border-color:transparent;color:#fff}
.btn.big{padding:16px 22px;font-size:16px;letter-spacing:.04em;text-transform:uppercase;width:100%}
.btn:disabled{opacity:.5;cursor:default}
.btn svg{width:18px;height:18px}

/* mascot */
.mascot{display:block;overflow:visible;width:100%;height:auto}
.mascot .m-root{animation:bob 3.2s ease-in-out infinite;transform-origin:100px 190px}
@keyframes bob{50%{transform:translateY(-5px) scale(1.015,.985)}}
.mascot .m-eye{transition:transform .1s,opacity .15s}
.mascot.blink .m-eye{transform:scaleY(.08)}
.mascot .m-pupil{transition:transform .35s cubic-bezier(.3,1.4,.5,1)}
.mascot .m-happy,.mascot .m-brow{opacity:0;transition:opacity .2s}
.mascot[data-state="happy"] .m-happy{opacity:1}
.mascot[data-state="happy"] .m-eye{opacity:0}
.mascot[data-state="happy"] .m-root{animation:hop .55s ease 2}
.mascot[data-state="angry"] .m-brow{opacity:1}
.mascot[data-state="angry"] .m-root{animation:shake .45s ease 2}
.mascot[data-state="thinking"] .m-root{animation:think 1.6s ease-in-out infinite}
.mascot[data-state="listening"] .m-eye{transform:scale(1.14)}
.mascot[data-state="listening"] .m-root{animation:lean 1.2s ease-in-out infinite}
.mascot.ringing .m-root{animation:ring .45s ease-in-out infinite}
.mascot .m-fire,.mascot .m-stars,.mascot .m-sweat,.mascot .m-spark,.mascot .m-sadbrow{opacity:0;transition:opacity .25s}
.mascot[data-mood="angry"] .m-fire{opacity:1}
.mascot[data-mood="angry"] .m-brow{opacity:1}
.mascot .m-fire path{transform-box:fill-box;transform-origin:50% 100%;animation:flick .32s ease-in-out infinite alternate}
.mascot .m-fire path:nth-child(2n){animation-duration:.27s;animation-delay:-.1s}
@keyframes flick{0%{transform:scaleY(.82) skewX(-4deg)}100%{transform:scaleY(1.12) skewX(5deg)}}
.mascot[data-mood="wow"] .m-stars,.mascot[data-mood="wow"] .m-spark{opacity:1}
.mascot[data-mood="wow"] .m-eye{opacity:0}
.mascot .m-spark path{transform-box:fill-box;transform-origin:center;animation:twinkle 1s ease-in-out infinite}
.mascot .m-spark path:nth-child(2){animation-delay:-.4s}.mascot .m-spark path:nth-child(3){animation-delay:-.7s}
@keyframes twinkle{50%{transform:scale(.4) rotate(45deg);opacity:.4}}
.mascot .m-stars path{transform-box:fill-box;transform-origin:center;animation:spin 2.4s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.mascot[data-mood="happy"] .m-happy,.mascot[data-mood="laugh"] .m-happy{opacity:1}
.mascot[data-mood="happy"] .m-eye,.mascot[data-mood="laugh"] .m-eye{opacity:0}
.mascot[data-mood="laugh"] .m-root{animation:laugh .28s ease-in-out infinite}
@keyframes laugh{50%{transform:translateY(-4px) rotate(2deg)}}
.mascot[data-mood="sad"] .m-sweat,.mascot[data-mood="sad"] .m-sadbrow{opacity:1}
.mascot[data-mood="sad"] .m-pupil{transform:translate(0,5px)!important}
.mascot .m-sweat{animation:drip 1.6s ease-in infinite}
@keyframes drip{0%{transform:translateY(-4px)}100%{transform:translateY(8px)}}
.mascot.m-static .m-root{animation:none}
.mascot .m-mouth{transition:d .09s}
.mascot .m-jaw{transition:transform .09s}
@keyframes hop{40%{transform:translateY(-16px) scale(.97,1.04)}70%{transform:translateY(0) scale(1.04,.96)}}
@keyframes shake{20%{transform:translateX(-6px) rotate(-3deg)}60%{transform:translateX(6px) rotate(3deg)}}
@keyframes think{50%{transform:rotate(-5deg) translateY(-3px)}}
@keyframes lean{50%{transform:scale(1.03)}}
@keyframes ring{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.m-thinkanim .m-pupil{animation:look 1.4s ease-in-out infinite}
@keyframes look{0%,100%{transform:translate(5px,-5px)}50%{transform:translate(-5px,-5px)}}

/* hero */
.hero-card{--c:var(--coral);position:relative;background:var(--c);color:#fff;border-radius:28px;padding:24px 22px;display:grid;grid-template-columns:1fr minmax(120px,190px);gap:10px;align-items:center;overflow:hidden;box-shadow:0 10px 30px color-mix(in srgb,var(--c) 30%,transparent)}
.hero-card .eyebrow{color:rgba(255,255,255,.8)}
.hero-card h1{margin-top:6px}
.hero-card p{margin:8px 0 0;font-weight:600;opacity:.95;max-width:40ch}
.hero-char{position:relative;align-self:end}
.speech{position:absolute;top:-8px;right:4px;background:#fff;color:var(--ink);font-weight:800;font-size:13px;padding:8px 12px;border-radius:16px;box-shadow:0 6px 16px rgba(0,0,0,.12);max-width:170px;line-height:1.3}
.xpbar{height:12px;border-radius:999px;background:rgba(255,255,255,.28);overflow:hidden;margin-top:16px}
.xpbar i{display:block;height:100%;background:#fff;border-radius:999px;transition:width .6s}
.xplabel{font-weight:800;font-size:13px;margin-top:6px}
.hero-card .row{margin-top:6px;grid-column:1/-1;position:relative;z-index:1}
@media (max-width:520px){.hero-card{grid-template-columns:1fr 104px;padding:20px 18px}.speech{display:none}}

/* missions / option cards */
.missions{display:grid;gap:10px}
.mission{display:grid;grid-template-columns:48px 1fr auto;gap:14px;align-items:center;width:100%;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:18px;padding:12px 14px;transition:border-color .15s,transform .12s}
.mission:hover{border-color:color-mix(in srgb,var(--coral) 45%,var(--line))}
.mission:active{transform:scale(.99)}
.mission .ic{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue)}
.mission .ic svg{width:24px;height:24px}
.ic.c-coral{background:var(--coral-soft);color:var(--coral)}.ic.c-blue{background:var(--blue-soft);color:var(--blue)}.ic.c-yellow{background:var(--yellow-soft);color:#B97A06}.ic.c-green{background:var(--green-soft);color:var(--green)}.ic.c-purple{background:var(--purple-soft);color:var(--purple)}
.mission.done{background:var(--surface-2)}
.mission.done .ic{background:var(--green-soft);color:var(--green)}
.mission b{display:block;font-weight:800;font-size:16px}
.mission span.sub{font-size:13px;color:var(--muted);font-weight:600}
.mission .xp{font-weight:800;font-size:13px;color:var(--coral);background:var(--coral-soft);padding:4px 10px;border-radius:999px;white-space:nowrap}
.mission.done .xp{background:var(--green-soft);color:var(--green)}
.goalbar{height:10px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.goalbar i{display:block;height:100%;background:var(--coral);border-radius:999px;transition:width .5s}
.focus dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:12px 0 0}
.focus dt{font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);padding-top:3px}
.focus dd{margin:0;font-weight:600}
.target{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center}
.target svg{width:96px;height:96px}

/* lesson */
.lesson-head{display:flex;align-items:center;gap:10px}
.progress-steps{display:flex;gap:5px;margin-top:12px}
.progress-steps i{flex:1;height:8px;border-radius:4px;background:var(--line)}
.progress-steps i.on{background:var(--blue)}
.progress-steps i.ok{background:var(--green)}
.progress-steps i.bad{background:var(--bad)}
.flash{border:2px solid var(--line);border-radius:22px;padding:28px 20px;text-align:center;background:var(--surface-2);min-height:230px;display:grid;place-items:center;gap:6px;width:100%}
.flash .w{font-family:var(--f-display);font-size:30px;font-weight:700}
.flash .ipa{font-family:var(--f-mono);color:var(--muted)}
.flash .tr{font-size:21px;font-weight:800;color:var(--blue)}
.q{font-size:18px;font-weight:700;margin:4px 0 12px}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:2px solid var(--line);background:var(--surface);padding:14px 16px;border-radius:16px;font-weight:700}
.opt:hover:not(:disabled){border-color:var(--blue)}
.opt.ok{border-color:var(--green);background:var(--green-soft)}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.field{width:100%;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:16px;padding:12px 14px;font:inherit;font-weight:600}
.field:focus{border-color:var(--blue);outline:none}
textarea.field{min-height:160px;resize:vertical;line-height:1.55}
.note{border-radius:16px;padding:14px 16px;background:var(--surface-2);font-size:15px;font-weight:600}
.note.ok{background:var(--green-soft)}.note.bad{background:var(--bad-soft)}.note.info{background:var(--blue-soft)}
.explain p{margin:.4em 0}
.pattern{font-family:var(--f-mono);font-size:14px;padding:12px 14px;border-radius:14px;background:var(--yellow-soft);color:#7A5000;overflow-x:auto}
.ex-list{display:grid;gap:8px;margin:10px 0 0;padding:0;list-style:none}
.ex-list li{display:grid;gap:1px;font-weight:600}
.ex-list small{color:var(--muted)}
.thinking{display:flex;align-items:center;gap:12px;color:var(--muted);font-weight:700}
.thinking .mascot{width:56px;flex:none}
.band{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.band .big{font-family:var(--f-display);font-size:46px;font-weight:800;color:var(--blue);line-height:1}
.crit{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-top:12px}
.crit div{background:var(--surface-2);border-radius:14px;padding:10px 12px;font-size:13px;font-weight:600}
.crit b{font-family:var(--f-display);font-size:17px;display:block}
.fix{display:grid;gap:2px;padding:10px 12px;border-radius:14px;background:var(--surface-2);font-size:14px;font-weight:600;text-align:left}
.fix s{color:var(--bad)}
.fix ins{text-decoration:none;color:var(--green);font-weight:800}
.fix small{color:var(--muted)}
.chip{flex:none;border:2px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:999px;font-size:13px;font-weight:800}
.chip[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.modes{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chat{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 14px;border-radius:18px;line-height:1.5;min-width:0;overflow-wrap:anywhere;font-weight:600}
.msg.me{align-self:flex-end;background:var(--blue);color:#fff;border-bottom-right-radius:6px}
.msg.t{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:6px}
.msg p{margin:.2em 0}
.composer{display:flex;gap:8px;align-items:flex-end;width:100%}
.composer .field{flex:1;min-width:0}
.iconbtn{width:50px;height:50px;flex:none;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink)}
.iconbtn svg{width:21px;height:21px}
.iconbtn.live{background:var(--bad);border-color:var(--bad);color:#fff}
.iconbtn.send{background:var(--coral);border-color:var(--coral);color:#fff}
.iconbtn[aria-pressed="false"]{color:var(--muted);opacity:.6}
.mini{border:0;background:none;color:var(--muted);padding:4px 8px;border-radius:999px;display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:800}
.mini:hover{background:var(--surface-2)}
.mini svg{width:15px;height:15px}

/* talk stage */
.pick-hero{text-align:center;display:grid;justify-items:center;gap:8px;padding:26px 18px;border-radius:28px;background:radial-gradient(circle at 30% 20%,var(--blue-soft),transparent 55%),radial-gradient(circle at 80% 70%,var(--coral-soft),transparent 55%),var(--surface);border:1px solid var(--line)}
.pick-hero .mascot{width:min(220px,58vw)}
.charcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.charcard{--c:var(--coral);position:relative;text-align:left;border:0;border-radius:26px;background:var(--c);color:#fff;padding:18px;display:grid;grid-template-columns:1fr 96px;gap:6px 10px;align-items:center;overflow:hidden;min-height:170px;box-shadow:0 8px 22px color-mix(in srgb,var(--c) 30%,transparent);transition:transform .15s}
.charcard:hover{transform:translateY(-2px)}
.charcard[aria-pressed="true"]{outline:4px solid var(--c);outline-offset:4px}
.charcard .tag{display:inline-block;background:rgba(255,255,255,.22);font-weight:800;font-size:12px;padding:3px 10px;border-radius:999px;margin-top:6px}
.charcard h3{font-size:18px}
.charcard q{display:block;font-weight:700;font-size:14px;opacity:.95;margin-top:10px;quotes:"«" "»"}
.charcard .go{display:inline-flex;margin-top:12px;background:#fff;color:var(--c);font-weight:800;border-radius:999px;padding:8px 14px;font-size:14px}
.stage{--c:var(--coral);--glow:var(--c);position:relative;display:grid;justify-items:center;gap:10px;text-align:center;border-radius:30px;padding:16px 16px 22px;background:#FBFBFD;border:1px solid var(--line);box-shadow:var(--shadow)}
.ctimer{justify-self:start;font-size:12px;color:var(--muted);font-weight:500}
.stage-char{width:min(280px,66vw);margin-top:6px;position:relative;filter:drop-shadow(0 0 18px color-mix(in srgb,var(--glow) 55%,transparent)) drop-shadow(0 0 4px color-mix(in srgb,var(--glow) 70%,transparent));transition:filter .4s}
.stage-char.speaking{animation:glow 1.1s ease-in-out infinite}
@keyframes glow{50%{filter:drop-shadow(0 0 30px color-mix(in srgb,var(--glow) 75%,transparent)) drop-shadow(0 0 6px color-mix(in srgb,var(--glow) 85%,transparent))}}
.hero-char{filter:drop-shadow(0 0 14px rgba(255,255,255,.55))}
.status{background:none!important;border:0!important;color:var(--muted)!important;font-weight:700;padding:0}
.status::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--line);margin-right:6px;vertical-align:1px}
.status[data-s="listening"]::before{background:var(--bad);animation:blinkdot .8s infinite}
.status[data-s="talking"]::before{background:var(--glow,var(--c));animation:blinkdot .8s infinite}
.status[data-s="thinking"]::before{background:var(--yellow);animation:blinkdot .8s infinite}
@keyframes blinkdot{50%{opacity:.25}}
.stage-name{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.stage-name b{font-family:var(--f-display);font-size:19px}
.status{background:#fff;border:2px solid var(--line);color:var(--muted)}
.status[data-s="listening"]{background:var(--bad);border-color:var(--bad);color:#fff}
.status[data-s="talking"]{background:var(--c);border-color:var(--c);color:#fff}
.bubble{position:relative;background:#fff;border-radius:22px;padding:16px 18px;max-width:560px;width:100%;box-shadow:0 6px 20px rgba(22,22,43,.08);font-size:17px;font-weight:700;line-height:1.45;text-align:left;min-height:64px}
.bubble::before{content:"";position:absolute;top:-10px;left:50%;margin-left:-11px;border:11px solid transparent;border-top:0;border-bottom-color:#fff}
.bubble p{margin:.2em 0}
.b-tools{display:flex;gap:4px;margin-top:6px;margin-left:-8px}
.fixes{display:grid;gap:8px;width:100%;max-width:560px}
.you{font-size:14px;font-style:italic;font-weight:600;max-width:560px;min-height:1.4em}

.map-row{position:relative;display:grid;justify-items:center;gap:2px;padding:4px 0}
.map-row>.node,.map-row>.stars,.map-row>.map-char{position:relative;left:var(--x)}
.node{width:70px;height:66px;border-radius:50%;border:0;display:grid;place-items:center;color:#fff;background:var(--line);box-shadow:0 6px 0 color-mix(in srgb,var(--ink) 18%,transparent);transition:transform .12s}

@keyframes nodepulse{50%{box-shadow:0 6px 0 var(--coral-d),0 0 0 14px var(--coral-soft)}}
.stars{display:flex;gap:2px;font-size:15px;color:var(--line);margin-top:4px}.stars i{font-style:normal}.stars i.on{color:var(--yellow)}

.chest-t{font-size:12px;font-weight:800;color:var(--muted);text-align:center;max-width:200px;margin-top:6px}
/* league */
.league{--lc:#C98A4B}

<script>
/* Standalone mode (own website): provide the same window.claude API the app uses on claude.ai. */
(function(){
  if(window.claude&&typeof window.claude.use==="function")return;
  function mapErr(e,status){if(e&&e.name==="AbortError")return{code:"cancelled",message:"cancelled"};if(status===429)return{code:"rate_limited",message:"rate limited"};return{code:"upstream_error",message:String(e&&e.message||e||status)}}
  async function sample(input,opts){
    opts=opts||{};const messages=typeof input==="string"?[{role:"user",content:input}]:input;
    let r;try{r=await fetch("/api/ai",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages,tier:opts.modelTier||"default"}),signal:opts.signal})}catch(e){throw mapErr(e)}
    if(!r.ok||!r.body){let t="";try{t=await r.text()}catch(e){}throw mapErr(new Error(t||("HTTP "+r.status)),r.status)}
    const rd=r.body.getReader(),dec=new TextDecoder();let text="";
    try{for(;;){const {done,value}=await rd.read();if(done)break;const delta=dec.decode(value,{stream:true});if(!delta)continue;text+=delta;if(opts.onText)opts.onText({text,delta})}}catch(e){const er=mapErr(e);er.text=text;throw er}
    if(text.includes("[[ERROR]]"))throw{code:"upstream_error",message:text,text:text.split("[[ERROR]]")[0]};
    if(!text.trim())throw{code:"empty_completion",message:"empty"};
    return{text,truncated:false};
  }
  sample.json=async function(input,opts){
    const add="\n\nОтветь ТОЛЬКО валидным JSON, без пояснений и без ```.";
    const inp=typeof input==="string"?input+add:input.map((m,i)=>i===input.length-1?{role:m.role,content:m.content+add}:m);
    const {text}=await sample(inp,Object.assign({},opts,{onText:null}));
    let t=text.trim().replace(/^```(?:json)?\s*/i,"").replace(/```\s*$/,"");
    const a=t.search(/[\[{]/),b=Math.max(t.lastIndexOf("}"),t.lastIndexOf("]"));if(a>=0&&b>a)t=t.slice(a,b+1);
    try{return JSON.parse(t)}catch(e){throw{code:"invalid_json",message:"invalid json",text}}
  };
  sample.limits=async()=>({images:false});
  function dictation(){
    const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return null;
    let rec=null,state="idle",stopRes=null;const fin=[],par=[],st=[];
    const emit=(arr,v)=>arr.forEach(f=>{try{f(v)}catch(e){}});
    return{
      start(o){o=o||{};return new Promise((res,rej)=>{
        if(rec){res();return}
        rec=new SR();const L=o.language||"en";rec.lang=L==="ru"?"ru-RU":L==="en"?"en-US":L;rec.continuous=true;rec.interimResults=true;let started=false;
        rec.onstart=()=>{started=true;state="listening";emit(st,{state});res()};
        rec.onresult=e=>{let interim="";for(let i=e.resultIndex;i<e.results.length;i++){const r=e.results[i];if(r.isFinal)emit(fin,{text:" "+r[0].transcript.trim()});else interim+=r[0].transcript}emit(par,{text:interim})};
        rec.onerror=e=>{if(!started)rej({code:(e.error==="not-allowed"||e.error==="service-not-allowed")?"not_granted":"unavailable"})};
        rec.onend=()=>{rec=null;state="idle";emit(par,{text:""});emit(st,{state:"idle",reason:"stopped"});if(stopRes){stopRes();stopRes=null}};
        try{rec.start()}catch(err){rec=null;rej({code:"unavailable"})}
      })},
      stop(){return new Promise(r=>{if(!rec){r();return}stopRes=r;try{rec.stop()}catch(e){r()}})},
      active(){return state!=="idle"},
      onPartial(f){par.push(f);return()=>{}},onFinal(f){fin.push(f);return()=>{}},onState(f){st.push(f);return()=>{}}
    };
  }
  const dict=dictation();
  window.claude={__standalone:true,use:async n=>n==="sample"?sample:n==="dictation"?dict:null};
})();
</script>

/* ---------- state ---------- */
let PROFILE=(()=>{try{return JSON.parse(localStorage.getItem("berkut.active"))||"me"}catch(e){return "me"}})();
let LS_KEY=PROFILE==="me"?"berkut.v1":"berkut.v1."+PROFILE;
const todayKey=()=>dkey(new Date());
function dkey(d){const z=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())}
function defaultState(){return{profile:{startDate:todayKey(),monthOverride:null,xp:0,streak:0,lastActive:"",days:{},bands:[],persona:"savage",hw:null,games:{},char:"berkut",charChosen:false,onboarded:false,ob:{}},notebook:{words:[],mistakes:[]}}}
let S=defaultState();
let chatState={mode:"blitz",turns:[]};
let planLang="ru";
const ls={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
function loadLocal(){S=defaultState();chatState={mode:"blitz",turns:[]};const v=ls.get(LS_KEY);if(v&&v.profile){S={profile:{...defaultState().profile,...v.profile},notebook:{...defaultState().notebook,...v.notebook}}}
 const c=ls.get(LS_KEY+".chat");if(c&&Array.isArray(c.turns))chatState=c;
 const pl=ls.get(LS_KEY+".planLang");if(pl)planLang=pl}
loadLocal();

/* ---------- capabilities ---------- */
const cap={sample:null,db:null,user:null,tts:null,dict:null,uid:null};
const use=n=>(window.claude&&typeof window.claude.use==="function")?window.claude.use(n).catch(()=>null):Promise.resolve(null);
use("sample").then(s=>{cap.sample=s;rerenderIfAiView()});
use("tts").then(t=>{cap.tts=t});
use("dictation").then(d=>{cap.dict=d;if(d)bindDictation()});
let remoteReady=null;
async function loadRemote(){
  if(!remoteReady)remoteReady=(async()=>{const [db,user]=await Promise.all([use("db"),use("user")]);if(!db||!user)return false;const id=await user.id();if(!id)return false;cap.db=db;cap.uid=id;
    try{const pr=await db.doc("data/users/"+id+"/profiles").get();if(pr.exists&&Array.isArray(pr.data().list)){const loc=getProfiles();const rem=pr.data().list;const merged=[...rem];loc.forEach(x=>{if(!merged.some(y=>y.id===x.id))merged.push(x)});ls.set("berkut.profiles",JSON.parse(JSON.stringify(merged)))}}catch(e){}
    return true})().catch(()=>false);
  if(!await remoteReady)return;
  const db=cap.db,prof=PROFILE;
  try{
    const [p,n]=await Promise.all([db.doc(docPath("profile")).get(),db.doc(docPath("notebook")).get()]);
    if(prof!==PROFILE)return;
    if(p.exists){const d=p.data();S.profile={...defaultState().profile,...JSON.parse(JSON.stringify(d))}}
    if(n.exists){const d=n.data();S.notebook={...defaultState().notebook,...JSON.parse(JSON.stringify(d))}}
    if(!p.exists)queueSave("profile");
    if(!n.exists&&(S.notebook.words.length||S.notebook.mistakes.length))queueSave("notebook");
    if(prof!==PROFILE)return;
    ls.set(LS_KEY,S);render();
  }catch(e){}
}
loadRemote();
function docPath(name){return "data/users/"+cap.uid+"/"+(PROFILE==="me"?name:PROFILE+"_"+name)}
const saveTimers={},saving={},dirty={};
function persist(...which){ls.set(LS_KEY,S);which.forEach(queueSave)}
function queueSave(name){if(!cap.db)return;clearTimeout(saveTimers[name]);saveTimers[name]=setTimeout(()=>flush(name),900)}
async function flush(name){
  if(saving[name]){dirty[name]=true;return}
  saving[name]=true;
  try{await cap.db.doc(docPath(name)).set(JSON.parse(JSON.stringify(S[name])))}catch(e){}
  saving[name]=false;
  if(dirty[name]){dirty[name]=false;flush(name)}
}

function dayIndex(){const start=new Date(S.profile.startDate+"T00:00:00");return Math.max(0,Math.floor((Date.now()-start)/864e5))}
function booksFor(dI){

  return{mu,review,muDay:dI%2,mt:MURPHY[mu-1],cu,cuDay,ct:CULLEN[cu-1],awl:dI>=90?Math.min(10,1+Math.floor((dI-90)/30)):null};
}
function todayBooks(){

function weekStars(w){
  const start=new Date(S.profile.startDate+"T00:00:00");let full=0,any=0;const need=todayMissions().length;
  for(let k=0;k<7;k++){const d=new Date(start);d.setDate(d.getDate()+w*7+k);const r=S.profile.days[dkey(d)];if(r){if(r.xp>0)any++;if(r.done.length>=need)full++}}
  return{stars:full>=5?3:full>=3?2:full>=1?1:0,full,any};
}
function viewMap(app){

  const box=h(`<section class="map"></section>`);
  const items=[];const add=x=>items.push(x);
  let n=0;
  for(let mi=0;mi<12;mi++){
    const m=M[mi],w0=Math.ceil(mi*30.4/7),w1=Math.ceil((mi+1)*30.4/7)-1;
    const state=curW>w1?"past":curW>=w0?"now":"future";

      const x=Math.round(Math.sin(n*0.9)*22);n++;
      const node=h(`<div class="map-row" style="--x:${x}%"><button class="node ${st}" type="button" aria-label="Неделя ${w+1}"><span class="ico">${st==="done"?I.check:st==="cur"?I.bolt:I.lockI}</span></button><div class="stars">${[0,1,2].map(k=>`<i class="${st!=="lock"&&k<ws.stars?"on":""}">★</i>`).join("")}</div></div>`);
      if(st==="cur"){const mw=h(`<div class="map-char"></div>`);mw.append(mascotEl(S.profile.char,"",false));node.append(mw)}
      node.querySelector(".node").onclick=()=>{
        if(st==="cur"){go("today");return}

      add(node);
    }
    const ch=h(`<div class="map-row" style="--x:0%"><button class="node chest ${state==="past"?"done":state}" type="button" aria-label="Финиш месяца"><span class="ico">${I.gift}</span></button><div class="chest-t"></div></div>`);
    ch.querySelector(".chest-t").textContent=m.milestone.ru;
    ch.querySelector(".node").onclick=()=>toast(state==="past"?"Сундук открыт! Финиш месяца пройден.":"Финиш месяца: "+m.milestone.ru);
    add(ch);
  }
  items.reverse().forEach(x=>box.append(x));
  app.append(h(`<section class="card"><div class="eyebrow">${isKid()?"Учебный год":"Путь к C1 и IELTS 7+"}</div><h2 style="margin-top:4px">Карта уровней</h2><p class="muted" style="margin:6px 0 0;font-weight:600">Путь идёт снизу вверх: внизу старт, наверху финиш. Каждый кружок — неделя. Звёзды — сколько дней ты сделал полную норму: 1 день — ★, 3 дня — ★★, 5 дней — ★★★. В конце раздела — сундук с финальным заданием месяца.</p></section>`));
  app.append(box);
  setTimeout(()=>box.querySelector(".node.cur")?.scrollIntoView({block:"center"}),80);

/* ---------- LEAGUES ---------- */
const LEAGUES=[["Бронза","#C98A4B"],["Серебро","#8F9BA8"],["Золото","#E9A623"],["Сапфир","#2F5FE8"],["Рубин","#E5484D"],["Аметист","#9257E0"],["Жемчуг","#38B2C4"],["Обсидиан","#3A3A4A"],["Алмаз","#18B4E8"]];
const BOTS=["Бот Пельмень","Бот Отличница","Бот Ракета","Бот Соня","Бот Профессор","Бот Турбо"];
function weekStart(d=new Date()){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-(x.getDay()+6)%7);return dkey(x)}
function weekXP(days,ws){const s=new Date(ws+"T00:00:00");let t=0;for(let k=0;k<7;k++){const d=new Date(s);d.setDate(d.getDate()+k);t+=(days&&days[dkey(d)]&&days[dkey(d)].xp)||0}return t}
function seeded(str){let h1=2166136261;for(let i=0;i<str.length;i++){h1^=str.charCodeAt(i);h1=Math.imul(h1,16777619)}return((h1>>>0)%10000)/10000}
function botXP(name,ws,tier,frac){const r=seeded(name+ws),r2=seeded(ws+name+"x");const target=(50+tier*22)*7*(0.25+r*1.25);const curve=Math.min(1,frac*(0.7+r2*0.6));return Math.round(target*curve)}
function weekFrac(ws){const s=new Date(ws+"T00:00:00");return Math.max(0,Math.min(1,(Date.now()-s)/(7*864e5)))}
function leagueBoard(ws,frac){
  const lg=S.profile.league||{tier:0},tier=lg.tier||0,rows=[];
  rows.push({name:profileName()+" (ты)",xp:weekXP(S.profile.days,ws),me:true,ch:S.profile.char});
  getProfiles().filter(p=>p.id!==PROFILE).forEach(p=>{const st=ls.get(p.id==="me"?"berkut.v1":"berkut.v1."+p.id);if(st&&st.profile)rows.push({name:(st.profile.ob&&st.profile.ob.name)||p.name,xp:weekXP(st.profile.days,ws),ch:st.profile.char||"zefir"})});
  BOTS.slice(0,7-rows.length+3).forEach(b=>rows.push({name:b,xp:botXP(b,ws,tier,frac),bot:true}));
  return rows.sort((a,b)=>b.xp-a.xp);
}
function checkLeagueWeek(){
  const ws=weekStart();const lg=S.profile.league||(S.profile.league={tier:0,week:ws});
  if(lg.week===ws)return null;
  const board=leagueBoard(lg.week,1);const rank=board.findIndex(r=>r.me)+1,n=board.length;let msg;
  if(rank<=3&&lg.tier<LEAGUES.length-1){lg.tier++;msg=`Неделя закрыта: ${rank} место. Повышение — лига «${LEAGUES[lg.tier][0]}»!`}
  else if(rank>=n-1&&lg.tier>0){lg.tier--;msg=`Неделя закрыта: ${rank} место. Понижение — лига «${LEAGUES[lg.tier][0]}». Отыграемся!`}

const mascots=new Set();let curMascot=null;
function mountMascot(svg,main){if(!svg)return null;const m={svg,state:"idle",talking:false,nextBlink:Date.now()+1500+Math.random()*2500,nextLook:0,pointerAt:0,seen:false,tm:0};mascots.add(m);if(main)curMascot=m;return m}
function mascotSet(m,state){if(!m)return;m.state=state;m.svg.dataset.state=state;clearTimeout(m.tm);
  if(!m.talking){const mo=m.svg.querySelector(".m-mouth");if(mo)mo.setAttribute("d",state==="angry"?MOUTH.flat:state==="listening"?MOUTH.wow:state==="happy"?MOUTH.o1:MOUTH.smile);const j=m.svg.querySelector(".m-jaw");if(j)j.style.transform=state==="happy"||state==="listening"?"translateY(6px)":""}
  if(state==="thinking")mascotLook(m,6,-7);if(state==="listening")mascotLook(m,0,0)}
function mascotFlash(m,state,ms=1300){if(!m)return;mascotSet(m,state);m.tm=setTimeout(()=>mascotSet(m,"idle"),ms)}
const MOOD_GLOW={calm:null,wow:"#FF9F1C",angry:"#FF3B30",happy:"#22C55E",laugh:"#FFB800",sad:"#7C5CFF"};
function mascotMood(m,mood){if(!m)return;mood=MOOD_GLOW.hasOwnProperty(mood)?mood:"calm";m.svg.dataset.mood=mood;const st=m.svg.closest(".stage,.hero-card");if(st&&st.classList.contains("stage"))st.style.setProperty("--glow",MOOD_GLOW[mood]||"var(--c)")}
function mascotLook(m,x,y){m.svg.querySelectorAll(".m-pupil").forEach(p=>p.style.transform=`translate(${x}px,${y}px)`)}
function mascotTalk(m,on){if(!m)return;m.talking=on;if(!on){const mo=m.svg.querySelector(".m-mouth");if(mo)mo.setAttribute("d",MOUTH.smile);const j=m.svg.querySelector(".m-jaw");if(j)j.style.transform=""}}
setInterval(()=>{const now=Date.now();for(const m of mascots){
  if(!m.svg.isConnected){if(m.seen){mascots.delete(m);if(curMascot===m)curMascot=null}continue}m.seen=true;
  if(m.talking){const r=Math.random();const mo=m.svg.querySelector(".m-mouth");if(mo)mo.setAttribute("d",r<.4?MOUTH.o1:r<.75?MOUTH.o2:MOUTH.smile);const j=m.svg.querySelector(".m-jaw");if(j)j.style.transform=`translateY(${Math.round(r*10)}px)`}
  if(now>m.nextBlink){m.svg.classList.add("blink");setTimeout(()=>m.svg.classList.remove("blink"),130);m.nextBlink=now+2200+Math.random()*3200}
  if(now>m.nextLook&&now-m.pointerAt>2500&&(m.state==="idle")){mascotLook(m,Math.round(Math.random()*12-6),Math.round(Math.random()*8-4));m.nextLook=now+1400+Math.random()*2600}
}},120);
document.addEventListener("pointermove",e=>{for(const m of mascots){if(!m.svg.isConnected||m.state!=="idle")continue;const r=m.svg.getBoundingClientRect();if(!r.width)continue;
  const dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2),d=Math.hypot(dx,dy)||1,k=Math.min(1,d/300);mascotLook(m,Math.round(dx/d*7*k),Math.round(dy/d*6*k));m.pointerAt=Date.now()}},{passive:true});

function ringTone(){
  try{const AC=window.AudioContext||window.webkitAudioContext;const ac=new AC();let t=ac.currentTime;
    for(let k=0;k<4;k++){for(const f of [523,659,784]){const o=ac.createOscillator(),g=ac.createGain();o.type="triangle";o.frequency.value=f;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.07,t+.03);g.gain.linearRampToValueAtTime(0,t+.22);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+.25);t+=.18}t+=1.4}
    return ()=>{try{ac.close()}catch(e){}}}catch(e){return ()=>{}}
}

function parseReply(text){

  if(m){body=text.replace(m[0],"").trim();
    fixes=m[1].split("\n").map(l=>l.trim()).filter(Boolean).map(l=>{const [pair,why]=l.split("::");const [wrong,right]=(pair||"").split("=>");return{wrong:(wrong||"").trim(),right:(right||"").trim(),why_ru:(why||"").trim()}}).filter(f=>f.wrong&&f.right)}

}

      if(sel.k===x.k){sel.el.classList.remove("sel");sel.el.classList.add("ok");b.classList.add("ok");sel.el.disabled=b.disabled=true;sel=null;left--;
        if(!left){const sec=Math.round((Date.now()-t0)/100)/10;const g=S.profile.games||(S.profile.games={});const rec=!g.matchBest||sec<g.matchBest;if(rec)g.matchBest=sec;persist("profile");
          gameEnd(body,`<b>${sec} c</b>, ошибок: ${miss}. ${rec?"Новый рекорд!":"Рекорд: "+g.matchBest+" c."}`,()=>gameMatch(body))}}
      else{miss++;const a=sel.el;a.classList.remove("sel");a.classList.add("bad");b.classList.add("bad");setTimeout(()=>{a.classList.remove("bad");b.classList.remove("bad")},450);sel=null}};
    grid.append(b)});
  body.append(grid);
}
function gameRadio(body){
  body.innerHTML="";const ROUNDS=5;let r=0,score=0;
  const mk=()=>{const L="ABCDEFGHIJKLMNOPQRSTUVWXYZ";let s="";for(let i=0;i<3;i++)s+=L[Math.floor(Math.random()*26)];const n=2+Math.floor(Math.random()*2);for(let i=0;i<n;i++)s+=Math.floor(Math.random()*10);return s};
  const say=cs=>[...cs].map(c=>/\d/.test(c)?ICAO_DIG[+c]:NATO[c]).join(", ");
  const intro=h(`<div class="view"><p style="margin:0">Диспетчер передаёт позывной по алфавиту NATO (цифры как в эфире: <span class="mono">Tree, Fife, Niner</span>). Запиши его буквами и цифрами, например <span class="mono">KAT35</span>.</p><details class="note"><summary style="cursor:pointer;font-weight:600">Шпаргалка: алфавит NATO</summary><p class="mono" style="font-size:13px;margin:8px 0 0"></p></details><div><button class="btn primary" type="button">Начать (${ROUNDS} раундов)</button></div></div>`);
  intro.querySelector("details p").textContent=Object.entries(NATO).map(([k,v])=>k+" "+v).join(" · ")+" · 3 Tree · 5 Fife · 9 Niner";
  intro.querySelector("button").onclick=()=>round();body.append(intro);
  function round(){
    body.innerHTML="";const cs=mk(),spoken=say(cs);
    body.append(h(`<div class="eyebrow">Раунд ${r+1} из ${ROUNDS} · счёт ${score}</div>`));
    const ctr=h(`<div class="row" style="margin:12px 0"><button class="btn primary" type="button">${I.speaker} Слушать эфир</button></div>`);
    const rate=monthIndex()<4?0.85:monthIndex()<8?1:1.15;
    ctr.querySelector("button").onclick=()=>speak(spoken,rate);
    const f=h(`<form class="row"><input class="field" id="radioIn" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Позывной" style="flex:1;min-width:0;text-transform:uppercase;font-family:var(--f-mono)"><button class="btn primary" type="submit">Проверить</button></form>`);
    f.onsubmit=e=>{e.preventDefault();const v=f.querySelector("input").value.toUpperCase().replace(/[^A-Z0-9]/g,"");if(!v)return;f.querySelectorAll("input,button").forEach(x=>x.disabled=true);
      const ok=v===cs;if(ok)score++;
      const n=h(`<div class="note ${ok?"ok":"bad"}" style="margin-top:12px"><b></b><div class="mono" style="font-size:13px"></div></div>`);n.querySelector("b").textContent=ok?"Roger! Верно.":"Неверно. Было: "+cs;n.querySelector(".mono").textContent=spoken;body.append(n);
      const nx=h(`<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn primary" type="button">${r<ROUNDS-1?"Следующий":"Итог"}</button></div>`);
      nx.querySelector("button").onclick=()=>{r++;if(r<ROUNDS)round();else{body.innerHTML="";const g=S.profile.games||(S.profile.games={});if(g.radioBest==null||score>g.radioBest)g.radioBest=score;persist("profile");gameEnd(body,`<b>${score}/${ROUNDS}</b> позывных принято. ${score===ROUNDS?"Чистый эфир, капитан!":"Тренируй алфавит — в кабине это обязательно."}`,()=>{r=0;score=0;gameRadio(body)})}};
      body.append(nx);nx.querySelector("button").focus()};
    body.append(ctr,f);speak(spoken,rate);f.querySelector("input").focus();
  }
}
async function gameBuild(body){
  let data=null;
  if(cap.sample){
    const m=curMonth();
    const prompt=`${teacherContext()}

Игра «Собери фразу»: дай 6 английских предложений (5–11 слов) уровня ${m.cefr} на грамматику месяца (${m.grammar.ru}), из жизни пилота, дизайнера, SMM и переговоров. Без кавычек внутри, без тире. И перевод каждого на русский.
Ответь только JSON: {"sentences":[{"en":"","ru":""}]}`;
    data=await loadLesson(body,"game.build",prompt,"Учитель готовит фразы…",d=>Array.isArray(d?.sentences)&&d.sentences.length>=3&&d.sentences.every(x=>x.en&&x.ru),()=>openGame("build"));
    if(!data)return;
  }
  const list=(data?data.sentences:FALLBACK_SENT).slice(0,6);let i=0,score=0;
  const draw=()=>{
    body.innerHTML="";const s=list[i];const words=String(s.en).trim().split(/\s+/);
    let pool=shuffle(words.map((w,k)=>({w,k})));if(words.length>1&&pool.every((x,k)=>x.k===k))pool=pool.reverse();
    const ans=[];
    body.append(h(`<div class="eyebrow">Фраза ${i+1} из ${list.length} · счёт ${score}</div>`));
    const q=h(`<p class="q" style="margin-top:12px"></p>`);q.textContent=s.ru;body.append(q);
    const A=h(`<div class="chips answer" aria-label="Твой ответ"></div>`),P=h(`<div class="chips" aria-label="Слова" style="margin-top:10px"></div>`);
    body.append(A,P);
    const redraw=()=>{A.innerHTML="";P.innerHTML="";
      ans.forEach((x,k)=>{const b=h(`<button class="wchip" type="button"></button>`);b.textContent=x.w;b.onclick=()=>{ans.splice(k,1);pool.push(x);redraw()};A.append(b)});
      pool.forEach((x,k)=>{const b=h(`<button class="wchip" type="button"></button>`);b.textContent=x.w;b.onclick=()=>{pool.splice(k,1);ans.push(x);redraw();if(!pool.length)check()};P.append(b)})};
    const check=()=>{const ok=norm(ans.map(x=>x.w).join(" "))===norm(s.en);if(ok)score++;
      A.querySelectorAll("button").forEach(b=>b.disabled=true);
      const n=h(`<div class="note ${ok?"ok":"bad"}" style="margin-top:12px"><b></b></div>`);n.querySelector("b").textContent=ok?"Верно!":"Правильно: "+s.en;body.append(n);speak(s.en);
      const nx=h(`<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn primary" type="button">${i<list.length-1?"Дальше":"Итог"}</button></div>`);
      nx.querySelector("button").onclick=()=>{i++;if(i<list.length)draw();else{body.innerHTML="";gameEnd(body,`<b>${score}/${list.length}</b> фраз собрано верно.`,()=>{ls.del(cacheKey("game.build"));openGame("build")})}};body.append(nx)};
    redraw();
  };
  draw();
}
async function gameSpot(body){
  const m=curMonth();
  const prompt=`${teacherContext()}

Игра «Найди ошибку»: 8 английских предложений уровня ${m.cefr} из жизни пилота, дизайнера, SMM и переговоров. Примерно в половине — одна типичная ошибка русскоговорящих (времена, артикли, предлоги, порядок слов, грамматика месяца: ${m.grammar.ru}). Остальные полностью правильные.
Ответь только JSON: {"items":[{"s":"предложение","ok":false,"fix":"исправленное предложение (для правильных — то же)","why_ru":"короткое пояснение"}]}`;
  const data=await loadLesson(body,"game.spot",prompt,"Учитель прячет ошибки…",d=>Array.isArray(d?.items)&&d.items.length>=4,()=>openGame("spot"));
  if(!data)return;
  const items=data.items.slice(0,8);let i=0,score=0;const missed=[];
  const draw=()=>{
    body.innerHTML="";const it=items[i];
    body.append(h(`<div class="eyebrow">Предложение ${i+1} из ${items.length} · счёт ${score}</div>`));
    const q=h(`<p class="q" style="margin-top:12px;font-size:19px"></p>`);q.textContent=it.s;body.append(q);
    const bt=h(`<div class="tilegrid"><button class="tbtn" type="button" data-v="1">Всё верно</button><button class="tbtn" type="button" data-v="0">Есть ошибка</button></div>`);
    bt.querySelectorAll("button").forEach(b=>b.onclick=()=>{
      const said=b.dataset.v==="1",ok=said===!!it.ok;if(ok)score++;else if(!it.ok)missed.push({wrong:it.s,right:it.fix,why_ru:it.why_ru});
      bt.querySelectorAll("button").forEach(x=>x.disabled=true);b.classList.add(ok?"ok":"bad");
      const n=h(`<div class="note ${ok?"ok":"bad"}" style="margin-top:12px"><b></b><div></div><div class="muted" style="font-size:13px"></div></div>`);
      n.querySelector("b").textContent=(ok?"Да! ":"Мимо. ")+(it.ok?"Предложение правильное.":"Ошибка есть.");
      if(!it.ok){n.querySelector("div").textContent="Правильно: "+it.fix;n.querySelector(".muted").textContent=it.why_ru||""}
      body.append(n);
      const nx=h(`<div class="row" style="justify-content:flex-end;margin-top:12px"><button class="btn primary" type="button">${i<items.length-1?"Дальше":"Итог"}</button></div>`);
      nx.querySelector("button").onclick=()=>{i++;if(i<items.length)draw();else{body.innerHTML="";if(missed.length)addMistakes(missed);gameEnd(body,`<b>${score}/${items.length}</b>. ${score>=items.length-1?"Глаз-алмаз.":"Пропущенные ошибки добавлены в тетрадь."}`,()=>{ls.del(cacheKey("game.spot"));openGame("spot")})}};
      body.append(nx);nx.querySelector("button").focus()});
    body.append(bt);
  };
  draw();
}
