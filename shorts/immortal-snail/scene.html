<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// =====================================================================
//  "Immortal & Rich... but a Snail"  — original 2D cartoon renderer
//  render(t) draws the frame at time t (seconds) using window.TL.
// =====================================================================
const W = 1080, H = 1920;
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const OL = '#1E1B2E';                    // outline colour
const FONT = '"Inter", "DejaVu Sans", sans-serif';
let TL = null;
window.setTimeline = tl => { TL = tl; };

// ---------- math helpers
const PI = Math.PI, TAU = PI * 2;
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const seg = (t, a, b) => clamp((t - a) / (b - a));
const eio = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
const eout = t => 1 - Math.pow(1 - t, 3);
const ein = t => t * t * t;
const eback = t => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
function rand(seed) { let s = seed % 2147483647; if (s <= 0) s += 2147483646; return () => (s = s * 16807 % 2147483647) / 2147483647; }

// ---------- drawing primitives
function shape(build, fill, stroke = OL, lw = 8) {
  ctx.beginPath(); build();
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke && lw > 0) { ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke(); }
}
const circle = (x, y, r, fill, stroke = OL, lw = 8) => shape(() => ctx.arc(x, y, r, 0, TAU), fill, stroke, lw);
const ellipse = (x, y, rx, ry, fill, stroke = OL, lw = 8, rot = 0) => shape(() => ctx.ellipse(x, y, rx, ry, rot, 0, TAU), fill, stroke, lw);
const rrect = (x, y, w, h, r, fill, stroke = OL, lw = 8) => shape(() => ctx.roundRect(x, y, w, h, r), fill, stroke, lw);
function line(pts, color = OL, lw = 8) { ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]); for (const p of pts.slice(1)) ctx.lineTo(p[0], p[1]); ctx.strokeStyle = color; ctx.lineWidth = lw; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.stroke(); }
// outlined thick stroke (limb)
function limb(pts, color, w) { line(pts, OL, w + 14); line(pts, color, w); }
// merged circles with one outline (clouds, smoke, bushes)
function blob(cs, fill, lw = 8) {
  ctx.fillStyle = OL; for (const [x, y, r] of cs) { ctx.beginPath(); ctx.arc(x, y, r + lw / 2, 0, TAU); ctx.fill(); }
  ctx.fillStyle = fill; for (const [x, y, r] of cs) { ctx.beginPath(); ctx.arc(x, y, r - lw / 2, 0, TAU); ctx.fill(); }
}
function text(str, x, y, size, fill = '#fff', o = {}) {
  ctx.save();
  ctx.font = `${o.weight || 900} ${size}px ${FONT}`;
  ctx.textAlign = o.align || 'center'; ctx.textBaseline = 'middle';
  if (o.stroke !== false) { ctx.lineWidth = o.lw || size * 0.2; ctx.strokeStyle = o.stroke || OL; ctx.lineJoin = 'round'; ctx.strokeText(str, x, y); }
  ctx.fillStyle = fill; ctx.fillText(str, x, y);
  ctx.restore();
}
function withT(x, y, s, rot, fn) { ctx.save(); ctx.translate(x, y); if (rot) ctx.rotate(rot); if (s !== 1) ctx.scale(s, s); fn(); ctx.restore(); }

// =====================================================================
//  CHARACTERS
// =====================================================================
const SKIN = '#FFD3AE', HOODIE = '#FF8A3D', HOODIE_D = '#E06A22', PANTS = '#34407A', HAIR = '#3B2418';

// face drawn around head centre (0,0), head radius 88
function face(f, look = 0, lookY = 0, t = 0) {
  const ex = 32, ey = -6;
  const blink = f.blink ? 1 : 0;
  // eyes
  for (const sx of [-1, 1]) {
    const x = sx * ex;
    if (f.mood === 'sleep' || blink) {
      line([[x - 16, ey + 2], [x, ey + 10], [x + 16, ey + 2]], OL, 7);
      continue;
    }
    const big = f.mood === 'shock' || f.mood === 'scared';
    ellipse(x, ey, big ? 24 : 21, big ? 30 : 26, '#fff', OL, 6);
    const pr = f.mood === 'scared' ? 7 : 11;
    circle(x + look * 9, ey + 3 + lookY * 8, pr, OL, null);
    circle(x + look * 9 + 4, ey - 1 + lookY * 8, 3.5, '#fff', null);
    if (f.mood === 'smug') { // heavy lids
      shape(() => { ctx.ellipse(x, ey, 23, 28, 0, PI, TAU); }, SKIN, null);
      line([[x - 22, ey], [x + 22, ey]], OL, 6);
    }
  }
  // brows
  const by = ey - 42;
  if (f.mood === 'shock' || f.mood === 'scared') { line([[-50, by - 6], [-18, by - 14]], OL, 7); line([[18, by - 14], [50, by - 6]], OL, 7); }
  else if (f.mood === 'smug') { line([[-48, by + 2], [-18, by - 2]], OL, 7); line([[18, by - 10], [48, by - 2]], OL, 7); }
  else if (f.mood !== 'sleep') { line([[-46, by], [-20, by - 6]], OL, 6); line([[20, by - 6], [46, by]], OL, 6); }
  // cheeks
  ellipse(-56, 26, 14, 9, 'rgba(255,120,120,.45)', null);
  ellipse(56, 26, 14, 9, 'rgba(255,120,120,.45)', null);
  // mouth
  const my = 42;
  switch (f.mood) {
    case 'grin':
      shape(() => { ctx.moveTo(-34, my - 8); ctx.quadraticCurveTo(0, my - 4, 34, my - 8); ctx.quadraticCurveTo(28, my + 38, 0, my + 38); ctx.quadraticCurveTo(-28, my + 38, -34, my - 8); }, '#7A1F2B', OL, 6);
      shape(() => { ctx.ellipse(0, my + 26, 16, 9, 0, 0, TAU); }, '#FF6B7A', null);
      break;
    case 'shock': ellipse(0, my + 10, 16, 22, '#7A1F2B', OL, 6); break;
    case 'scared': line([[-26, my + 8], [-13, my], [0, my + 8], [13, my], [26, my + 8]], OL, 6);
      shape(() => { ctx.moveTo(78, -40); ctx.quadraticCurveTo(92, -14, 78, -8); ctx.quadraticCurveTo(64, -14, 78, -40); }, '#8FD3FF', OL, 4);
      break;
    case 'smug': shape(() => { ctx.moveTo(-18, my + 6); ctx.quadraticCurveTo(10, my + 20, 30, my - 2); }, null, OL, 7); break;
    case 'sleep': ellipse(0, my + 6, 8, 6, '#7A1F2B', OL, 5); break;
    default: shape(() => { ctx.arc(0, my - 14, 28, 0.15 * PI, 0.85 * PI); }, null, OL, 7);
  }
}

function hairTop() {
  shape(() => {
    ctx.moveTo(-86, -6);
    ctx.quadraticCurveTo(-96, -70, -50, -88);
    ctx.lineTo(-40, -112); ctx.lineTo(-18, -92); ctx.lineTo(4, -122); ctx.lineTo(22, -94); ctx.lineTo(52, -112); ctx.lineTo(50, -82);
    ctx.quadraticCurveTo(94, -64, 86, -6);
    ctx.quadraticCurveTo(60, -50, 10, -52);
    ctx.quadraticCurveTo(-50, -54, -86, -6);
  }, HAIR, OL, 7);
}

function guyHead(x, y, s, f = {}, o = {}) {
  withT(x, y, s, o.rot || 0, () => {
    ctx.save(); if (o.flip) ctx.scale(-1, 1);
    circle(-86, 6, 16, SKIN, OL, 6); circle(86, 6, 16, SKIN, OL, 6);
    circle(0, 0, 88, SKIN, OL, 8);
    hairTop();
    face(f, o.look || 0, o.lookY || 0);
    if (o.shades) shades(0, -6, 1);
    ctx.restore();
    if (o.helmet) helmet(0, 0, 128);
  });
}
function shades(x, y, s) {
  withT(x, y, s, 0, () => {
    rrect(-62, -18, 52, 34, 12, '#15131F', OL, 5); rrect(10, -18, 52, 34, 12, '#15131F', OL, 5);
    line([[-10, -6], [10, -6]], OL, 6);
    line([[-50, -8], [-36, -8]], 'rgba(255,255,255,.6)', 4); line([[22, -8], [36, -8]], 'rgba(255,255,255,.6)', 4);
  });
}
function helmet(x, y, r) {
  circle(x, y, r, 'rgba(170,220,255,.22)', OL, 7);
  shape(() => ctx.arc(x, y, r - 18, 1.15 * PI, 1.45 * PI), null, 'rgba(255,255,255,.85)', 9);
  rrect(x - r * 0.75, y + r * 0.78, r * 1.5, 26, 12, '#D8DEE9', OL, 6);
}

// Full body. Origin = between the feet on the ground. ~400px tall at s=1.
// o: walk (phase), armL/armR (rad from hanging), mood, look, flip, sit, bob, shades, helmet, hold ('drink')
function guy(x, y, s, o = {}) {
  const f = { mood: o.mood || 'happy', blink: o.blink };
  withT(x, y + (o.bob || 0), s, 0, () => {
    if (o.flip) ctx.scale(-1, 1);
    const sw = o.walk !== undefined ? Math.sin(o.walk) * 26 : 0;
    const lift = o.walk !== undefined ? Math.abs(Math.cos(o.walk)) * 6 : 0;
    ctx.translate(0, -lift);
    // legs
    if (o.sit) {
      limb([[-22, -95], [52, -95], [52, -8]], PANTS, 30);
      limb([[22, -95], [92, -95], [92, -8]], PANTS, 30);
      ellipse(64, -6, 30, 14, '#F2F2F2', OL, 6); ellipse(104, -6, 30, 14, '#F2F2F2', OL, 6);
    } else {
      limb([[-24, -100], [-24 + sw, -10]], PANTS, 30);
      limb([[24, -100], [24 - sw, -10]], PANTS, 30);
      ellipse(-30 + sw, -8, 32, 15, '#F2F2F2', OL, 6); ellipse(30 - sw, -8, 32, 15, '#F2F2F2', OL, 6);
      line([[-44 + sw, -10], [-16 + sw, -10]], '#E84855', 5); line([[16 - sw, -10], [44 - sw, -10]], '#E84855', 5);
    }
    // arms behind? draw body first then arms
    // body (hoodie)
    shape(() => { ctx.moveTo(-70, -100); ctx.quadraticCurveTo(-82, -190, -52, -226); ctx.quadraticCurveTo(0, -246, 52, -226); ctx.quadraticCurveTo(82, -190, 70, -100); ctx.quadraticCurveTo(0, -86, -70, -100); }, HOODIE, OL, 8);
    rrect(-40, -158, 80, 40, 14, HOODIE_D, OL, 5);
    line([[-14, -224], [-18, -186]], '#fff', 5); line([[14, -224], [18, -186]], '#fff', 5);
    // arms
    const L = 108;
    const arm = (side, a) => {
      const sx = side * 58, sy = -206;
      const hx = sx + side * Math.sin(a) * L, hy = sy + Math.cos(a) * L;
      limb([[sx, sy], [hx, hy]], HOODIE, 26);
      circle(hx, hy, 17, SKIN, OL, 6);
      return [hx, hy];
    };
    const hl = arm(-1, o.armL ?? 0.18), hr = arm(1, o.armR ?? 0.18);
    if (o.hold === 'drink') drink(hr[0], hr[1] - 10);
    if (o.hold === 'paper') { rrect(hr[0] - 60, hr[1] - 80, 90, 110, 6, '#F4F1E8', OL, 5); }
    // head
    ctx.save(); ctx.translate(0, -320);
    if (o.headRot) ctx.rotate(o.headRot);
    circle(-86, 6, 16, SKIN, OL, 6); circle(86, 6, 16, SKIN, OL, 6);
    circle(0, 0, 88, SKIN, OL, 8);
    hairTop();
    face(f, o.look || 0, o.lookY || 0);
    if (o.shades) shades(0, -6, 1);
    if (o.helmet) helmet(0, 0, 128);
    ctx.restore();
  });
}
function drink(x, y) {
  shape(() => { ctx.moveTo(x - 22, y - 46); ctx.lineTo(x + 22, y - 46); ctx.lineTo(x + 14, y + 10); ctx.lineTo(x - 14, y + 10); ctx.closePath(); }, '#FF6FA8', OL, 5);
  line([[x + 6, y - 46], [x + 20, y - 80]], '#38C6A8', 6);
  circle(x - 18, y - 48, 10, '#F7D046', OL, 4);
}

// Snail. Origin = ground below the shell, facing right. ~300px wide at s=1.
// o: flip, look (-1..1), lookY, brow ('mean'|'calm'|'determined'), helmet, shades, mouth('smirk'|'grin'), wob (time)
const SN_BODY = '#9FDB6B', SN_BODY_D = '#7CBF4A', SN_SHELL = '#B678E0', SN_SHELL_D = '#8A4FBE';
function snail(x, y, s, o = {}) {
  withT(x, y, s, 0, () => {
    if (o.flip) ctx.scale(-1, 1);
    const w = o.wob || 0;
    // foot
    shape(() => { ctx.moveTo(-150, -4); ctx.quadraticCurveTo(-160, -42, -110, -44); ctx.lineTo(80, -44); ctx.lineTo(80, -4); ctx.closePath(); }, SN_BODY, OL, 8);
    // neck/head
    shape(() => { ctx.moveTo(60, -4); ctx.lineTo(60, -110); ctx.quadraticCurveTo(62, -150, 100, -150); ctx.quadraticCurveTo(140, -150, 142, -110); ctx.quadraticCurveTo(146, -30, 150, -4); ctx.closePath(); }, SN_BODY, OL, 8);
    line([[-140, -4], [148, -4]], OL, 8);
    // stalks
    const e1 = [74 + Math.sin(w * 3) * 4, -226], e2 = [138 + Math.sin(w * 3 + 1) * 4, -220];
    limb([[86, -140], e1], SN_BODY, 12); limb([[122, -140], e2], SN_BODY, 12);
    for (const [ex, ey] of [e1, e2]) {
      circle(ex, ey, 22, '#fff', OL, 6);
      if (o.shades) continue;
      const lx = (o.look ?? 1) * 7, ly = (o.lookY || 0) * 7;
      circle(ex + lx, ey + ly, o.glow ? 10 : 10, o.glow ? '#FFE14D' : OL, null);
      circle(ex + lx + 3, ey + ly - 3, 3.5, '#fff', null);
    }
    if (o.shades) { rrect(e1[0] - 26, e1[1] - 14, 52, 30, 10, '#15131F', OL, 5); rrect(e2[0] - 26, e2[1] - 14, 52, 30, 10, '#15131F', OL, 5); line([[e1[0] + 24, e1[1]], [e2[0] - 24, e2[1]]], OL, 5); }
    // brows
    const brow = o.brow || 'mean';
    if (brow === 'mean' || brow === 'determined') {
      const d = brow === 'mean' ? 14 : 8;
      line([[e1[0] - 22, e1[1] - 36], [e1[0] + 18, e1[1] - 36 + d]], OL, 8);
      line([[e2[0] - 18, e2[1] - 36 + d], [e2[0] + 22, e2[1] - 36]], OL, 8);
    } else if (brow === 'calm') {
      line([[e1[0] - 18, e1[1] - 38], [e1[0] + 18, e1[1] - 40]], OL, 6);
      line([[e2[0] - 18, e2[1] - 40], [e2[0] + 18, e2[1] - 38]], OL, 6);
    }
    // mouth
    if (o.mouth === 'grin') shape(() => { ctx.moveTo(104, -96); ctx.quadraticCurveTo(122, -70, 140, -98); }, '#4E7A2E', OL, 6);
    else shape(() => { ctx.moveTo(108, -92); ctx.quadraticCurveTo(124, -82, 138, -100); }, null, OL, 6);
    ellipse(132, -112, 9, 5, 'rgba(255,120,120,.5)', null);
    // shell
    circle(-30, -128, 104, SN_SHELL, OL, 8);
    ctx.beginPath();
    for (let a = 0; a < 3.2 * TAU; a += 0.08) { const r = 6 + a * 4.6; const px = -30 + Math.cos(a + 2) * r, py = -128 + Math.sin(a + 2) * r; a === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py); }
    ctx.strokeStyle = SN_SHELL_D; ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.stroke();
    shape(() => ctx.arc(-30, -128, 80, 1.1 * PI, 1.4 * PI), null, 'rgba(255,255,255,.55)', 9);
    if (o.helmet) helmet(104, -180, 92);
  });
}
function slime(x1, x2, y, a = 0.55) {
  ctx.save(); ctx.globalAlpha = a;
  line([[x1, y], [x2, y]], '#C9F29B', 16);
  line([[x1, y - 3], [x2, y - 3]], 'rgba(255,255,255,.8)', 4);
  ctx.restore();
}

// ---------- props
function bill(x, y, rot, s = 1) {
  withT(x, y, s, rot, () => { rrect(-60, -28, 120, 56, 6, '#8FD483', OL, 5); circle(0, 0, 16, '#5DA552', OL, 4); text('$', 0, 1, 22, '#E9FFE3', { stroke: false }); });
}
function moneyPile(cx, ground, rows, bw = 130, bh = 52) {
  for (let r = 0; r < rows; r++) {
    const n = rows - r, y = ground - (r + 1) * bh;
    for (let i = 0; i < n; i++) {
      const x = cx - n * bw / 2 + i * bw;
      rrect(x, y, bw, bh, 6, '#8FD483', OL, 6);
      ctx.fillStyle = '#5DA552'; ctx.fillRect(x + bw / 2 - 12, y + 4, 24, bh - 8);
      line([[x + 10, y + 12], [x + 34, y + 12]], 'rgba(255,255,255,.55)', 4);
    }
  }
  return ground - rows * bh;
}
function cloud(x, y, s) { withT(x, y, s, 0, () => blob([[-70, 10, 46], [-20, -18, 60], [40, -6, 52], [86, 14, 38], [0, 22, 46]], '#FFFFFF', 7)); }
function bang(x, y, s, col = '#FF4D5E') { withT(x, y, s, 0, () => { rrect(-14, -70, 28, 80, 12, col, OL, 6); circle(0, 34, 15, col, OL, 6); }); }
function label(str, x, y, size, bg = '#fff', fg = OL) {
  ctx.save(); ctx.font = `900 ${size}px ${FONT}`; const w = ctx.measureText(str).width + size * 1.1;
  rrect(x - w / 2, y - size * 0.85, w, size * 1.7, size * 0.6, bg, OL, 6);
  ctx.fillStyle = fg; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(str, x, y + 2); ctx.restore();
}
function stars(seed, n, alphaT = 0) { const r = rand(seed); for (let i = 0; i < n; i++) { const x = r() * W, y = r() * H * 0.8, s = r() * 3 + 1.5; ctx.globalAlpha = 0.5 + 0.5 * Math.sin(alphaT * 2 + i); circle(x, y, s, '#fff', null); } ctx.globalAlpha = 1; }

// =====================================================================
//  BACKGROUNDS
// =====================================================================
function skyGrad(c1, c2) { const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, c1); g.addColorStop(1, c2); ctx.fillStyle = g; ctx.fillRect(-200, -200, W + 400, H + 400); }
const GROUND = 1420;
function bgPark(t, o = {}) {
  skyGrad('#7FD1FF', '#DFF5FF');
  circle(860, 330, 90, '#FFE066', '#F2B705', 8);
  cloud(((t * 30 + 200) % 1500) - 200, 300, 1.1); cloud(((t * 18 + 900) % 1500) - 200, 520, 0.8);
  // far hills
  shape(() => { ctx.moveTo(-200, GROUND - 120); ctx.quadraticCurveTo(200, GROUND - 330, 560, GROUND - 160); ctx.quadraticCurveTo(860, GROUND - 330, 1300, GROUND - 140); ctx.lineTo(1300, H + 200); ctx.lineTo(-200, H + 200); }, '#8ED66B', OL, 8);
  blob([[120, GROUND - 40, 70], [200, GROUND - 60, 60], [960, GROUND - 50, 80], [1050, GROUND - 30, 60]], '#5FB64A', 7);
  shape(() => { ctx.rect(-200, GROUND, W + 400, H); }, '#6CC24A', null);
  line([[-200, GROUND], [W + 200, GROUND]], OL, 8);
  const r = rand(3); ctx.fillStyle = '#4FA33A';
  for (let i = 0; i < 40; i++) { const x = r() * W, y = GROUND + 40 + r() * 420; ctx.fillRect(x, y, 6, 18); ctx.fillRect(x + 10, y + 4, 6, 14); }
}
function bgMars(t) {
  skyGrad('#2A1A3D', '#F49A62');
  stars(11, 60, t);
  circle(220, 360, 70, '#4BA3E3', OL, 7); blob([[205, 340, 26], [240, 380, 20]], '#6CC24A', 0);
  circle(900, 560, 30, '#F6E7C1', OL, 6);
  shape(() => { ctx.moveTo(-200, GROUND - 80); ctx.quadraticCurveTo(300, GROUND - 260, 640, GROUND - 120); ctx.quadraticCurveTo(900, GROUND - 220, 1300, GROUND - 90); ctx.lineTo(1300, H + 200); ctx.lineTo(-200, H + 200); }, '#B8492A', OL, 8);
  shape(() => ctx.rect(-200, GROUND, W + 400, H), '#D2643A', null);
  line([[-200, GROUND], [W + 200, GROUND]], OL, 8);
  for (const [x, y, r] of [[160, 1560, 60], [760, 1700, 80], [980, 1520, 40], [420, 1800, 50]]) { ellipse(x, y, r, r * 0.35, '#B4502C', OL, 6); }
  for (const [x, y, s] of [[70, GROUND, 1], [1010, GROUND, 0.7]]) withT(x, y, s, 0, () => blob([[-30, -20, 34], [16, -26, 28]], '#8E3A22', 6));
}

// =====================================================================
//  CAPTIONS
// =====================================================================
function captions(t) {
  if (!TL) return;
  const w = TL.words.find(w => t >= w.s - 0.02 && t < w.until);
  if (!w) return;
  const sc = TL.scenes[w.scene];
  if (sc.id === 'end') return;
  const p = seg(t, w.s - 0.02, w.s + 0.12);
  const s = lerp(0.6, 1, eback(p));
  const str = w.w.replace(/[.,!?…]+$/g, '').toUpperCase();
  withT(W / 2, 640, s, 0, () => {
    ctx.font = `900 112px ${FONT}`;
    const fs = Math.min(112, 112 * 900 / Math.max(1, ctx.measureText(str).width));
    text(str, 0, 6, fs, 'rgba(0,0,0,.35)', { stroke: false });
    text(str, 0, 0, fs, w.hl ? '#FFD43B' : '#FFFFFF', { lw: fs * 0.24 });
  });
}

// =====================================================================
//  SCENES — each gets (t local seconds, d scene duration, sc scene obj)
// =====================================================================
const wordAt = (sc, word, nth = 0) => { const h = sc.words.filter(w => w.w === word); return h.length ? h[Math.min(nth, h.length - 1)].s : 0; };

const SCENES = {
  rich(t, d, sc) {
    bgPark(t);
    const top = moneyPile(540, GROUND, 5);
    const wave = Math.sin(t * 9);
    guy(540, top, 1.05, { mood: 'grin', armL: 2.55 + wave * 0.25, armR: 2.55 - wave * 0.25, bob: -Math.abs(Math.sin(t * 9)) * 10 });
    const r = rand(5);
    for (let i = 0; i < 16; i++) {
      const x0 = r() * W, sp = 260 + r() * 200, ph = r() * 3;
      const y = ((t + ph) * sp) % (H + 200) - 120;
      bill(x0 + Math.sin(t * 2 + i) * 40, y, Math.sin(t * 3 + i) * 0.8, 0.9);
    }
    const tn = wordAt(sc, 'never');

  end(t, d, sc) {
    const g = ctx.createRadialGradient(W / 2, 900, 100, W / 2, 900, 1300);
    g.addColorStop(0, '#FFD6A5'); g.addColorStop(1, '#FF7A59');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.save(); ctx.globalAlpha = 0.12; ctx.translate(W / 2, 900); ctx.rotate(t * 0.2);
    for (let i = 0; i < 12; i++) { ctx.rotate(TAU / 12); shape(() => { ctx.moveTo(0, 0); ctx.lineTo(-90, -1600); ctx.lineTo(90, -1600); ctx.closePath(); }, '#fff', null); }
    ctx.restore();
    const p1 = eback(seg(t, 0, 0.35)), p2 = eback(seg(t, 0.15, 0.5));
    withT(W / 2, 470, p1, -0.04, () => { text('WHAT WOULD', 0, -70, 118, '#fff', { lw: 26 }); text('YOU DO?', 0, 60, 140, '#FFD43B', { lw: 30 }); });
    shape(() => { ctx.rect(-10, GROUND, W + 20, H); }, '#E85D3A', null); line([[-10, GROUND], [W + 10, GROUND]], OL, 8);
    guy(300, GROUND, 0.85 * p2, { mood: 'scared', look: 1, armL: 0.3, armR: 0.3 });
    snail(800, GROUND, 0.8 * p2, { flip: true, look: 1, brow: 'mean', wob: t, mouth: 'grin' });
    text('VS', 545, GROUND - 230, 90 * p2, '#FF2E4D', { lw: 20 });
    const tc = wordAt(sc, 'tell') - 0.1;
    if (t > tc) {
      const p = eback(seg(t, tc, tc + 0.3));
      withT(W / 2, 1600, p, 0, () => {
        label('TELL ME IN THE COMMENTS', 0, 0, 52, '#fff');
        const b = Math.sin(t * 8) * 12;
        shape(() => { ctx.moveTo(-34, 70 + b); ctx.lineTo(34, 70 + b); ctx.lineTo(34, 120 + b); ctx.lineTo(64, 120 + b); ctx.lineTo(0, 190 + b); ctx.lineTo(-64, 120 + b); ctx.lineTo(-34, 120 + b); ctx.closePath(); }, '#FFD43B', OL, 8);
      });
    }
  },
};

// =====================================================================
//  MAIN
// =====================================================================
window.render = function (t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.clearRect(0, 0, W, H);
  if (!TL) return;
  let i = TL.scenes.findIndex(s => t >= s.start && t < s.start + s.dur);
  if (i < 0) i = TL.scenes.length - 1;
  const sc = TL.scenes[i], lt = t - sc.start;
  // gentle push-in per scene + punch-in on cut
  const z = 1 + 0.035 * seg(lt, 0, sc.dur) + 0.06 * (1 - eout(seg(lt, 0, 0.25)));
  ctx.save();
  ctx.translate(W / 2, H / 2); ctx.scale(z, z); ctx.translate(-W / 2, -H / 2);
  SCENES[sc.id](lt, sc.dur, sc);
  ctx.restore();
  // white flash on cuts (except first)
  if (i > 0 && lt < 0.08) { ctx.fillStyle = `rgba(255,255,255,${0.5 * (1 - lt / 0.08)})`; ctx.fillRect(0, 0, W, H); }
  captions(t);
};
</script>
