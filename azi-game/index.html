<title>Ази Клуб</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Ази — казахская карточная игра на фишки: локации и комнаты, торговля в тёмную, Ази-переигровка, супер турнир, слоты и магазин.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700;800&family=Manrope:wght@500;600;700;800&display=swap">
<style>
/* Layout: one-screen mobile app. Home scrolls under a fixed header with a floating "Играть сейчас"; table fills the frame with a dock for the hand. */
:root{
  --bg:#07090F;
  --surface:#12151D;
  --surface-2:#1B1F2A;
  --surface-3:#262B38;
  --line:#2A3040;
  --fg:#F1F3F8;
  --muted:#8A92A6;
  --gold:#F2B934;
  --gold-2:#C98A12;
  --gold-ink:#2A1A00;
  --play:#E8A317;
  --red:#E5484D;
  --green:#4CAF50;
  --blue:#2F6FD6;
  --brown:#9A4A26;
  --felt:#2E6B33;
  --felt-2:#245428;
  --rim:#2A1E18;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.ic{width:18px;height:18px;flex:none;display:inline-block;vertical-align:middle}
h1,h2,h3{margin:0;font-family:var(--f-display);text-wrap:balance}
h2{font-size:21px;font-weight:700}

#app{height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;position:relative;background:var(--bg)}
.topbar{display:flex;align-items:center;gap:10px;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--bg);z-index:5;min-height:64px}
.topbar .ttl{font-size:22px;font-weight:800;flex:1;min-width:0}
.icon-plain{width:36px;height:40px;display:grid;place-items:center;flex:none}
.icon-plain svg{width:24px;height:24px}
.me{position:relative;flex:none}
.me .ava{width:50px;height:50px;border:3px solid #3A4050}
.lvl{position:absolute;left:50%;bottom:-3px;transform:translateX(-50%);background:#3A4050;color:#fff;font:800 11px/1 var(--f-body);padding:3px 7px;border-radius:7px;min-width:20px;text-align:center}
.wallet{margin-left:auto;display:flex;align-items:center;gap:14px;background:var(--surface-2);border-radius:999px;padding:8px 16px;font-weight:800;font-size:17px}
.wallet span{display:flex;align-items:center;gap:6px}
.wallet .ic{width:22px;height:22px}
.bell{position:relative}
.bell .dot{position:absolute;top:7px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}
.view{flex:1;overflow-y:auto;overflow-x:hidden;padding-block:12px 28px;padding-left:max(0px,env(safe-area-inset-left,0px));padding-right:max(0px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch}
.view>*{flex-shrink:0}
.ava{border-radius:50%;overflow:hidden;flex:none;background:var(--surface-3);display:block}
.ava svg{display:block;width:100%;height:100%}

.sec{background:var(--surface);border-radius:26px;padding:22px max(18px,env(safe-area-inset-left,0px)) 20px;display:flex;flex-direction:column;gap:12px;margin:0 0}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.eyebrow{font-size:14px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:800}
.more{color:var(--gold);font-weight:800;font-size:14px;letter-spacing:.04em;text-transform:uppercase;display:flex;align-items:center;gap:4px}
.more svg{width:18px;height:18px}
.sub{color:var(--muted);font-size:14px;font-weight:600}
.inner{background:var(--surface-2);border-radius:20px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px}
.lvl-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.lvl-row b{font-size:19px;font-weight:800}
.lvl-row span{color:var(--muted);font-weight:800;font-size:16px}
.lvl-bar{height:30px;border-radius:999px;background:#0B0D13;position:relative;overflow:hidden}
.lvl-bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#B07A10,var(--gold));border-radius:999px}
.lvl-bar span{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 14px;font-weight:800;font-size:16px}

.row-item{display:grid;grid-template-columns:64px 1fr 22px;gap:14px;align-items:center;background:var(--surface-2);border-radius:20px;padding:14px 16px;text-align:left;width:100%}
.row-item .art{width:64px;height:58px;display:grid;place-items:center}
.row-item .art svg{width:60px;height:56px}
.row-item b{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;text-transform:uppercase;letter-spacing:.01em;flex-wrap:wrap}
.row-item b.nc{text-transform:none}
.row-item small{display:flex;align-items:center;gap:6px;color:var(--muted);font-weight:700;font-size:14px;margin-top:4px;flex-wrap:wrap}
.row-item small strong{color:var(--fg);font-size:16px}
.chev{width:20px;height:20px;flex:none}
.row-item .chev{width:22px;height:22px;color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:800;text-transform:none}
.pill-red{background:var(--red);color:#fff}
.pill-dim{background:var(--surface-3);color:var(--muted)}
.pill-gold{background:rgba(242,185,52,.15);color:var(--gold)}

.loc{position:relative;overflow:hidden;border-radius:16px;height:104px;text-align:left;width:100%;display:block;color:#fff}
.loc svg.scene{position:absolute;inset:0;width:100%;height:100%}
.loc::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,9,15,.55),rgba(7,9,15,.35))}
.loc>.c{position:absolute;inset:0;z-index:1;padding:14px 18px;display:flex;flex-direction:column;justify-content:space-between}
.loc .t{display:flex;justify-content:space-between;align-items:center}
.loc h3{font-family:var(--f-body);font-size:20px;font-weight:800}
.loc .stake{display:flex;align-items:center;gap:8px;font-weight:700;font-size:19px}
.loc .stake .ic{width:26px;height:26px}
.loc .pl{display:flex;align-items:center;gap:10px;font-size:26px;font-weight:700;letter-spacing:-.01em}
.loc.locked{filter:grayscale(.7) brightness(.7)}
.dots{display:flex;background:rgba(0,0,0,.35);border-radius:999px;padding:3px}
.dots i{width:30px;height:30px;border-radius:50%;margin-left:-9px;display:block;overflow:hidden;background:#2B2F3A;border:2px solid #1C1F27}
.dots i:first-child{margin-left:0}
.dots svg{width:100%;height:100%;display:block}

.fab{position:sticky;bottom:8px;align-self:center;z-index:4;margin-top:-6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border-radius:16px;padding:14px 22px;font-weight:800;font-size:16px;transition:transform .08s,filter .15s}
.btn:active{transform:scale(.97)}
.btn[disabled]{filter:grayscale(.8) brightness(.6);pointer-events:none}
.btn-play{background:linear-gradient(180deg,#FFCB5C,var(--play));color:#2A1A00;font-size:22px;padding:16px 36px;border-radius:18px;box-shadow:0 10px 30px -6px rgba(232,163,23,.55),0 2px 0 #9A6A06}
.btn-play svg{width:22px;height:22px}
.btn-gold{background:linear-gradient(180deg,#FFD067,var(--gold) 55%,var(--gold-2));color:var(--gold-ink);box-shadow:0 2px 0 #8A5B05}
.btn-dark{background:var(--surface-3);color:var(--fg)}
.btn-buy{background:var(--gold);color:var(--gold-ink);padding:9px 14px;font-size:14px;border-radius:10px;font-weight:800;white-space:nowrap}
.btn-block{width:100%}
.age{font-size:12px;color:var(--muted);text-align:center;line-height:1.5;padding:0 16px}

/* rooms */
.plain-head{display:flex;align-items:center;gap:8px;padding-block:14px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);min-height:64px}
.plain-head h1{font-size:24px;font-weight:800}
.room{display:flex;flex-direction:column;gap:8px;background:var(--surface-2);border-radius:20px;padding:16px 20px;text-align:left;width:100%}
.room b{font-family:var(--f-body);font-size:20px;font-weight:800}
.room .r2{display:flex;align-items:center;gap:10px;color:var(--muted);font-weight:800;font-size:17px}
.room .dots i{width:26px;height:26px}

/* tournament */
.pf{display:grid;grid-template-columns:1.6fr 1fr;gap:10px}
.pf .col{display:flex;flex-direction:column;gap:10px}
.tile{background:var(--surface-2);border-radius:16px;padding:12px;display:flex;align-items:center;gap:12px}
.tile .ic{width:44px;height:44px}
.tile b{display:block;font:800 26px/1 var(--f-display)}
.tile small{color:var(--muted);font-weight:800;font-size:14px}
.tile.cup{flex-direction:column;justify-content:center;text-align:center;gap:6px;color:var(--muted);font-weight:800;font-size:15px}
.tile.cup svg{width:76px;height:70px}
.ribbon{background:var(--red);color:#fff;font-weight:800;font-size:16px;padding:4px 16px 4px 22px;clip-path:polygon(10px 0,100% 0,100% 100%,10px 100%,0 50%);margin-right:calc(-1 * max(18px,env(safe-area-inset-right,0px)))}
.prow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 4px;border-bottom:1px solid var(--line)}
.prow:last-child{border-bottom:0}
.prow b{font-size:17px;font-weight:800}
.rew{display:flex;gap:14px;background:#15181F;padding:6px 14px;border-radius:999px;font-weight:800;font-size:18px}
.rew span{display:flex;align-items:center;gap:6px}
.rew .ic{width:24px;height:24px}
.bottom-bar{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:10px;padding-block:10px 12px;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));background:var(--bg)}
.bottom-bar .btn{padding:14px 8px}
.lb-row{display:grid;grid-template-columns:30px 36px 1fr auto;gap:10px;align-items:center;padding:8px;border-radius:12px}
.lb-row.me{background:rgba(242,185,52,.12)}
.lb-row .pos{font-weight:800;color:var(--muted);text-align:center}
.lb-row .pos.top{color:var(--gold)}
.lb-row .nm{font-weight:700;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-row .sc{font-weight:800;display:flex;align-items:center;gap:5px}

/* shop */
.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-radius:14px;padding:4px;gap:2px;margin:10px max(16px,env(safe-area-inset-left,0px)) 0}
.seg button{padding:9px 2px;border-radius:10px;font-weight:800;color:var(--muted);font-size:14.5px;white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--surface-3);color:var(--fg)}
.shop-list{display:flex;flex-direction:column;gap:12px}
.pack{background:var(--surface-2);border-radius:20px;padding:18px;display:flex;flex-direction:column;gap:14px}
.pack .amt{display:flex;align-items:center;gap:12px;font:800 30px/1 var(--f-display)}
.pack .amt .ic{width:36px;height:36px}
.pack .amt.gold{color:var(--gold)}
.pack .r{display:flex;align-items:center;gap:6px;flex-wrap:nowrap}
.pack .r .btn-buy{margin-left:auto}
.tagp{background:#15181F;border-radius:999px;padding:6px 10px;font-weight:800;font-size:14px;white-space:nowrap}
.tagp.disc{font-size:13px;color:var(--muted)}
.tagp.disc b{color:var(--fg)}
.good{background:var(--surface-2);border-radius:20px;padding:16px;display:grid;grid-template-columns:110px 1fr;gap:16px}
.good .ill{width:110px;height:110px;border-radius:14px;background:var(--surface-3);display:grid;place-items:center;font-size:62px;overflow:hidden}
.good .ill svg{width:100%;height:100%}
.good h3{font-family:var(--f-body);font-size:19px;font-weight:800}
.good p{margin:4px 0 0;color:var(--muted);font-weight:600;font-size:14.5px}
.good .own{color:#E06BD8;font-weight:800;font-size:14px;display:flex;align-items:center;gap:6px;margin-top:6px}
.good .foot{grid-column:1/-1;display:flex;align-items:center;justify-content:space-between;gap:10px}
.price-gold{display:flex;align-items:center;gap:6px;background:#15181F;border-radius:999px;padding:6px 12px;font-weight:800;font-size:17px}
.price-gold .ic{width:22px;height:22px}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:40;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{width:100%;max-width:520px;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:28px 28px 0 0;padding-block:10px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;animation:up .26s cubic-bezier(.2,.8,.2,1)}
.grab{width:46px;height:5px;border-radius:3px;background:#3A4050;align-self:center}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.x{width:34px;height:34px;border-radius:50%;background:var(--surface-3);display:grid;place-items:center;flex:none}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
@keyframes fade{from{opacity:0}}
.prose{color:#C9CEDA;font-size:14.5px;line-height:1.55}
.prose h4{margin:14px 0 4px;font-family:var(--f-display);font-size:14px;color:var(--fg)}
.prose p,.prose ul{margin:0 0 6px}
.prose ul{padding-left:18px}
.note{font-size:12px;color:var(--muted);text-align:center}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,420px)}
.toast{background:var(--surface-3);color:var(--fg);padding:10px 14px;border-radius:12px;font-weight:700;font-size:14px;box-shadow:0 10px 30px rgba(0,0,0,.5);animation:up .25s}
.slider5{position:relative;padding:18px 14px 6px}
.slider5 .trk{position:relative;height:10px;border-radius:5px;background:#2A2440}
.slider5 .fill{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--gold)}
.slider5 .stops{position:absolute;inset:-12px 0;display:flex;justify-content:space-between}
.slider5 .stops button{width:34px;height:34px;margin:0 -17px;display:grid;place-items:center}
.slider5 .stops button i{width:14px;height:14px;border-radius:50%;background:var(--gold);display:block}
.slider5 .stops button[aria-pressed="true"] i{width:34px;height:34px;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.slider5 .lbls{display:flex;justify-content:space-between;margin:22px -8px 0;font:800 20px var(--f-display);color:var(--muted)}
.picker{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.picker button{background:var(--surface-2);border:2px solid var(--line);border-radius:16px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:700;font-size:12px}
.picker button[aria-pressed="true"]{border-color:var(--gold)}
.picker .ava{width:64px;height:64px}
.field{display:flex;flex-direction:column;gap:6px}
.field input{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--fg);font:inherit;font-weight:700}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats div{background:var(--surface-2);border-radius:12px;padding:10px;text-align:center}
.stats b{display:block;font:800 18px var(--f-display)}
.stats small{color:var(--muted);font-weight:700;font-size:11.5px}
.lv-table{display:flex;flex-direction:column;gap:6px}
.lv-table div{display:flex;justify-content:space-between;background:var(--surface-2);border-radius:12px;padding:10px 12px;font-weight:700}
.lv-table div.cur{outline:2px solid var(--gold)}
.notif{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;background:var(--surface-2);border-radius:16px;padding:12px}
.notif .art svg{width:44px;height:44px}
.notif small{color:var(--muted);font-weight:700;display:block}

/* offer (full screen) */
.offer{position:fixed;inset:0;z-index:50;background:#000;display:flex;flex-direction:column;max-width:520px;margin:0 auto;animation:fade .2s}
.offer-top{display:flex;align-items:center;gap:14px;background:#1B1D22;padding-block:14px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px));margin-top:env(safe-area-inset-top,0px)}
.offer-top span{color:var(--muted);font-weight:800}
.offer-top b{font-weight:800;font-size:17px}
.offer-top button{margin-left:auto;width:36px;height:36px;display:grid;place-items:center}
.offer-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:24px max(18px,env(safe-area-inset-left,0px)) 10px}
.offer-body h2{font-family:var(--f-body);font-size:30px;font-weight:800;line-height:1.15}
.glow{font:800 44px/1 var(--f-display);color:#fff;text-shadow:0 0 18px rgba(255,255,255,.55);margin-top:10px}
.offer-big{display:flex;align-items:center;gap:10px;font:800 40px/1 var(--f-display);text-shadow:0 0 16px rgba(255,255,255,.4)}
.offer-big .ic{width:46px;height:46px}
.stacks{width:min(340px,90%);height:auto}
.bonus-row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.bonus-row span{background:#1F2128;border-radius:999px;padding:6px 14px;font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px}
.offer-foot{padding:12px max(18px,env(safe-area-inset-left,0px)) calc(16px + env(safe-area-inset-bottom,0px))}
.offer-foot .btn{width:100%;font-size:20px;padding:18px;background:linear-gradient(180deg,#F7CF5E,#E1AC2C);color:#3A2600;border-radius:18px}

/* slot */
.slot-cab{background:var(--surface-2);border-radius:18px;padding:16px 14px 14px;position:relative;border-top:10px solid #1F2330}
.slot-top{display:flex;justify-content:space-between;align-items:center;padding:0 6px}
.lamps{display:flex;gap:18px}
.lamps i{width:10px;height:10px;border-radius:50%;background:#F6E27A;box-shadow:0 0 8px #F6E27A;display:block;animation:lamp 1.2s infinite alternate}
.lamps i:nth-child(2n){animation-delay:.6s}
@keyframes lamp{to{opacity:.35}}
.slot-mid{display:grid;grid-template-columns:14px 1fr 14px;gap:10px;align-items:stretch;margin:14px 0}
.side-lamps{display:flex;flex-direction:column;justify-content:space-around;align-items:center}
.side-lamps i{width:10px;height:10px;border-radius:50%;background:#F6E27A;box-shadow:0 0 8px #F6E27A;display:block}
.reels{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:#05060A;border-radius:16px;padding:6px;border:6px solid #2C3040}
.reel{height:216px;overflow:hidden;border-radius:8px;background:#0B0D12;position:relative}
.strip{display:flex;flex-direction:column;will-change:transform}
.sym{height:72px;display:grid;place-items:center;font:800 30px/1 var(--f-display)}
.sym.win{animation:pulse .6s ease-in-out 3}
@keyframes pulse{50%{transform:scale(1.18);filter:drop-shadow(0 0 10px #FFD067)}}
.s-suit-r{color:#FF4D52}.s-suit-b{color:#E5E9F2}
.s-bar{font-size:16px;background:linear-gradient(#B6262B,#7C1418);color:#FFD9A0;padding:6px 8px;border-radius:7px;border:2px solid #E8B44A;letter-spacing:.06em}
.s-7{color:#E0262C;font-size:46px;-webkit-text-stroke:2px #FFD067}
.s-w{font-size:13px;background:linear-gradient(#78D35F,#2E8A37);color:#F6FFD9;padding:7px;border-radius:7px;border:2px solid #E8B44A;letter-spacing:.06em}
.s-azi{width:50px;height:50px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#7E5BEF,#3B1F8F 70%);color:#FFE6A0;font-size:12px;display:grid;place-items:center;border:3px solid #FFD067}
.slot-ctrl{display:grid;grid-template-columns:1fr auto auto 1fr;gap:14px;align-items:center;padding:0 8px}
.slot-ctrl .v{font:800 30px/1 var(--f-display)}

let AC=null;
function sfx(kind){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();
 const t=AC.currentTime;const tone=(f,d,type="triangle",v=.08,at=0)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.setValueAtTime(v,t+at);g.gain.exponentialRampToValueAtTime(.0001,t+at+d);o.connect(g).connect(AC.destination);o.start(t+at);o.stop(t+at+d)};
 if(kind==="card")tone(420,.06,"square",.03);
 else if(kind==="chip"){tone(1200,.05,"sine",.05);tone(1600,.05,"sine",.04,.04)}
 else if(kind==="win"){[523,659,784,1046].forEach((f,i)=>tone(f,.18,"triangle",.07,i*.09))}
 else if(kind==="lose")tone(220,.3,"sawtooth",.03);
 else if(kind==="tick")tone(900,.03,"square",.02);
 else if(kind==="turn"){tone(660,.1,"sine",.06);tone(880,.12,"sine",.06,.1)}
}catch(e){}}

const WHEEL_W=[22,18,16,20,8,4,10,2];
function wheelSheet(){const n=WHEEL.length,R=100,cx=110,cy=110;let segs="";
 WHEEL.forEach((w,i)=>{const a0=(i/n)*2*Math.PI-Math.PI/2-Math.PI/n,a1=a0+2*Math.PI/n;const x0=cx+R*Math.cos(a0),y0=cy+R*Math.sin(a0),x1=cx+R*Math.cos(a1),y1=cy+R*Math.sin(a1);

/* Торговля. Ставки считаются в «зрячих» единицах (bet). Кто играет в тёмную (не смотрел карты), платит половину. */
const isBlind=i=>!!occ(i).me&&!G.looked;
const haveOf=i=>occ(i).me?S.coins:occ(i).bal;
const costOf=(i,eff)=>isBlind(i)?Math.ceil(eff/2):eff;
function toCall(i){return Math.max(0,G.curBet-occ(i).bet)}

 if(act>=have){act=have;p.allIn=true;eff=isBlind(i)?act*2:act}
 if(p.me){S.coins-=act;G.myIn+=act;save()}else p.bal-=act;
 p.bet+=eff;p.rp=(p.rp||0)+act;p.contrib=(p.contrib||0)+act;G.pot+=act;sfx("chip")}

 else if(act==="call"){const c=toCall(i);pay(i,c);setBadge(i,p.allIn?"Ва-банк":c>0?"Уравнял":"Дальше",p.allIn?"b-raise":"b-call")}
 else if(act==="raise"){const mx=maxTarget(i);let t=clamp(target||minRaise(),Math.min(minRaise(),mx),mx);pay(i,t-p.bet);
  if(p.bet>G.curBet){G.curBet=p.bet;G.raises++;G.lastRaiser=i;G.acted=new Set()}
  setBadge(i,p.allIn?"Ва-банк":"Поднял","b-raise")}

 if(liveCount()===1){const w=G.seats.findIndex((q,k)=>inHand(k));return winHand(w,"Все сбросили карты")}

function handStrength(i){const h=occ(i).hand;let s=0;h.forEach(c=>{const pw=power(c);if(c.s===G.trumpS)s+=1+(pw>=100?1.6:pw/8);else s+=pw===8?.9:pw===7?.45:pw===6?.2:0});return s}
function botBet(i){if(!G||i<0||G.phase!=="bet"||G.turn!==i||!occ(i))return;const p=occ(i);const tc=toCall(i);
 const s=handStrength(i)*p.agg+rnd(-.45,.45)+(G.aziN?.3:0);

  bottom=`<div class="actions ${opening?"two":"three"}">
   <button class="btn btn-fold" data-act="bet" data-a="fold"><span class="bl1">Бросить</span></button>
   ${opening?"":`<button class="btn btn-call" data-act="bet" data-a="call"><span class="bv num">${fmt(cc)}</span><span class="bl1">${allInCall?"Ва-банк":"Уравнять"}</span></button>`}
   <button class="btn btn-raise" data-act="bet" data-a="raise" id="raiseBtn" ${canRaise(0)&&!allInCall?"":"disabled"}>${raiseBtnInner()}</button></div>`}
 else{let msg="";
  if(G.phase==="bet")msg=me.folded?"Вы бросили карты":`Торговля · думает ${esc(occ(G.turn)?.name||"")}`;
  else if(G.phase==="play")msg=myTurn?`Ваш ход${G.trick.length?" · масть хода "+SUITNAME[G.trick[0].card.s]:" — любой картой"}`:(me.inHand&&!me.folded?G.log||"Розыгрыш":"Вы наблюдаете за розыгрышем");
  else if(G.phase==="azi")msg="Ази! Решают, кто входит в переигровку";
  else if(G.phase==="end")msg="Следующая раздача через пару секунд";
  else if(G.phase==="broke")msg="Пополните фишки, чтобы продолжить";
  else msg="Раздаём карты…";
  bottom=`<div class="status-line">${msg}</div><nav class="toolbar" aria-label="Стол">
   <button data-act="leave" aria-label="Выйти из-за стола">${BACK}</button>
   <button data-act="chat" aria-label="Фразы">${I.smile}</button>
   <button data-act="history" aria-label="История раздачи">${I.box}</button>
   <button data-act="sound" aria-label="Звук">${S.sound?I.sound:I.mute}</button></nav>`}
 root.innerHTML=`<div class="arena" id="arena"><div class="felt"></div>
  <div class="room-pill num">Комната #${G.roomNo}<small>${G.st.name} · ставка ${fmt(G.ante)}${G.phase==="bet"&&G.curBet?` · торг ${fmt(G.curBet)}`:""}</small></div>
  ${center}${bets}${played}${seatsH}${myTurn&&G.phase==="bet"&&G.raiseUI?sliderHTML():""}
  ${G.banner?`<div class="banner"><h3>${esc(G.banner.t)}</h3><p class="num">${esc(G.banner.s)}</p></div>`:""}</div>
 <div class="dock"><div class="hand">${hand}</div>${bottom}</div>`;
 bindSlider();G.flip=false}
function raiseBtnInner(){if(!G.raiseUI)return `${I.up}<span class="bl1">Поднять</span>`;
 const lad=raiseLadder(0);const t=lad[G.raiseUI.idx];const c=costOf(0,t-occ(0).bet);return `<span class="bv num">${fmt(c)}</span><span class="bl1">${t>=maxTarget(0)?"Ва-банк":"Поднять"}</span>`}
function sliderHTML(){const lad=raiseLadder(0);const n=lad.length;const pct=n>1?G.raiseUI.idx/(n-1)*100:100;
 return `<div class="rslider" role="slider" aria-label="Сумма повышения" aria-valuemin="0" aria-valuemax="${n-1}" aria-valuenow="${G.raiseUI.idx}" tabindex="0" id="rsl">
  <span class="rs-cap">Ва-банк</span><div class="rs-track" id="rsTrack"><div class="rs-fill" style="height:${pct}%"></div><div class="rs-knob" style="bottom:${pct}%"></div></div><span class="rs-cap">мин</span></div>`}
function setRaiseIdx(k){const lad=raiseLadder(0);if(!G.raiseUI||!lad.length)return;k=clamp(k,0,lad.length-1);if(k===G.raiseUI.idx)return;G.raiseUI.idx=k;sfx("tick");
 const n=lad.length,pct=n>1?k/(n-1)*100:100;const f=$("#rsl .rs-fill"),kn=$("#rsl .rs-knob");if(f)f.style.height=pct+"%";if(kn)kn.style.bottom=pct+"%";$("#rsl").setAttribute("aria-valuenow",k);
 const b=$("#raiseBtn");if(b)b.innerHTML=raiseBtnInner()}
function bindSlider(){const tr=$("#rsTrack"),sl=$("#rsl");if(!tr)return;
 const at=e=>{const r=tr.getBoundingClientRect();const ratio=1-(e.clientY-r.top)/r.height;const n=raiseLadder(0).length;setRaiseIdx(Math.round(clamp(ratio,0,1)*(n-1)))};
 sl.addEventListener("pointerdown",e=>{e.preventDefault();sl.setPointerCapture(e.pointerId);at(e);const mv=ev=>at(ev);const up=()=>{sl.removeEventListener("pointermove",mv);sl.removeEventListener("pointerup",up);sl.removeEventListener("pointercancel",up)};sl.addEventListener("pointermove",mv);sl.addEventListener("pointerup",up);sl.addEventListener("pointercancel",up)});
 sl.addEventListener("keydown",e=>{if(e.key==="ArrowUp"||e.key==="ArrowRight"){setRaiseIdx(G.raiseUI.idx+1);e.preventDefault()}if(e.key==="ArrowDown"||e.key==="ArrowLeft"){setRaiseIdx(G.raiseUI.idx-1);e.preventDefault()}})}
const PHRASES=["Сәлем!","Жылдамырақ!","Рахмет, бауырым","Блеф па?","Бәрекелді!","Кешір, бауыр","Ойлан, ойлан…","Сәттілік!","Ха-ха-ха!","Козырь менде","Ази болады!","Карта жоқ…","Красиво!","Жарайсың!","Не спеши"];
function chatSheet(){openModal(`<div class="phrases">${PHRASES.map(p=>`<button data-act="say" data-t="${esc(p)}">${esc(p)}</button>`).join("")}</div>`)}
function historySheet(){openModal(`${sheetHead("История раздачи",`Комната #${G.roomNo}`)}<div class="hist">${(G.hist||[]).slice().reverse().map(h=>`<div>${esc(h)}</div>`).join("")||`<p class="note">Пока пусто</p>`}</div>`)}
function seatSheet(i){const p=occ(i);if(!p)return;if(p.me){profileSheet();return}
 openModal(`${sheetHead(esc(p.name),`Уровень ${p.lvl} · ${full(p.bal)} фишек`)}<div style="display:flex;justify-content:center"><span class="ava" style="width:96px;height:96px">${avatarSVG(p.av,p.hat)}</span></div>
 <div class="eyebrow" style="font-size:12px">Кинуть</div><div class="picker">${THROWS.map(t=>`<button data-act="throw" data-id="${t.id}" data-i="${i}" ${S.items[t.id]?"":"disabled style=\"opacity:.45\""}><span style="font-size:34px">${t.emo}</span>${t.name} · ${S.items[t.id]||0}</button>`).join("")}</div>
 <button class="btn btn-dark btn-block" data-act="shop-items">Купить ещё</button>`)}
function throwAt(i,id){if(!S.items[id]){toast("Закончились — купите в магазине");return}S.items[id]--;save();closeModal(true);
 const from=$(`[data-seat="0"] .ava`),to=$(`[data-seat="${i}"] .ava`);if(!from||!to)return;const a=from.getBoundingClientRect(),b=to.getBoundingClientRect();
 const t=THROWS.find(x=>x.id===id);const el=document.createElement("div");el.className="throw-fx";el.textContent=t.emo;el.style.left=(a.left+a.width/2-17)+"px";el.style.top=(a.top+a.height/2-20)+"px";document.body.appendChild(el);
 requestAnimationFrame(()=>{el.style.transform=`translate(${b.left-a.left}px,${b.top-a.top}px) rotate(540deg)`});
 setTimeout(()=>{el.remove();const sp=document.createElement("div");sp.className="splat";sp.textContent=id==="tomato"?"💥":id==="egg"?"🍳":"💐";sp.style.left=(b.left+b.width/2)+"px";sp.style.top=(b.top+b.height/2)+"px";document.body.appendChild(sp);sfx("chip");setTimeout(()=>sp.remove(),1300);
  if(Math.random()<.6)later(()=>emote(i,pick(id==="rose"?["Рахмет!","Жарайсың!"]:["Эй!","Кешір, бауыр","Ха-ха-ха!","Ну ты даёшь"])),500)},560)}

/* ================= events ================= */
function quickPlay(){const st=[...STAKES].reverse().find(s=>S.coins>=s.min)||STAKES[0];if(S.coins<st.min){toast(`Нужно от ${full(st.min)} фишек. Заберите бонус в уведомлениях.`);return}
 const rooms=makeRooms(st).filter(r=>r.n<r.max);const rm=rooms.length?pick(rooms):{max:6,n:ri(3,5),no:ri(4100,4999)};startTable(st,rm.max,rm.n,rm.no)}
document.addEventListener("click",e=>{
 const g=e.target.closest("[data-go]");if(g){if(view==="table")leaveTable();closeModal(true);go(g.dataset.go);return}
 const tb=e.target.closest("[data-tab]");if(tb){shopTab=tb.dataset.tab;render();return}
 const a=e.target.closest("[data-act]");if(!a)return;const act=a.dataset.act;
 switch(act){
  case "close":closeModal();break;
  case "profile":profileSheet();break;
  case "levels":levelsSheet();break;
  case "bell":bellSheet();break;
  case "rules":rulesSheet();break;
  case "tour-rules":tourRulesSheet();break;
  case "leaders":leadersSheet();break;
  case "bonus":closeModal(true);takeBonus();if(G&&G.phase==="broke"&&S.coins>=G.ante*4){renderTable();later(()=>{if(G&&G.phase==="broke")newHand(false)},400)}break;
  case "wheel":wheelSheet();break;
  case "slots":slotSheet();break;
  case "offer":offerScreen();break;
  case "buy-offer":demoPay("Специальная скидка · ₸2990",grantOffer);break;
  case "quick":closeModal(true);quickPlay();break;
  case "stake":{const st=STAKES.find(s=>s.id===a.dataset.id);if(S.coins<st.min){toast(`Для «${st.name}» нужно от ${full(st.min)} фишек`);break}go("rooms",st.id);break}
  case "join":{const st=STAKES.find(s=>s.id===viewArg);const rm=roomsCache[st.id][+a.dataset.i];if(rm.n>=rm.max){toast("Комната заполнена — выберите другую");break}startTable(st,rm.max,rm.n,rm.no);break}
  case "create":createSheet();break;
  case "cs":createSheet(+a.dataset.n);break;
  case "create-go":{const st=STAKES.find(s=>s.id===viewArg);closeModal(true);const n=+a.dataset.n;startTable(st,n,n-1,ri(4100,4999));break}
  case "buy-chips":{const p=CHIP_PACKS[+a.dataset.i];const amt=Math.round(p.c*(1+p.b/100));demoPay(`${fmt(amt)} фишек · ₸${p.p}`,()=>{S.coins+=amt;note(`Покупка: +${fmt(amt)} фишек`,"buy");save();renderWallet();sfx("win");toast(`+${fmt(amt)} фишек`)});break}
  case "buy-gold":{const p=GOLD_PACKS[+a.dataset.i];demoPay(`${p.g} золота · ₸${p.p}`,()=>{S.gems+=p.g;note(`Покупка: +${p.g} золота`,"buy");save();renderWallet();sfx("win");toast(`+${p.g} золота`)});break}
  case "buy-throw":{const t=THROWS.find(x=>x.id===a.dataset.id);if(S.coins<t.price){toast("Не хватает фишек");break}S.coins-=t.price;S.items[t.id]=(S.items[t.id]||0)+t.pack;save();render();toast(`${t.name}: +${t.pack}`);break}
  case "buy-hat":{const h=HATS.find(x=>x.id===a.dataset.id);if(S.gems<h.price){toast("Не хватает золота");shopTab="gold";render();break}S.gems-=h.price;S.hats.push(h.id);S.hat=h.id;save();render();toast(`${h.name} — надето`);break}
  case "wear":{S.hat=S.hat===a.dataset.id?null:a.dataset.id;if(G&&occ(0))occ(0).hat=S.hat;save();render();break}
  case "buy-av":{const av=PREM_AV.find(x=>x.id===a.dataset.id);if(S.gems<av.price){toast("Не хватает золота");shopTab="gold";render();break}S.gems-=av.price;S.ownedAv.push(av.id);S.av=av.id;save();render();toast(`Аватар «${av.name}» выбран`);break}
  case "use-av":{S.av=a.dataset.id;save();if(G&&occ(0))occ(0).av=myAv();const inSheet=!!a.closest(".sheet");if(view==="table")renderTable();else render();if(inSheet)profileSheet();break}
  case "sound":S.sound=!S.sound;save();if(view==="table")renderTable();else{closeModal(true);toast(S.sound?"Звук включён":"Звук выключен")}break;
  case "leave":if(view==="table")leaveTable();break;
  case "shop-coins":leaveTable();shopTab="coins";go("shop");break;
  case "shop-items":leaveTable();shopTab="items";go("shop");break;
  case "bet":{const k=a.dataset.a;if(k==="raise"){if(!G.raiseUI){G.raiseUI={idx:0};renderTable();sfx("tick")}else{const lad=raiseLadder(0);betAction(0,"raise",lad[G.raiseUI.idx])}}else betAction(0,k);break}
  case "look":if(G&&!G.looked){G.looked=true;G.flip=true;G.raiseUI=null;sfx("card");renderTable()}break;
  case "play":{const c=occ(0).hand.find(x=>x.id===a.dataset.id);if(c)playCard(0,c);break}
  case "chat":chatSheet();break;
  case "history":historySheet();break;
  case "say":closeModal(true);emote(0,a.dataset.t);if(Math.random()<.5){const others=G.seats.map((p,i)=>i).filter(i=>i>0&&occ(i));if(others.length)later(()=>emote(pick(others),pick(["Ха-ха-ха!","Сәлем!","Рахмет!","Посмотрим"])),900)}break;
  case "seat":seatSheet(+a.dataset.i);break;
  case "throw":throwAt(+a.dataset.i,a.dataset.id);break;
  case "azi-join":closeModal(true);occ(0).join=true;finishAzi();break;
  case "azi-skip":closeModal(true);occ(0).join=false;finishAzi();break;
 }});

/* ================= ticking ================= */
function tick(){const now=Date.now();$$("[data-cd]").forEach(el=>{const left=+el.dataset.cd-now;el.textContent=el.dataset.cdfmt==="s"&&left<3600e3?dur(left):dur(left)})}
setInterval(()=>{tick();const t=tourInfo();if(S.tour.id!==t.id){tourRollover();if(view==="tour"||view==="home")render()}},1000);

/* ================= boot ================= */
tourRollover();ensureOffer();render();
if(!S.seen){S.seen=true;save();setTimeout(()=>openModal(`${sheetHead("Ази Клуб","Казахская карточная игра на фишки")}
 <div class="prose"><p>На старте у вас <b>${full(DEF.coins)}</b> фишек и <b>${DEF.gems}</b> золота.</p><ul><li>Выберите локацию и комнату, торгуйтесь в тёмную или с открытыми картами.</li><li>Возьмите 2 взятки из 3 и заберите банк.</li><li>Бонус каждые 3 часа и колесо удачи — в колокольчике.</li></ul></div>
 <button class="btn btn-play btn-block" style="font-size:19px" data-act="quick">${PLAY}Играть сейчас</button><button class="btn btn-dark btn-block" data-act="rules">Сначала правила</button>`),300)}
</script>
