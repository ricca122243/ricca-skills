    #o-name { top: 600px; font-size: 118px; font-weight: 900; letter-spacing: -0.04em; line-height: 1.1; }

      <div id="o-lglow"></div>

  <script>
    (() => {
      const BT = 60 / 98, H = BT / 2;
      const tl = gsap.timeline({ paused: true });
      const pEl = document.querySelector("#o-price");
      const fmt = (v) => String(v).replace(/\B(?=(\d{3})+(?!\d))/g, " ") + " ₸";
      const num = { v: 0 };
      tl.fromTo("#o-flash", { opacity: 0.85 }, { opacity: 0, duration: 0.4, ease: "power2.out" }, 0);
      tl.fromTo("#o-rays", { rotation: 0 }, { rotation: 110, duration: 7.5, ease: "none" }, 0);
      tl.fromTo("#o-glow", { opacity: 0.3 }, { opacity: 0.45, duration: 7.5, ease: "none" }, 0);
      // price
      tl.fromTo("#o-from", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, 0);
      tl.fromTo("#o-price", { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.3, ease: "expo.out" }, 0.04);
      tl.to(num, { v: 45000, duration: BT - 0.08, ease: "power3.out", onUpdate: () => { pEl.textContent = fmt(Math.round(num.v / 500) * 500); } }, 0.04);
      tl.fromTo("#o-price", { scale: 1.16 }, { scale: 1, duration: 0.4, ease: "power3.out", immediateRender: false }, BT);
      tl.fromTo("#o-flash", { opacity: 0.35 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, BT);
      ["#o-k0", "#o-k1", "#o-k2", "#o-k3"].forEach((c, i) => {
        tl.fromTo(c, { opacity: 0, x: i % 2 ? 900 : -900, skewX: i % 2 ? -16 : 16 }, { opacity: 1, x: 0, skewX: 0, duration: 0.36, ease: "back.out(1.3)" }, BT * 1 + i * H);
      });
      // out -> logo on the next bar
      tl.to("#o-pricewrap", { y: -1700, duration: 0.24, ease: "power3.in" }, BT * 4 - 0.25);
      tl.fromTo("#o-flash", { opacity: 0.4 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, BT * 4);
      const L = BT * 4;
      tl.fromTo("#o-logoimg", { opacity: 0, scale: 1.9 }, { opacity: 1, scale: 1, duration: 0.5, ease: "expo.out" }, L);
      tl.fromTo("#o-lglow", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.9, ease: "power3.out" }, L);
      tl.to("#o-lglow", { opacity: 0.6, scale: 1.12, duration: BT * 2, repeat: 3, yoyo: true, ease: "sine.inOut" }, L + 0.9);
      tl.fromTo("#o-tag", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, L + BT * 1.5);
      tl.fromTo("#o-cta", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2)" }, L + BT * 2);
      tl.fromTo("#o-tel", { opacity: 0, y: 50 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, L + BT * 3);
      // final hit on the downbeat, then CTA pulse on beats
      tl.fromTo("#o-flash", { opacity: 0.8 }, { opacity: 0, duration: 0.45, ease: "power2.out", immediateRender: false }, L + BT * 4);
      tl.fromTo("#o-logo", { scale: 1.06 }, { scale: 1, duration: 0.6, ease: "power3.out" }, L + BT * 4);
      for (let b = 4; b < 8; b++) tl.fromTo("#o-cta", { scale: 1.06 }, { scale: 1, duration: 0.4, ease: "power2.out", immediateRender: false }, L + BT * b + 0.001);
      tl.set({}, {}, 7.5);
      window.__timelines["offer"] = tl;
    })();
  </script>
