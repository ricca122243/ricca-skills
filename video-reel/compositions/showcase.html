  <script>
    (() => {
      const BT = 60 / 98, SEG = BT * 4, N = 7, TOTAL = SEG * N;
      const tl = gsap.timeline({ paused: true });
      const QS = ["диван на заказ", "матрасы алматы", "премиальные часы", "ресторан в алматы", "ремонт самоката", "английский для детей", "собрать диван в 3D"];
      const GH = ["МЕБЕЛЬ ", "МАТРАСЫ ", "ЧАСЫ ", "РЕСТОРАН ", "СЕРВИС ", "ШКОЛА ", "3D 3D "];
      const qEl = document.querySelector("#p-q"), gEl = document.querySelector("#p-ghost");
      for (let k = 0; k < N; k++) { const el = document.querySelector("#p-t" + k); const r = el.scrollWidth; if (r > 820) el.style.fontSize = (104 * 820 / r) + "px"; }

      tl.set("#p-phone", { transformPerspective: 2400, transformOrigin: "50% 50%" }, 0);
      tl.fromTo("#p-flash", { opacity: 0.9 }, { opacity: 0, duration: 0.4, ease: "power2.out" }, 0);
      tl.fromTo("#p-glow", { opacity: 0.25, scale: 0.9 }, { opacity: 0.4, scale: 1.1, duration: TOTAL, ease: "none" }, 0);
      tl.fromTo("#p-glow2", { opacity: 0.1, x: -200 }, { opacity: 0.28, x: 200, duration: TOTAL, ease: "none" }, 0);
      tl.fromTo("#p-ghost", { x: 0 }, { x: -4200, duration: TOTAL, ease: "none" }, 0);
      tl.fromTo("#p-caret", { opacity: 1 }, { opacity: 0, duration: 0.01, repeat: 59, repeatDelay: 0.27, yoyo: true, ease: "steps(1)" }, 0);
      tl.fromTo("#p-pill", { y: -360 }, { y: 0, duration: 0.5, ease: "back.out(1.5)" }, 0);
      tl.fromTo("#p-float", { y: 10 }, { y: -12, duration: BT * 2, repeat: N * 2 - 1, yoyo: true, ease: "sine.inOut" }, 0);

      // first entrance
      tl.fromTo("#p-phone", { y: 1500, rotationY: -220, rotationZ: -24, rotationX: 0, scale: 0.3, x: 0, opacity: 1 }, { y: 0, rotationY: -16, rotationZ: 2, rotationX: 6, scale: 1, duration: 0.75, ease: "expo.out" }, 0);
      tl.to("#p-phone", { rotationY: -8, duration: SEG - 0.95, ease: "sine.inOut" }, 0.75);
      for (let k = 1; k < N; k++) {
        const t0 = k * SEG, last = k === N - 1, style = last ? 0 : k % 3, dir = k % 2 ? 1 : -1;
        if (style === 1) { // whip sideways
          tl.to("#p-phone", { x: -1300 * dir, rotationY: -70 * dir, duration: 0.2, ease: "power3.in" }, t0 - 0.2);
          tl.fromTo("#p-phone", { x: 1300 * dir, rotationY: 70 * dir, rotationZ: -3 * dir, y: 0, scale: 1, opacity: 1 }, { x: 0, rotationY: 15 * dir, rotationZ: -2 * dir, rotationX: 4, duration: 0.6, ease: "expo.out", immediateRender: false }, t0);
        } else if (style === 2) { // fall in from the camera
          tl.to("#p-phone", { scale: 0.15, y: 400, opacity: 0, duration: 0.2, ease: "power3.in" }, t0 - 0.2);
          tl.fromTo("#p-phone", { scale: 2.6, y: -200, x: 0, opacity: 0, rotationY: 0, rotationX: 24, rotationZ: 0 }, { scale: 1.05, y: 0, opacity: 1, rotationY: -11 * dir, rotationX: 7, duration: 0.6, ease: "expo.out", immediateRender: false }, t0);
        } else { // flip around its axis
          tl.to("#p-phone", { rotationY: 90, duration: 0.2, ease: "power2.in" }, t0 - 0.2);
          tl.fromTo("#p-phone", { rotationY: -90, x: 0, opacity: 1 }, { rotationY: -7 * dir, rotationX: 5, rotationZ: 0, scale: last ? 1.3 : 1, y: last ? 250 : 0, duration: 0.6, ease: "expo.out", immediateRender: false }, t0);
        }
        tl.to("#p-phone", { rotationY: 8 * dir, duration: SEG - 0.85, ease: "sine.inOut" }, t0 + 0.6);
      }
      tl.to("#p-phone", { scale: 4.2, opacity: 0, duration: 0.24, ease: "power3.in" }, TOTAL - 0.25);

      for (let k = 0; k < N; k++) {
        const t0 = k * SEG;
        const st = { n: 0 };
        tl.to(st, { n: QS[k].length, duration: 0.5, ease: "none", onUpdate: () => { qEl.textContent = QS[k].slice(0, Math.round(st.n)); gEl.textContent = GH[k].repeat(10); } }, t0 + 0.02);
        tl.fromTo("#p-pill", { scale: 1.06 }, { scale: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, t0 + 0.52);
        tl.set("#p-l" + k, { opacity: 1 }, t0 + 0.12);
        tl.fromTo("#p-t" + k, { yPercent: 115, rotation: 4 }, { yPercent: 0, rotation: 0, duration: 0.5, ease: "expo.out" }, t0 + 0.12);
        tl.fromTo("#p-s" + k, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t0 + 0.38);
        tl.to("#p-l" + k, { opacity: 0, y: -40, duration: 0.16, ease: "power2.in" }, t0 + SEG - 0.18);
        tl.fromTo("#p-glare", { x: -420 }, { x: 760, duration: 0.8, ease: "power2.inOut", immediateRender: false }, t0 + 0.35);
        for (let b = 1; b < 4; b++) tl.fromTo("#p-punch", { scale: 1.035 }, { scale: 1, duration: 0.32, ease: "power2.out", immediateRender: false }, t0 + b * BT);
        if (k > 0) tl.fromTo("#p-flash", { opacity: 0.3 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, t0);
      }
      // drifting particles (seeded, deterministic)
      const rnd = (i) => { const x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
      const dots = document.querySelector("#p-dots");
      for (let i = 0; i < 34; i++) {
        const d = document.createElement("div"); d.className = "p-dot";
        const sz = 4 + rnd(i) * 10; d.style.width = d.style.height = sz + "px";
        d.style.left = (rnd(i + 50) * 1080) + "px"; d.style.top = (400 + rnd(i + 90) * 1900) + "px";
        dots.appendChild(d);
        tl.fromTo(d, { y: 0, opacity: 0.15 + rnd(i + 7) * 0.5 }, { y: -(500 + rnd(i + 3) * 1500), duration: TOTAL, ease: "none" }, 0);
      }
      // shockwave rings on every beat, feature callouts on beats 2 and 3 of each site
      for (let k = 0; k < N; k++) {
        const t0 = k * SEG;
        for (let b = 0; b < 4; b++) {
          tl.fromTo("#p-r" + ((k * 4 + b) % 3), { scale: 0.55, opacity: b === 0 ? 0.9 : 0.5 }, { scale: b === 0 ? 2.6 : 1.9, opacity: 0, duration: 0.6, ease: "power2.out", immediateRender: false }, t0 + b * BT);
        }
        if (k < N - 1) {
          tl.fromTo("#p-g" + k + "a", { opacity: 0, x: -520, rotation: -10 }, { opacity: 1, x: 0, rotation: -3, duration: 0.45, ease: "back.out(1.8)" }, t0 + BT);
          tl.fromTo("#p-g" + k + "b", { opacity: 0, x: 520, rotation: 10 }, { opacity: 1, x: 0, rotation: 3, duration: 0.45, ease: "back.out(1.8)" }, t0 + BT * 2);
          tl.to("#p-g" + k + "a", { y: -12, duration: BT, yoyo: true, repeat: 1, ease: "sine.inOut" }, t0 + BT + 0.45);
          tl.to(["#p-g" + k + "a", "#p-g" + k + "b"], { opacity: 0, scale: 0.7, duration: 0.14, ease: "power2.in" }, t0 + SEG - 0.2);
        }
      }
      for (let i = 0; i < 4; i++) {
        const t = SEG * (N - 1) + i * BT;
        tl.fromTo("#p-c" + i, { opacity: 0, y: 50, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.28, ease: "back.out(2.4)" }, t + 0.04);
        tl.to("#p-c" + i, { opacity: 0, y: -30, duration: 0.12, ease: "power2.in" }, t + BT - 0.12);
      }
      tl.to("#p-pill", { y: -360, duration: 0.2, ease: "power2.in" }, TOTAL - 0.22);
      tl.set({}, {}, TOTAL);
      window.__timelines["showcase"] = tl;
    })();
  </script>
