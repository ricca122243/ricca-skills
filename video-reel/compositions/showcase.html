  <script>
    (() => {
      const BT = 60 / 98, SEG = BT * 4;
      const tl = gsap.timeline({ paused: true });
      const QS = ["диван на заказ", "матрасы алматы", "премиальные часы", "собрать диван в 3D"];
      const GH = ["МЕБЕЛЬ ", "МАТРАСЫ ", "ЧАСЫ ", "3D 3D "];
      const qEl = document.querySelector("#p-q"), gEl = document.querySelector("#p-ghost");
      const fit = (sel, w) => { const el = document.querySelector(sel); const r = el.scrollWidth; if (r > w) el.style.fontSize = (104 * w / r) + "px"; };
      ["#p-t0", "#p-t1", "#p-t2", "#p-t3"].forEach((s) => fit(s, 820));

      tl.set("#p-phone", { transformPerspective: 2400, transformOrigin: "50% 50%" }, 0);
      tl.fromTo("#p-flash", { opacity: 0.9 }, { opacity: 0, duration: 0.4, ease: "power2.out" }, 0);
      tl.fromTo("#p-glow", { opacity: 0.25, scale: 0.9 }, { opacity: 0.4, scale: 1.1, duration: SEG * 4, ease: "none" }, 0);
      tl.fromTo("#p-glow2", { opacity: 0.1, x: -200 }, { opacity: 0.28, x: 200, duration: SEG * 4, ease: "none" }, 0);
      tl.fromTo("#p-ghost", { x: 0 }, { x: -2600, duration: SEG * 4, ease: "none" }, 0);
      tl.fromTo("#p-caret", { opacity: 1 }, { opacity: 0, duration: 0.01, repeat: 31, repeatDelay: 0.27, yoyo: true, ease: "steps(1)" }, 0);
      tl.fromTo("#p-pill", { y: -360 }, { y: 0, duration: 0.5, ease: "back.out(1.5)" }, 0);
      // idle float for the whole scene
      tl.fromTo("#p-float", { y: 10 }, { y: -12, duration: BT * 2, repeat: 7, yoyo: true, ease: "sine.inOut" }, 0);

      // phone entrances / poses per segment
      tl.fromTo("#p-phone", { y: 1500, rotationY: -220, rotationZ: -24, rotationX: 0, scale: 0.3, x: 0, opacity: 1 }, { y: 0, rotationY: -16, rotationZ: 2, rotationX: 6, scale: 1, duration: 0.75, ease: "expo.out" }, 0);
      tl.to("#p-phone", { rotationY: -8, duration: SEG - 0.95, ease: "sine.inOut" }, 0.75);
      // -> ELUNA: whip out left, in from right
      tl.to("#p-phone", { x: -1300, rotationY: -70, duration: 0.2, ease: "power3.in" }, SEG - 0.2);
      tl.fromTo("#p-phone", { x: 1300, rotationY: 70, rotationZ: -3 }, { x: 0, rotationY: 15, rotationZ: -2, rotationX: 4, duration: 0.6, ease: "expo.out", immediateRender: false }, SEG);
      tl.to("#p-phone", { rotationY: 7, duration: SEG - 0.8, ease: "sine.inOut" }, SEG + 0.6);
      // -> VELMORA: drop away, fall in from the camera
      tl.to("#p-phone", { scale: 0.15, y: 400, opacity: 0, duration: 0.2, ease: "power3.in" }, SEG * 2 - 0.2);
      tl.fromTo("#p-phone", { scale: 2.6, y: -200, opacity: 0, rotationY: 0, rotationX: 24, rotationZ: 0 }, { scale: 1.05, y: 0, opacity: 1, rotationY: -11, rotationX: 7, duration: 0.6, ease: "expo.out", immediateRender: false }, SEG * 2);
      tl.to("#p-phone", { rotationY: 9, duration: SEG - 0.8, ease: "sine.inOut" }, SEG * 2 + 0.6);
      // -> 3D: flip around its axis into a close-up on the model
      tl.to("#p-phone", { rotationY: 90, duration: 0.2, ease: "power2.in" }, SEG * 3 - 0.2);
      tl.fromTo("#p-phone", { rotationY: -90, scale: 1.05, y: 0 }, { rotationY: -7, rotationX: 5, scale: 1.3, y: 250, duration: 0.6, ease: "expo.out", immediateRender: false }, SEG * 3);
      tl.to("#p-phone", { rotationY: 7, duration: SEG - 0.9, ease: "sine.inOut" }, SEG * 3 + 0.6);
      // exit into the price scene
      tl.to("#p-phone", { scale: 4.2, opacity: 0, duration: 0.24, ease: "power3.in" }, SEG * 4 - 0.25);

      for (let k = 0; k < 4; k++) {
        const t0 = k * SEG;
        // query typed into the pill
        const st = { n: 0 };
        tl.set(st, { n: 0, onComplete: () => {} }, t0);
        tl.to(st, { n: QS[k].length, duration: 0.5, ease: "none", onUpdate: () => { qEl.textContent = QS[k].slice(0, Math.round(st.n)); gEl.textContent = GH[k].repeat(8); } }, t0 + 0.02);
        tl.fromTo("#p-pill", { scale: 1.06 }, { scale: 1, duration: 0.3, ease: "power2.out", immediateRender: false }, t0 + 0.52);
        // label
        tl.set("#p-l" + k, { opacity: 1 }, t0 + 0.12);
        tl.fromTo("#p-t" + k, { yPercent: 115, rotation: 4 }, { yPercent: 0, rotation: 0, duration: 0.5, ease: "expo.out" }, t0 + 0.12);
        tl.fromTo("#p-s" + k, { opacity: 0, y: 26 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t0 + 0.38);
        tl.to("#p-l" + k, { opacity: 0, y: -40, duration: 0.16, ease: "power2.in" }, t0 + SEG - 0.18);
        // glare sweep + beat punches
        tl.fromTo("#p-glare", { x: -420 }, { x: 760, duration: 0.8, ease: "power2.inOut" }, t0 + 0.35);
        for (let b = 1; b < 4; b++) tl.fromTo("#p-punch", { scale: 1.035 }, { scale: 1, duration: 0.32, ease: "power2.out" }, t0 + b * BT);
        tl.fromTo("#p-floor", { opacity: 0.5, scaleX: 0.8 }, { opacity: 1, scaleX: 1, duration: 0.4, ease: "power2.out" }, t0 + 0.1);
        if (k > 0) tl.fromTo("#p-flash", { opacity: 0.3 }, { opacity: 0, duration: 0.3, ease: "power2.out", immediateRender: false }, t0);
      }
      // model name chips, one per beat, during the 3D segment
      for (let i = 0; i < 4; i++) {
        const t = SEG * 3 + i * BT;
        tl.fromTo("#p-c" + i, { opacity: 0, y: 50, scale: 0.8 }, { opacity: 1, y: 0, scale: 1, duration: 0.28, ease: "back.out(2.4)" }, t + 0.04);

      }
      tl.to("#p-pill", { y: -360, duration: 0.2, ease: "power2.in" }, SEG * 4 - 0.22);
      tl.set({}, {}, SEG * 4);
      window.__timelines["showcase"] = tl;
